<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tohfa | Category Feed Mockup</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    section::-webkit-scrollbar { display: none; }
    div::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen bg-[#f0e7dd] flex items-center justify-center p-6" style="font-family: 'DM Sans', sans-serif;">

  <!-- Phone Shell -->
  <div class="relative bg-white overflow-hidden flex flex-col" style="width: 390px; height: 844px; border-radius: 44px; box-shadow: 0 0 0 10px #1a1a1a, 0 40px 80px rgba(0,0,0,0.45), inset 0 0 0 1px #333;">
    <!-- Dynamic Island -->
    <div class="absolute top-3 left-1/2 -translate-x-1/2 z-50 bg-black rounded-full" style="width: 120px; height: 34px;"></div>

    <!-- Status Bar -->
    <div class="flex items-center justify-between px-8 pt-14 pb-1 bg-[#F7F3EC] flex-shrink-0 z-30">
      <span class="text-[12px] font-semibold text-[#1f1b15]">9:41</span>
      <div class="flex items-center gap-1">
        <span class="material-symbols-outlined text-[14px] text-[#1f1b15]">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-[14px] text-[#1f1b15]">wifi</span>
        <span class="material-symbols-outlined text-[14px] text-[#1f1b15]">battery_full</span>
      </div>
    </div>

    <!-- Top Nav -->
    <header class="bg-[#F7F3EC] border-b border-[#8FAF82]/50 flex items-center justify-between px-4 py-3 flex-shrink-0 z-30">
      <a class="font-bold text-[24px] italic text-[#3D6B4F] leading-none select-none cursor-pointer" style="font-family: 'Playfair Display', serif;">
        Tohfa<span class="text-[#C8973A]">.</span>
      </a>
      <div class="flex items-center gap-1">
        <button class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-[#8FAF82]/20 active:scale-90 transition-transform relative">
          <span class="material-symbols-outlined text-[#3D6B4F] text-[22px]">search</span>
        </button>
        <button class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-[#8FAF82]/20 active:scale-90 transition-transform relative">
          <span class="material-symbols-outlined text-[#3D6B4F] text-[22px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
          <span class="absolute top-1 right-1 w-2 h-2 bg-[#C8973A] rounded-full"></span>
        </button>
        <button class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-[#8FAF82]/20 active:scale-90 transition-transform relative">
          <span class="material-symbols-outlined text-[#3D6B4F] text-[22px]">shopping_cart</span>
          <span class="absolute top-0.5 right-0.5 w-4 h-4 bg-[#C8973A] rounded-full flex items-center justify-center text-[9px] text-white font-bold">3</span>
        </button>
      </div>
    </header>

    <!-- Category Identity Header -->
    <section class="relative flex items-center px-5 py-4 flex-shrink-0 overflow-hidden" style="background: linear-gradient(135deg, #F7F3EC 0%, #8FAF82 100%)">
      <div class="absolute inset-0 opacity-[0.06] pointer-events-none" style="background-image: repeating-linear-gradient(45deg, #3D6B4F 0, #3D6B4F 1px, transparent 0, transparent 50%); background-size: 10px 10px;"></div>
      <div class="flex items-center gap-3 z-10">
        <span class="text-[44px] drop-shadow-sm leading-none" id="cat-emoji">🏺</span>
        <div>
          <h2 class="text-[22px] font-bold text-[#3D6B4F] leading-tight" style="font-family: 'Playfair Display', serif;" id="cat-title">Studio Ceramics</h2>
          <p class="text-[11px] text-[#74786f] uppercase tracking-widest font-semibold mt-0.5" id="cat-count">48 active makes</p>
        </div>
      </div>
      <div class="absolute right-4 -bottom-4 opacity-[0.09]">
        <span class="material-symbols-outlined text-[80px] text-[#605e57] rotate-12">eco</span>
      </div>
    </section>

    <!-- Filter + Subcategory Row -->
    <section class="bg-white border-b border-[#F7F3EC] flex-shrink-0">
      <div class="flex items-center gap-2 px-4 pt-2.5 pb-2">
        <button id="filter-drawer-trigger" class="flex items-center gap-1.5 bg-[#F7F3EC] border border-[#c3c8c1] rounded-lg px-3 py-1.5 text-[#3D6B4F] active:scale-95 transition-transform flex-shrink-0">
          <span class="material-symbols-outlined text-[16px]">tune</span>
          <span class="text-[12px] font-semibold" id="filter-btn-label">Filter</span>
        </button>
        <div class="flex-1 relative">
          <select id="sort-select" class="w-full appearance-none bg-[#F7F3EC] border border-[#c3c8c1] rounded-lg pl-3 pr-7 py-1.5 text-[12px] text-[#444840] focus:outline-none focus:ring-1 focus:ring-[#3D6B4F]">
            <option value="newest">Newest</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="most_popular">Most Popular</option>
            <option value="top_rated">Best Rated</option>
          </select>
          <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-[14px] text-[#74786f] pointer-events-none">expand_more</span>
        </div>
      </div>
      <!-- Subcategory chips -->
      <div class="flex gap-2 overflow-x-auto px-4 pb-2.5 no-scrollbar" id="subcategory-container">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- Scrollable Product Content -->
    <section class="flex-1 overflow-y-auto bg-[#faf7f3] no-scrollbar">
      <!-- Carousel section -->
      <div class="flex gap-3 overflow-x-auto px-4 pt-4 pb-3 no-scrollbar" style="scroll-snap-type: x mandatory;" id="product-carousel">
        <!-- Injected via JS -->
      </div>

      <div class="px-4 pt-1 pb-2 flex items-center justify-between">
        <p class="text-[12px] text-[#74786f] italic" style="font-family: 'Playfair Display', serif;">Swipe to explore more makes →</p>
      </div>

      <!-- Vertical grid below -->
      <div class="px-4 pb-4 grid grid-cols-2 gap-3" id="product-grid">
        <!-- Injected via JS -->
      </div>

      <!-- Loading Indicator -->
      <div class="flex flex-col items-center py-6" id="loading-indicator">
        <div class="w-7 h-7 rounded-full border-4 border-[#3D6B4F]/10 border-t-[#3D6B4F] animate-spin"></div>
        <p class="text-[12px] text-[#3D6B4F] italic mt-2 animate-pulse" style="font-family: 'Playfair Display', serif;">Curation of more unique makes...</p>
      </div>
    </section>

    <!-- Bottom Nav -->
    <nav class="bg-white border-t border-[#F7F3EC] flex items-center justify-around px-4 pt-3 pb-6 flex-shrink-0">
      <button class="flex flex-col items-center gap-0.5 px-3 active:scale-90 transition-transform text-[#74786f]" onclick="navTo('home')">
        <span class="material-symbols-outlined text-[24px]">home</span>
        <span class="text-[10px] font-semibold">Home</span>
      </button>
      <button class="flex flex-col items-center gap-0.5 px-3 active:scale-90 transition-transform text-[#3D6B4F]" onclick="navTo('category')">
        <span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">category</span>
        <span class="text-[10px] font-semibold">Category</span>
        <div class="w-1 h-1 rounded-full bg-[#3D6B4F]"></div>
      </button>
      <button class="flex flex-col items-center gap-0.5 px-3 active:scale-90 transition-transform text-[#74786f]" onclick="navTo('reels')">
        <span class="material-symbols-outlined text-[24px]">movie</span>
        <span class="text-[10px] font-semibold">Reels</span>
      </button>
      <button class="flex flex-col items-center gap-0.5 px-3 active:scale-90 transition-transform text-[#74786f]" onclick="navTo('profile')">
        <span class="material-symbols-outlined text-[24px]">person</span>
        <span class="text-[10px] font-semibold">Profile</span>
      </button>
    </nav>

    <!-- Filter Drawer Backdrop -->
    <div id="filter-backdrop" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 transition-opacity duration-300 opacity-0 pointer-events-none"></div>
    
    <!-- Filter Drawer -->
    <div id="filter-drawer" class="fixed bottom-0 left-0 right-0 bg-white z-50 rounded-t-2xl shadow-2xl transition-transform duration-300 ease-out translate-y-full max-h-[80vh] flex flex-col">
      <div class="flex justify-center pt-3 pb-1">
        <div class="w-10 h-1 bg-[#c3c8c1] rounded-full"></div>
      </div>
      <div class="flex items-center justify-between px-5 py-3 border-b border-[#F7F3EC]">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[#3D6B4F] text-[20px]">tune</span>
          <h3 class="text-[#3D6B4F] font-bold text-[16px]" style="font-family: 'Playfair Display', serif;">Filters</h3>
        </div>
        <button id="filter-drawer-close" class="p-1 rounded-full hover:bg-[#F7F3EC]">
          <span class="material-symbols-outlined text-[20px] text-[#605e57]">close</span>
        </button>
      </div>
      <div class="overflow-y-auto px-5 py-4 space-y-5 flex-1">
        <!-- Price Range -->
        <div>
          <p class="text-[10px] font-bold uppercase tracking-widest text-[#3D6B4F] mb-2">Price Range</p>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-[10px] text-[#74786f] block mb-1">Min (₹)</label>
              <input type="number" id="filter-min-price" placeholder="0" class="w-full border border-[#c3c8c1] rounded-lg px-3 py-2 text-sm text-[#1f1b15] focus:outline-none focus:ring-1 focus:ring-[#3D6B4F]">
            </div>
            <div>
              <label class="text-[10px] text-[#74786f] block mb-1">Max (₹)</label>
              <input type="number" id="filter-max-price" placeholder="10000" class="w-full border border-[#c3c8c1] rounded-lg px-3 py-2 text-sm text-[#1f1b15] focus:outline-none focus:ring-1 focus:ring-[#3D6B4F]">
            </div>
          </div>
        </div>
        <!-- Rating -->
        <div>
          <p class="text-[10px] font-bold uppercase tracking-widest text-[#3D6B4F] mb-2">Minimum Rating</p>
          <div class="flex flex-col gap-1">
            <label class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-[#F7F3EC] cursor-pointer">
              <input type="radio" name="rating-filter" value="" class="accent-[#3D6B4F]" checked>
              <span class="text-sm text-[#1f1b15]">Any Rating</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-[#F7F3EC] cursor-pointer">
              <input type="radio" name="rating-filter" value="4" class="accent-[#3D6B4F]">
              <span class="text-sm text-[#1f1b15]">⭐ 4+ Stars</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-[#F7F3EC] cursor-pointer">
              <input type="radio" name="rating-filter" value="3" class="accent-[#3D6B4F]">
              <span class="text-sm text-[#1f1b15]">⭐ 3+ Stars</span>
            </label>
          </div>
        </div>
        <!-- Availability -->
        <div>
          <p class="text-[10px] font-bold uppercase tracking-widest text-[#3D6B4F] mb-2">Availability</p>
          <div class="flex flex-col gap-1">
            <label class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-[#F7F3EC] cursor-pointer">
              <input type="radio" name="avail-filter" value="" class="accent-[#3D6B4F]" checked>
              <span class="text-sm text-[#1f1b15]">All Items</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-[#F7F3EC] cursor-pointer">
              <input type="radio" name="avail-filter" value="in_stock" class="accent-[#3D6B4F]">
              <span class="text-sm text-[#1f1b15]">In Stock</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-[#F7F3EC] cursor-pointer">
              <input type="radio" name="avail-filter" value="made_to_order" class="accent-[#3D6B4F]">
              <span class="text-sm text-[#1f1b15]">Made to Order</span>
            </label>
          </div>
        </div>
      </div>
      <!-- Footer -->
      <div class="px-5 py-3 border-t border-[#F7F3EC] flex gap-3 bg-white">
        <button id="filter-clear-btn" class="flex-1 py-2.5 border border-[#c3c8c1] text-[#605e57] rounded-xl text-sm font-semibold">Clear All</button>
        <button id="filter-apply-btn" class="flex-1 py-2.5 bg-[#3D6B4F] text-white rounded-xl text-sm font-semibold active:scale-95 transition-transform">Apply Filters</button>
      </div>
    </div>

    <!-- Cart Toast -->
    <div id="cart-toast" class="absolute bottom-24 left-4 right-4 bg-[#3D6B4F] text-white text-[13px] font-semibold rounded-xl px-4 py-3 shadow-lg transition-all duration-300 z-50 flex items-center gap-2 opacity-0 translate-y-4 pointer-events-none">
      <span class="material-symbols-outlined text-[18px]">check_circle</span>
      <span id="toast-message">"Product" added to cart!</span>
    </div>
  </div>

  <script>
    // Mock Data
    const PRODUCTS = [
      { id: 1, name: "Speckled Moon Bowl", price: "₹3,999", rating: 4.8, reviews: 124, seller: "Priya Ceramics", tag: "bestseller", wishlisted: false, img: "https://lh3.googleusercontent.com/aida-public/AB6AXuALC6UYYOUWjs3W4VkD8uWjcppHVpQhleCxmEGF6UAFY8zCGq3M9x6zGcZb7ATlZPZWyZLbSbkv6C58GzEpFbGJJF7JEwus4RG0AzgYM1uMpb92qU1vu8i14hzLiI8fu0O8r26llYaiEO1t5Q9kPxeoUw1n4rvUdAC5wtPtJiaCY0kStW5phf-aTpMsoEorrV1be7nbHSSBZTPskASzrBSMxaqLYGItxSzojxseeJL8bn5hlwwz74rh9mHDKiSU_JfgVPudS3_BDcE" },
      { id: 2, name: "Forest Dip Espresso Set", price: "₹2,699", rating: 4.5, reviews: 88, seller: "Studio Mitti", tag: "sponsored", wishlisted: true, img: "https://lh3.googleusercontent.com/aida-public/AB6AXuAVOngRd-DVK72EyammumZPlK3sZdreV15xeleG5jZxygwSOJ09GzEOyVEuHGwUtHyHCjfb5iNmcXFEHLNU7dEdOrvZrIJ_SKc4RWteMPfH4UQt1iQ8fDsEpRhg7R0UA4jLfpudhLGVyoicGdIvGeezmZSBt5ehdb7pd2A6sr4tAHk8UyPCdXKv-zBNShdIwAEt7czXe-trxM6QSdALpWd-4QnZTcoprR1gR0j9mbqGZFAmnUcUnX5kvHlmhlV2oFJryqm0PKX-pbg" },
      { id: 3, name: "Sage Ribbed Carafe", price: "₹7,100", rating: 4.9, reviews: 56, seller: "Arth Studio", tag: "bestseller", wishlisted: false, img: "https://lh3.googleusercontent.com/aida-public/AB6AXuBfTUELyuKQTKXZ8luOpxbP9ZxSrvRQDToCQ0N18Chw5sTUg82THIln8Ywpy6ROctrBVZxm4zFsYwHOuhtAI92ZCIAbpe4eqUYATYVv7s9zWjEG9SfkJyQSQdzQBsrnhvLPPvDNP_-gMX3s304PZA5qDh3Joi58lbJcAkG31FdyaiEJhovOjCwL0xUY1mFiuqNY1vjkip3sOainPZ_dkH3YAFlh143DRgVjCKL1NQONSkN_iExDgNpXIkfSJ-VXTND2mi3OdvzYZrs" },
      { id: 4, name: "Petal Ring Dish", price: "₹1,999", rating: 4.3, reviews: 212, seller: "Hands of Clay", tag: "custom", wishlisted: false, img: "https://lh3.googleusercontent.com/aida-public/AB6AXuBnYwodC8O5OBIoHWDoOMQ_wndi6zN0wBAKqxarh1XKgMAwXhMz0eCaH5Wkv8xfSozcufOwFAreoGEys_Za0DK4CVqLAXxxQj2tFv-SxeEi3WaPLuHQNmvN_r_nTcljqc3Wdam1xn2LaMHwxF_rVy9UPcLza3R17VZXHodaznYkCDfp2J_pZ-GlA0qAOUsvFbwDA3jkJkx7vU1RFPUk_sgAmCNoVe9lWC9izWoIbkDhT3DxWPNVqGj9RPcExPbmQn9G0B9rZPcagxs" },
      { id: 5, name: "Oatmeal Pinch Pot", price: "₹899", rating: 4.6, reviews: 34, seller: "Priya Ceramics", tag: null, wishlisted: false, img: "https://lh3.googleusercontent.com/aida-public/AB6AXuALC6UYYOUWjs3W4VkD8uWjcppHVpQhleCxmEGF6UAFY8zCGq3M9x6zGcZb7ATlZPZWyZLbSbkv6C58GzEpFbGJJF7JEwus4RG0AzgYM1uMpb92qU1vu8i14hzLiI8fu0O8r26llYaiEO1t5Q9kPxeoUw1n4rvUdAC5wtPtJiaCY0kStW5phf-aTpMsoEorrV1be7nbHSSBZTPskASzrBSMxaqLYGItxSzojxseeJL8bn5hlwwz74rh9mHDKiSU_JfgVPudS3_BDcE" },
      { id: 6, name: "Marbled Tea Cup Duo", price: "₹2,200", rating: 4.7, reviews: 67, seller: "Studio Mitti", tag: "sponsored", wishlisted: true, img: "https://lh3.googleusercontent.com/aida-public/AB6AXuAVOngRd-DVK72EyammumZPlK3sZdreV15xeleG5jZxygwSOJ09GzEOyVEuHGwUtHyHCjfb5iNmcXFEHLNU7dEdOrvZrIJ_SKc4RWteMPfH4UQt1iQ8fDsEpRhg7R0UA4jLfpudhLGVyoicGdIvGeezmZSBt5ehdb7pd2A6sr4tAHk8UyPCdXKv-zBNShdIwAEt7czXe-trxM6QSdALpWd-4QnZTcoprR1gR0j9mbqGZFAmnUcUnX5kvHlmhlV2oFJryqm0PKX-pbg" }
    ];

    const SUBCATEGORIES = ["All", "Bowl", "Cup", "Espresso Set", "Carafe", "Dish", "Vase", "Mug"];
    let activeSub = "All";
    let sort = "newest";
    let wishlist = new Set([2, 6]);

    // Initialize UI
    function initUI() {
      renderSubcategories();
      renderProducts();
      setupEvents();
    }

    function renderSubcategories() {
      const container = document.getElementById("subcategory-container");
      container.innerHTML = SUBCATEGORIES.map(sub => {
        const isActive = sub === activeSub;
        const btnClass = isActive 
          ? "bg-[#8FAF82] text-white shadow-sm" 
          : "bg-[#F7F3EC] border border-[#c3c8c1] text-[#444840]";
        return `<button onclick="selectSubcategory('${sub}')" class="flex-shrink-0 px-4 py-1 rounded-full text-[12px] font-semibold transition-all active:scale-95 ${btnClass}">${sub}</button>`;
      }).join("");
    }

    function selectSubcategory(sub) {
      activeSub = sub;
      renderSubcategories();
      renderProducts();
    }

    function getBadgeHtml(tag) {
      if (!tag) return "";
      const styles = {
        bestseller: "bg-[#C85A32] text-white",
        sponsored: "bg-amber-500 text-white",
        custom: "bg-[#B492B7] text-white"
      };
      const labels = {
        bestseller: "Best Seller",
        sponsored: "Sponsored",
        custom: "Custom"
      };
      return `<span class="${styles[tag]} text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full leading-tight">${labels[tag]}</span>`;
    }

    function getProductCardHtml(p, isCarousel) {
      const isWishlisted = wishlist.has(p.id);
      const widthStyle = isCarousel ? "style='width: 62vw; max-width: 230px;'" : "";
      return `
        <div class="bg-white border border-[#c3c8c1] rounded-xl overflow-hidden shadow-sm flex-shrink-0" ${widthStyle}>
          <div class="relative aspect-square bg-[#F7F3EC]">
            <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover">
            ${p.tag ? `<div class="absolute top-2 left-2 flex flex-col gap-1">${getBadgeHtml(p.tag)}</div>` : ""}
            <button onclick="toggleWishlist(${p.id})" class="absolute top-2 right-2 w-7 h-7 bg-white/90 backdrop-blur-sm rounded-full flex items-center justify-center shadow-sm active:scale-90 transition-transform">
              <span class="material-symbols-outlined text-[16px] text-red-500" style="font-variation-settings: 'FILL' ${isWishlisted ? 1 : 0}, 'color' '${isWishlisted ? '#e53e3e' : '#3D6B4F'}';">
                favorite
              </span>
            </button>
          </div>
          <div class="p-2.5">
            <div class="flex items-center justify-between mb-0.5">
              <p class="text-[13px] font-bold text-[#C8973A] leading-tight" style="font-family: 'DM Sans', sans-serif;">${p.price}</p>
              <div class="flex items-center gap-1">
                <span class="text-[#C8973A] text-[11px] font-bold">★</span>
                <span class="text-[11px] font-semibold text-[#1f1b15]">${p.rating}</span>
                <span class="text-[10px] text-[#605e57]">(${p.reviews})</span>
              </div>
            </div>
            <h4 class="text-[13px] font-semibold text-[#1f1b15] leading-snug line-clamp-1 mb-0.5" style="font-family: 'Playfair Display', serif;">${p.name}</h4>
            <p class="text-[10px] text-[#605e57] mb-2">By ${p.seller}</p>
            <button onclick="addToCart(${p.id}, '${p.name.replace(/'/g, "\\'")}')" class="w-full bg-[#3D6B4F] text-white text-[11px] font-semibold py-1.5 rounded-lg active:scale-95 transition-transform" style="font-family: 'DM Sans', sans-serif;">
              Add to Cart
            </button>
          </div>
        </div>
      `;
    }

    function renderProducts() {
      // Filter products by subcategory
      let filtered = PRODUCTS;
      if (activeSub !== "All") {
        filtered = PRODUCTS.filter(p => p.name.toLowerCase().includes(activeSub.toLowerCase()) || p.tag === activeSub.toLowerCase());
      }
      
      // Render carousel
      const carousel = document.getElementById("product-carousel");
      carousel.innerHTML = filtered.map(p => getProductCardHtml(p, true)).join("");

      // Render grid
      const grid = document.getElementById("product-grid");
      grid.innerHTML = filtered.map(p => getProductCardHtml(p, false)).join("");
    }

    function toggleWishlist(id) {
      if (wishlist.has(id)) {
        wishlist.delete(id);
      } else {
        wishlist.add(id);
      }
      renderProducts();
    }

    function addToCart(id, name) {
      const toast = document.getElementById("cart-toast");
      document.getElementById("toast-message").innerText = `"${name}" added to cart!`;
      toast.classList.remove("opacity-0", "translate-y-4", "pointer-events-none");
      toast.classList.add("opacity-100", "translate-y-0");
      setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-4", "pointer-events-none");
      }, 2000);
    }

    // Filter drawer functions
    function setupEvents() {
      const trigger = document.getElementById("filter-drawer-trigger");
      const close = document.getElementById("filter-drawer-close");
      const backdrop = document.getElementById("filter-backdrop");
      const drawer = document.getElementById("filter-drawer");
      const applyBtn = document.getElementById("filter-apply-btn");
      const clearBtn = document.getElementById("filter-clear-btn");

      function openDrawer() {
        drawer.classList.remove("translate-y-full");
        drawer.classList.add("translate-y-0");
        backdrop.classList.remove("opacity-0", "pointer-events-none");
        backdrop.classList.add("opacity-100");
      }

      function closeDrawer() {
        drawer.classList.remove("translate-y-0");
        drawer.classList.add("translate-y-full");
        backdrop.classList.remove("opacity-100");
        backdrop.classList.add("opacity-0", "pointer-events-none");
      }

      trigger.addEventListener("click", openDrawer);
      close.addEventListener("click", closeDrawer);
      backdrop.addEventListener("click", closeDrawer);
      applyBtn.addEventListener("click", () => {
        // Implement filter application logic
        closeDrawer();
      });
      clearBtn.addEventListener("click", () => {
        document.getElementById("filter-min-price").value = "";
        document.getElementById("filter-max-price").value = "";
        closeDrawer();
      });
    }

    function navTo(page) {
      console.log("Navigating to: " + page);
    }

    window.onload = initUI;
  </script>
</body>
</html>
