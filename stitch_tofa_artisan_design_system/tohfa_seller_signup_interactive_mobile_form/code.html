<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #C9A84C !important;
            box-shadow: 0 0 0 1px #C9A84C;
        }
        .pill-selected {
            background-color: #144227 !important;
            color: #ffffff !important;
            border-color: #144227 !important;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .custom-checkbox:checked {
            background-color: #144227;
            border-color: #144227;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col">
<!-- Top App Bar (Sticky) -->
<header class="bg-primary-container text-on-primary-container h-16 w-full flex items-center justify-between px-margin-mobile sticky top-0 z-50 transition-all duration-300">
<div class="flex items-center gap-2">
<h1 class="font-headline-md italic text-on-primary-container tracking-tight">Tohfa.</h1>
</div>
<button class="material-symbols-outlined text-on-primary-container hover:opacity-80 active:scale-95 transition-transform" data-icon="arrow_forward">arrow_forward</button>
</header>
<main class="flex-grow">
<!-- Hero Section -->
<section class="bg-surface py-12 px-margin-mobile flex flex-col items-center text-center">
<h2 class="font-headline-md italic text-primary mb-4">Join Tohfa as a Seller</h2>
<div class="w-[60px] h-1 bg-accent-gold mb-6 rounded-full"></div>
<p class="text-on-surface-variant font-body-md max-w-[280px] leading-relaxed">
                Empower your craft and reach a community that values the human touch in every gift.
            </p>
</section>
<!-- Form Card Container -->
<section class="px-margin-mobile -mt-4 pb-20">
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(45,90,61,0.06)] border-b-4 border-accent-gold p-6 md:max-w-md mx-auto">
<form class="space-y-8" id="sellerForm">
<!-- Section: Personal Details -->
<div class="space-y-4">
<h3 class="text-primary font-label-sm uppercase tracking-widest text-[10px]">Personal Details</h3>
<div class="space-y-1">
<label class="font-label-md text-on-surface-variant">Full Name</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 text-body-md" placeholder="Enter your full name" type="text"/>
</div>
<div class="space-y-1">
<label class="font-label-md text-on-surface-variant">Phone &amp; WhatsApp</label>
<div class="flex">
<span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-outline-variant bg-surface-container-high text-on-surface-variant font-body-md">+91</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-r-lg px-4 py-3 text-body-md" placeholder="9876543210" type="tel"/>
</div>
</div>
<div class="space-y-1">
<label class="font-label-md text-on-surface-variant">Email</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 text-body-md" placeholder="your@example.com" type="email"/>
</div>
</div>
<hr class="border-t border-accent-gold/30"/>
<!-- Section: Shop Details -->
<div class="space-y-4">
<h3 class="text-primary font-label-sm uppercase tracking-widest text-[10px]">Shop Details</h3>
<div class="space-y-1">
<label class="font-label-md text-on-surface-variant">Instagram Handle</label>
<div class="flex">
<span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-outline-variant bg-surface-container-high text-on-surface-variant font-body-md">@</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-r-lg px-4 py-3 text-body-md" placeholder="yourbrand" type="text"/>
</div>
</div>
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface-variant">Short Bio</label>
<span class="text-[10px] text-outline" id="charCounter">0/200</span>
</div>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 text-body-md resize-none transition-all" id="bio" maxlength="200" placeholder="Tell us about your craft..." rows="3"></textarea>
</div>
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant">Product Categories</label>
<div class="flex flex-wrap gap-2" id="categoryContainer">
<button class="px-4 py-1.5 rounded-full border border-outline-variant text-label-md text-on-surface-variant hover:border-primary transition-all flex items-center gap-1" onclick="togglePill(this)" type="button">Handmade Decor</button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant text-label-md text-on-surface-variant hover:border-primary transition-all flex items-center gap-1" onclick="togglePill(this)" type="button">Jewelry</button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant text-label-md text-on-surface-variant hover:border-primary transition-all flex items-center gap-1" onclick="togglePill(this)" type="button">Textiles</button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant text-label-md text-on-surface-variant hover:border-primary transition-all flex items-center gap-1" onclick="togglePill(this)" type="button">Ceramics</button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant text-label-md text-on-surface-variant hover:border-primary transition-all flex items-center gap-1" onclick="togglePill(this, true)" type="button">Other</button>
</div>
<!-- Hidden Other Input -->
<div class="hidden mt-3 animate-in fade-in slide-in-from-top-2 duration-300" id="otherCategoryInput">
<input class="w-full bg-surface-container-low border border-accent-gold rounded-lg px-4 py-3 text-body-md italic" placeholder="Please describe your craft or product type" type="text"/>
</div>
</div>
</div>
<hr class="border-t border-accent-gold/30"/>
<!-- Section: Confirmation -->
<div class="space-y-4">
<h3 class="text-primary font-label-sm uppercase tracking-widest text-[10px]">Confirmation</h3>
<div class="space-y-3">
<label class="flex items-start gap-3 cursor-pointer group">
<input class="custom-checkbox mt-1 w-5 h-5 rounded border-outline-variant text-primary focus:ring-0" type="checkbox"/>
<span class="text-label-md text-on-surface-variant leading-tight">I confirm that all provided details are accurate and represent my authentic business.</span>
</label>
<label class="flex items-start gap-3 cursor-pointer group">
<input class="custom-checkbox mt-1 w-5 h-5 rounded border-outline-variant text-primary focus:ring-0" type="checkbox"/>
<span class="text-label-md text-on-surface-variant leading-tight">I agree to the <a class="text-accent-gold underline underline-offset-4 decoration-1" href="#">Terms &amp; Conditions</a> of Tohfa Marketplace.</span>
</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary py-4 rounded-[10px] text-white font-label-sm uppercase tracking-widest text-sm shadow-lg hover:shadow-xl active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="submit">
                        Submit &amp; Join Tohfa
                    </button>
</form>
</div>
</section>
</main>
<!-- Footer -->
<footer class="py-8 bg-surface text-center">
<p class="text-outline-variant font-label-md italic">
            Tohfa · Thoughtful Gifting, Made Effortless
        </p>
</footer>
<script>
        // Character counter for Bio
        const bioTextarea = document.getElementById('bio');
        const charCounter = document.getElementById('charCounter');
        bioTextarea.addEventListener('input', () => {
            const count = bioTextarea.value.length;
            charCounter.textContent = `${count}/200`;
            if (count >= 200) {
                charCounter.classList.add('text-error');
            } else {
                charCounter.classList.remove('text-error');
            }
        });

        // Pill Toggling Logic
        function togglePill(el, isOther = false) {
            el.classList.toggle('pill-selected');
            
            // Handle Icon insertion
            if (el.classList.contains('pill-selected')) {
                const icon = document.createElement('span');
                icon.className = 'material-symbols-outlined text-[16px] leading-none';
                icon.style.fontVariationSettings = "'FILL' 1";
                icon.textContent = 'check_circle';
                el.prepend(icon);
            } else {
                const icon = el.querySelector('.material-symbols-outlined');
                if (icon) icon.remove();
            }

            // Handle "Other" input visibility
            if (isOther) {
                const otherInput = document.getElementById('otherCategoryInput');
                otherInput.classList.toggle('hidden');
            }
        }

        // Form Submit Simulation
        document.getElementById('sellerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">verified</span> Application Sent!';
                btn.classList.replace('bg-primary', 'bg-accent-gold');
                
                setTimeout(() => {
                    alert('Thank you for applying! Our team will review your application and get back to you in 2-3 business days.');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.classList.replace('bg-accent-gold', 'bg-primary');
                    e.target.reset();
                    // Reset other input and pills
                    document.getElementById('otherCategoryInput').classList.add('hidden');
                    document.querySelectorAll('.pill-selected').forEach(pill => pill.classList.remove('pill-selected'));
                    document.querySelectorAll('.material-symbols-outlined').forEach(icon => {
                        if(icon.textContent === 'check_circle') icon.remove();
                    });
                }, 1500);
            }, 2000);
        });

        // Scroll shadow for header
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 10) {
                header.classList.add('shadow-md');
            } else {
                header.classList.remove('shadow-md');
            }
        });
    </script>
</body></html>
