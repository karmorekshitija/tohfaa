# Nginx Configuration for TohfaHub (thetohfa.in)
# Place in /etc/nginx/sites-available/tohfa and link to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name thetohfa.in www.thetohfa.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name thetohfa.in www.thetohfa.in;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/thetohfa.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thetohfa.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Max upload size for product photos (20MB)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml image/x-icon;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Frontend Static Files
    root /var/www/tohfa/frontend;
    index index.html;

    # Static Assets (Images, Icons, Fonts)
    location /img/ {
        alias /var/www/tohfa/frontend/public/img/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploaded User Content (Avatars, Listings, Banners)
    location /uploads/ {
        alias /var/www/tohfa/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff";
    }

    # API Proxy to Node.js / Express Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WhatsApp Webhook Endpoint
    location /api/whatsapp/ {
        proxy_pass http://127.0.0.1:8080/api/whatsapp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Router Fallback for HTML Pages
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
