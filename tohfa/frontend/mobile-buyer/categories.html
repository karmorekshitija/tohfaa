<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script src="/src/components/DeviceRedirect.js"></script>
<script>
    function getTohfaToken() {
        try {
            const user = JSON.parse(sessionStorage.getItem('tohfa_user') || '{}');
            return user.token || user.accessToken || user.access_token || sessionStorage.getItem('tohfa_access_token');
        } catch(e) {
            return sessionStorage.getItem('tohfa_access_token');
        }
    }
</script>
<script src="/src/components/ReportWidget.js" defer></script>
<script src="/src/components/ProtectedRoute.js"></script>
<meta charset="utf-8"/>
<title>Tohfa | Explore Crafts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes spin-mob { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-white text-[#1f1b15] min-h-screen overflow-x-hidden flex flex-col" style="font-family: 'DM Sans', sans-serif;">

  <!-- Phone view content edge-to-edge -->
  <div class="flex-grow flex flex-col w-full bg-white pb-24">

    <!-- Hero -->
    <div class="px-5 pt-5 pb-4 text-center" style="background: linear-gradient(to bottom, #F7F3EC, #ffffff);">
      <p style="font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#C8973A;margin-bottom:6px;">Browse by Craft</p>
      <h1 style="font-family:'Playfair Display',serif;font-size:24px;font-style:italic;color:#3D6B4F;line-height:1.2;margin-bottom:4px;">
        Find your gift ✦
      </h1>
      <p style="font-family:'DM Sans',sans-serif;font-size:12px;color:#74786f;">Handmade with care, found with love.</p>
    </div>

    <!-- Search -->
    <div class="px-5 py-3 bg-white sticky top-0 z-40">
      <div id="search-box" style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:#F7F3EC;border:1.5px solid transparent;transition:all 0.2s ease;">
        <span class="material-symbols-outlined" style="color:#74786f;font-size:18px;">search</span>
        <input type="text" id="search-input" placeholder="Search categories…" style="flex:1;background:transparent;outline:none;border:none;font-size:13px;color:#1f1b15;font-family:'DM Sans',sans-serif;" class="placeholder:text-[#74786f]">
      </div>
    </div>

    <!-- Bulk Orders Tile -->
    <div style="padding:0 20px;margin-bottom:16px;margin-top:4px;">
      <div onclick="window.location.href='/mobile-buyer/bulk.html'" style="position:relative;width:100%;height:170px;border-radius:18px;overflow:hidden;background:linear-gradient(140deg,#0A1A11 0%,#3D6B4F 100%);display:flex;align-items:center;cursor:pointer;transition:transform 0.2s ease,box-shadow 0.2s ease;" onmouseover="this.style.transform='scale(1.01)'" onmouseout="this.style.transform='scale(1)'">
        <!-- Amber left accent -->
        <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:#C8973A;"></div>
        <!-- Ambient halo -->
        <div style="position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:130px;height:130px;background:rgba(200,151,58,0.15);filter:blur(48px);border-radius:50%;pointer-events:none;"></div>
        <!-- Gift image -->
        <img
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvRYdWomJ2rT_t6DtY3CCP-w8l_2pbfQ7rLmoguWM8Ff0PkqGvxqCz4Mzs7xOuzT-xoYgR6wDk1woac8aoNhEv2pf2kJVCMam3luiJHMJdj0bzM7jT0eSKkG-HG9I1cdIq2vyRFaDMo9anB1x-1SiTVJdMWMcbYmTdIctulPlrNSH1r_8N31Jmcv00QHnfWjwmWlARYca__ybqYf13uWMwPwbQ4uSsklOQvUZp4_6AbhmJfROGV2Tm1vpv-zn48SY52QpUOe_yjec"
          alt="Bulk gift boxes"
          style="position:absolute;right:-8px;top:50%;transform:translateY(-52%) rotate(-3deg);width:115px;height:auto;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.45));"
        >
        <!-- Text content -->
        <div style="position:relative;z-index:10;padding-left:24px;width:62%;">
          <span style="display:inline-block;padding:2px 10px;border-radius:999px;background:rgba(200,151,58,0.14);color:#C8973A;font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:0.1em;margin-bottom:9px;">✦ BULK ORDERS</span>
          <h2 style="font-family:'Playfair Display',serif;font-size:27px;font-style:italic;color:#fff;line-height:1.1;margin-bottom:4px;">Bulk Orders</h2>
          <p style="font-family:'DM Sans',sans-serif;color:rgba(255,255,255,0.6);font-size:11px;line-height:1.4;margin-bottom:10px;">For large quantities &amp; gifting</p>
          <span style="color:#fff;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.3);padding-bottom:2px;">Explore →</span>
        </div>
      </div>
    </div>

    <!-- Section Header -->
    <div style="padding:0 20px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;">
      <p style="font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#74786f;">All Categories</p>
    </div>

    <!-- Category Grid -->
    <div style="padding:0 20px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;" id="categories-grid">
      <!-- Loading State -->
      <div class="col-span-full flex flex-col items-center justify-center py-20">
        <div class="relative w-10 h-10">
          <div class="absolute inset-0 border-4 border-primary/10 rounded-full"></div>
          <div class="absolute inset-0 border-4 border-[#3D6B4F] border-t-transparent rounded-full animate-spin"></div>
        </div>
        <p class="mt-4 text-[#74786f] text-sm italic">Unveiling workshops...</p>
      </div>
    </div>

    <!-- Divider -->
    <div class="flex justify-center py-6">
      <div class="relative w-32 h-px" style="background: #F7F3EC">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 px-3 bg-white">
          <span style="color: #8FAF82; font-size: 16px;">✦</span>
        </div>
      </div>
    </div>
  <script type="module">
    import apiClient from '/src/utils/apiClient.js';

    // Fallback placeholder category image URL. Keep in sync with frontend/admin/categories.html
    const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?q=80&w=800&auto=format&fit=crop';

    let allCategories = [];

    async function loadCategories() {
      try {
        const res = await apiClient.get('/categories');
        if (res.data && res.data.success) {
          allCategories = res.data.data.categories || [];
          renderCategories(allCategories);
        }
      } catch (err) {
        console.error("Failed to load categories:", err);
      }
    }

    function renderCategories(list) {
      const container = document.getElementById("categories-grid");
      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-20 text-secondary text-sm italic">No categories found.</div>`;
        return;
      }

      container.innerHTML = list.map(cat => {
        const displayName = cat.display_name || cat.name;
        const image = cat.image_url || FALLBACK_IMAGE;
        return `
          <div onclick="window.location.href='./category.html?slug=${cat.slug}'" class="flex flex-col items-center cursor-pointer transition-transform duration-200 active:scale-95">
            <div class="w-full rounded-xl overflow-hidden shadow-sm bg-[#F7F3EC] aspect-square">
              <img src="${image}" alt="${displayName}" class="w-full h-full object-cover" loading="lazy">
            </div>
            <span class="mt-1.5 text-center text-[11px] font-medium leading-snug text-[#3D6B4F]">
              ${displayName}
            </span>
          </div>
        `;
      }).join("");
    }

    async function updateBadges() {
      const token = getTohfaToken();
      if (!token) return;
      
      // Wishlist badge
      try {
        const res = await apiClient.get('/wishlist', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.data && res.data.success) {
          const items = res.data.data.items || res.data.data || [];
          if (items.length > 0) {
            document.getElementById('nav-wishlist-badge').classList.remove('hidden');
          }
        }
      } catch (e) {}

      // Cart badge
      try {
        const res = await apiClient.get('/cart', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.data && res.data.success) {
          const count = res.data.data.item_count || 0;
          const badge = document.getElementById('nav-cart-badge');
          if (badge) {
            badge.innerText = count;
            badge.classList.remove('hidden');
          }
        }
      } catch (e) {}
    }

    function setupSearch() {
      const input = document.getElementById("search-input");
      const box = document.getElementById("search-box");
      
      input.addEventListener("focus", () => {
        box.style.border = "1.5px solid #3D6B4F";
      });
      input.addEventListener("blur", () => {
        box.style.border = "1.5px solid transparent";
      });
      
      input.addEventListener("input", (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allCategories.filter(cat => (cat.display_name || cat.name).toLowerCase().includes(query));
        renderCategories(filtered);
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      setupSearch();
      await loadCategories();
      await updateBadges();
    });
  </script>
</body>
</html>
