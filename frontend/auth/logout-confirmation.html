<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Logout | Tohfa</title>
    <!-- External Resources -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
      <style>
      .ink-wash {
        background: radial-gradient(circle at top right, rgba(197, 214, 188, 0.15), transparent 70%);
      }
      .modal-scrim {
        background-color: rgba(197, 214, 188, 0.4);
        backdrop-filter: blur(4px);
      }
      .sketch-overlay {
        position: relative;
      }
      .sketch-overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        opacity: 0.08;
        pointer-events: none;
        z-index: 1;
      }
      .custom-shadow {
        box-shadow: 0 10px 30px -10px rgba(58, 51, 40, 0.15);
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      }
    </style>
</head>
<body class="font-body-main text-text-default bg-white">

    <!-- Main Content -->
    <main class="pt-24 pb-section-gap px-container-padding max-w-7xl mx-auto min-h-[calc(100vh-128px)] flex flex-col items-center justify-center relative z-10">
        <div class="flex flex-col items-center w-full">
            <!-- Profile Parchment Card -->
            <div class="w-full max-w-[400px] bg-[#F7F3EC] border border-[#F7F3EC] rounded-[16px] shadow-[0_4px_24px_rgba(0,0,0,0.07)] overflow-hidden transition-all duration-500 hover:border-sage-soft/50">
                <!-- Profile Header -->
                <div class="p-10 flex flex-col items-center text-center border-b border-[#F7F3EC]">
                    <div class="relative group">
                        <div class="w-[72px] h-[72px] rounded-full border-2 border-sage-soft p-1 transition-transform duration-500 group-hover:scale-105 overflow-hidden">
                            <img alt="User Profile" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAVef4BIN7WHe29SLV-tyiP8kX74R9Fcrn4z3apz2LsE4yatChaCzk5HzkS2jphXFI8Djfb0sGuWJmQWk17Z1Jv9m5sBM-ekVQamJ9rNqF1ZmjbjcpPPWMWIXC7epxkaqvc8uu2i5ZG24l1pRXmKPeJ9Gt3UD0gF2rQgpSVlOvltad37tk1D1lNsIdcQL6RJQ-po1Lw07tmrY5Yztb0hC0FXjCDhk5seoxWf62LIMApA1AuWHK207HJigrTSNQ6IMTXL6rZX5TqMTLv" loading="lazy">
                        </div>
                        <div class="absolute bottom-0 right-0 bg-[#C8973A] text-white p-1 rounded-full border-2 border-[#F7F3EC] cursor-pointer hover:bg-[#3D6B4F] transition-colors">
                            <span class="material-symbols-outlined text-[14px]">edit</span>
                        </div>
                    </div>
                    <h1 id="user-name" class="mt-4 font-serif font-bold text-2xl text-[#1A1A1A]">Guest User</h1>
                    <p id="user-role" class="font-serif italic text-sm text-[#6B6B6B] mt-1">Collector</p>
                    <div class="flex gap-2 mt-4">
                        <span class="px-3 py-1 rounded-[20px] bg-[#7B5EA7] text-[#7B5EA7] font-sans text-xs font-medium flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-[#7B5EA7]"></span> Top Artisan
                        </span>
                        <span class="px-3 py-1 rounded-[20px] bg-[#8FAF82] text-[#3D6B4F] font-sans text-xs font-medium flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-[#3D6B4F]"></span> Pro Seller
                        </span>
                    </div>
                </div>
                
                <!-- Settings List -->
                <div class="divide-y divide-[#F7F3EC] px-6 py-2">
                    <button class="w-full flex items-center justify-between py-4 hover:bg-[#F7F3EC]/30 transition-colors group px-4 rounded-lg">
                        <div class="flex items-center gap-4">
                            <span class="material-symbols-outlined text-[#6B6B6B] group-hover:text-[#3D6B4F] transition-colors">person_outline</span>
                            <span class="font-sans text-sm font-medium text-[#1A1A1A]">Personal Information</span>
                        </div>
                        <span class="material-symbols-outlined text-[#6B6B6B] group-hover:translate-x-1 transition-transform text-lg">chevron_right</span>
                    </button>
                    <button class="w-full flex items-center justify-between py-4 hover:bg-[#F7F3EC]/30 transition-colors group px-4 rounded-lg">
                        <div class="flex items-center gap-4">
                            <span class="material-symbols-outlined text-[#6B6B6B] group-hover:text-[#3D6B4F] transition-colors">inventory_2</span>
                            <span class="font-sans text-sm font-medium text-[#1A1A1A]">Order History</span>
                        </div>
                        <span class="material-symbols-outlined text-[#6B6B6B] group-hover:translate-x-1 transition-transform text-lg">chevron_right</span>
                    </button>
                    <button class="w-full flex items-center justify-between py-4 hover:bg-[#F7F3EC]/30 transition-colors group px-4 rounded-lg">
                        <div class="flex items-center gap-4">
                            <span class="material-symbols-outlined text-[#6B6B6B] group-hover:text-[#3D6B4F] transition-colors">help_center</span>
                            <span class="font-sans text-sm font-medium text-[#1A1A1A]">Help Center</span>
                        </div>
                        <span class="material-symbols-outlined text-[#6B6B6B] group-hover:translate-x-1 transition-transform text-lg">chevron_right</span>
                    </button>
                    <button class="w-full flex items-center justify-between py-4 hover:bg-[#F7F3EC]/30 transition-colors group px-4 rounded-lg">
                        <div class="flex items-center gap-4">
                            <span class="material-symbols-outlined text-[#6B6B6B] group-hover:text-[#3D6B4F] transition-colors">payments</span>
                            <span class="font-sans text-sm font-medium text-[#1A1A1A]">Payment Methods</span>
                        </div>
                        <span class="material-symbols-outlined text-[#6B6B6B] group-hover:translate-x-1 transition-transform text-lg">chevron_right</span>
                    </button>
                    <!-- Logout Row -->
                    <button class="w-full flex items-center justify-between py-4 mt-2 hover:bg-[#3D6B4F]/5 transition-colors group px-4 rounded-lg" onclick="toggleModal(true)">
                        <div class="flex items-center gap-4">
                            <span class="material-symbols-outlined text-[#3D6B4F]">sensor_door</span>
                            <span class="font-sans text-sm font-semibold text-[#3D6B4F]">Log out</span>
                        </div>
                        <span class="material-symbols-outlined text-[#3D6B4F] opacity-0 group-hover:opacity-100 transition-opacity text-lg">logout</span>
                    </button>
                </div>
            </div>
            <p class="mt-6 font-sans text-[#6B6B6B] text-[11px] text-center">Version 1.4.2 — Tohfa Studio Collective</p>
        </div>
    </main>

    <!-- Logout Modal Overlay -->
    <div class="fixed inset-0 z-[60] flex items-center justify-center modal-scrim opacity-0 pointer-events-none transition-all duration-300 animate-fade" id="logoutModal">
        <div class="bg-[#F7F3EC] border border-[#F7F3EC] rounded-[16px] p-10 max-w-sm w-full mx-4 shadow-[0_4px_24px_rgba(0,0,0,0.07)] transform scale-95 transition-transform duration-300 relative overflow-hidden">
            <!-- Decorative accent -->
            <div class="absolute top-0 right-0 w-32 h-32 -mr-16 -mt-16 bg-gold-soft/20 rounded-full blur-2xl"></div>
            <div class="flex flex-col items-center text-center relative z-10">
                <img alt="Goodbye character" class="w-24 h-24 mb-6" src="https://lh3.googleusercontent.com/aida/ADBb0uiS5vM2Du_Wncr4ulOtLHPICCtP_6wctIe60bpGv6-YjU4gvLrVmz0y_52Lqzht7NrTsBa2y0nTcwsWfFc2rHan3bbeH1NlLbUV3vczNcIa4tPa2pqcowXCCaSitJ0_T6jjQiFX__nL5L5454US38zak9thP7rvO1pr0eGVtoriM4DBCybreUWVqvDAviRLRdtiHicsWbjbhT1a_ci7o5PAtspPK0enb2oE-Cai-htG8lc9Lh-w08vPALya" loading="lazy">
                <h2 class="font-serif italic text-2xl text-[#3D6B4F] mb-2">Leaving so soon?</h2>
                <p class="font-serif italic text-sm text-[#6B6B6B] mb-8">You can always come back ✦</p>
                <div class="flex flex-col gap-3 w-full">
                    <button class="w-full bg-[#3D6B4F] text-white font-semibold text-sm py-3.5 rounded-[8px] hover:bg-[#3D6B4F] transition-colors shadow-md focus:ring-2 focus:ring-primary/20" onclick="toggleModal(false)">
                        Stay
                    </button>
                    <button class="w-full bg-[#F7F3EC] border border-[#F7F3EC] text-[#6B6B6B] font-semibold text-sm py-3.5 rounded-[8px] hover:bg-[#F7F3EC] transition-all" onclick="handleLogout()">
                        Log out
                    </button>
                </div>
            </div>
        </div>
    </div>



    <script>
        function toggleModal(show) {
            const modal = document.getElementById('logoutModal');
            const content = modal.querySelector('div');
            if (show) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            } else {
                modal.classList.add('opacity-0', 'pointer-events-none');
                content.classList.add('scale-95');
                content.classList.remove('scale-100');
            }
        }

        function handleLogout() {
            sessionStorage.clear();
            window.location.href = '/auth/login.html';
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') toggleModal(false);
        });

        // Initialize user info from session storage
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = sessionStorage.getItem('tohfa_user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if (user.full_name) {
                        document.getElementById('user-name').textContent = user.full_name;
                    }
                    if (user.role) {
                        document.getElementById('user-role').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
                    }
                } catch (e) {
                    console.error(e);
                }
            }
        });

        // Interaction micro-animations
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.98)';
                btn.style.opacity = '0.8';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
                btn.style.opacity = '1';
            });
        });
    </script>
</body>
</html>
