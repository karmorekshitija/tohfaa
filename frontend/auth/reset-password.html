<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Reset Password | Tohfa</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;500&amp;family=EB+Garamond:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-lowest": "#ffffff",
              "surface-container": "#f4ede3",
              "outline": "#76786e",
              "error-container": "#F7F3EC",
              "on-error-container": "#3D6B4F",
              "error": "#3D6B4F",
              "primary": "#576242",
              "on-primary": "#ffffff",
              "background": "#FFFFFF",
              "on-surface": "#1e1b15",
              "on-surface-variant": "#45483f",
              "primary-container": "#a8b48e",
              "on-primary-container": "#3c4628"
            },
            fontFamily: {
              "headline-lg": ["EB Garamond"],
              "body-md": ["Be Vietnam Pro"],
              "label-sm": ["Be Vietnam Pro"]
            }
          }
        }
      }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-white font-body-md text-on-surface min-h-screen flex items-center justify-center p-5 relative overflow-hidden">
    <!-- Container -->
    <main class="w-full max-w-[440px] z-10">
        <div class="bg-surface-container-lowest border border-outline-variant p-8 md:p-10 rounded-lg shadow-sm">
            <!-- Logo Section -->
            <header class="text-center mb-8">
                <h1 class="font-headline-lg text-3xl text-primary tracking-tight mb-2">Tohfa</h1>
                <p class="font-label-sm text-xs text-on-surface-variant uppercase tracking-wider">Reset Password</p>
            </header>

            <!-- General Error Alert Banner -->
            <div id="general-error" class="hidden bg-error-container border border-error text-on-error-container p-4 rounded-md mb-6 flex items-start gap-2.5">
                <span class="material-symbols-outlined text-[20px] text-error shrink-0 mt-0.5">warning</span>
                <p id="general-error-text" class="font-body-md text-[13px] leading-relaxed"></p>
            </div>

            <!-- Reset Form -->
            <form class="space-y-6" id="reset-form">
                <div>
                    <label class="block font-label-sm text-xs text-on-surface-variant uppercase mb-2" for="password">New Password</label>
                    <input class="w-full bg-transparent border border-outline-variant px-4 py-3 text-sm focus:border-primary focus:outline-none transition-colors rounded" id="password" name="password" placeholder="••••••••" required type="password"/>
                </div>

                <div>
                    <label class="block font-label-sm text-xs text-on-surface-variant uppercase mb-2" for="confirm_password">Confirm Password</label>
                    <input class="w-full bg-transparent border border-outline-variant px-4 py-3 text-sm focus:border-primary focus:outline-none transition-colors rounded" id="confirm_password" name="confirm_password" placeholder="••••••••" required type="password"/>
                </div>

                <button class="w-full bg-primary-container text-on-primary-container py-3.5 rounded font-label-sm text-xs uppercase tracking-widest hover:bg-primary hover:text-on-primary transition-all duration-300 font-semibold shadow-sm" type="submit" id="submit-btn">
                    Reset Password
                </button>
            </form>

            <footer class="mt-8 pt-6 border-t border-outline-variant text-center">
                <p class="font-body-md text-sm text-on-surface-variant">
                    <a class="text-primary font-medium hover:underline" href="/auth/login.html">Back to Login</a>
                </p>
            </footer>
        </div>
    </main>

    <script type="module">
        import apiClient from '/src/utils/apiClient.js';

        const resetForm = document.getElementById('reset-form');
        const submitBtn = document.getElementById('submit-btn');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const generalError = document.getElementById('general-error');
        const generalErrorText = document.getElementById('general-error-text');

        // Read token from URL
        const token = new URLSearchParams(window.location.search).get('token');

        if (!token) {
            generalErrorText.textContent = "Invalid password reset link. Please request a new one.";
            generalError.classList.remove('hidden');
            resetForm.classList.add('hidden');
        }

        resetForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            generalError.classList.add('hidden');

            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (password !== confirmPassword) {
                generalErrorText.textContent = "Passwords do not match.";
                generalError.classList.remove('hidden');
                return;
            }

            if (password.length < 8) {
                generalErrorText.textContent = "Password must be at least 8 characters.";
                generalError.classList.remove('hidden');
                return;
            }

            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'RESETTING...';
            submitBtn.disabled = true;

            try {
                const response = await apiClient.post('/auth/reset-password', {
                    token,
                    new_password: password
                });
                const data = response.data;

                if (data.success) {
                    window.location.href = '/auth/login.html?message=' + encodeURIComponent('Password updated. Please log in.');
                } else {
                    generalErrorText.textContent = data.message || "An unexpected error occurred.";
                    generalError.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Reset password request failed:", err);
                const response = err.response;
                if (response) {
                    const data = response.data || {};
                    if (response.status === 400) {
                        generalErrorText.textContent = "This reset link has expired. Request a new one.";
                    } else {
                        generalErrorText.textContent = data.message || "An unexpected error occurred.";
                    }
                } else {
                    generalErrorText.textContent = "Unable to connect to the server. Please try again later.";
                }
                generalError.classList.remove('hidden');
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
