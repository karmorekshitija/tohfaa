<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Tohfa</title>
<!-- Google Fonts -->
  <!-- Material Symbols -->

<!-- Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .tab-active {
            color: #576242;
            border-bottom: 2px solid #576242;
        }
        .tab-inactive {
            color: #76786e;
            border-bottom: 2px solid transparent;
        }
        input:focus {
            outline: none;
            border-color: #576242 !important;
            ring: 0 !important;
        }
    </style>
</head>
<body class="bg-white text-text-default font-body-main selection:bg-violet-soft selection:text-accent-violet overflow-x-hidden">

<main class="min-h-[calc(100vh-128px)] flex flex-col items-center justify-center py-12 px-6 bg-white relative">

<!-- Login Card Container -->
<div class="relative w-full max-w-[440px] z-10">
    <!-- Scissor Motif -->
    <div class="absolute -top-10 left-1/2 -translate-x-1/2 flex flex-col items-center">
        <span class="material-symbols-outlined text-[#6B6B6B] text-3xl">content_cut</span>
        <div class="h-6 w-px bg-sage-soft mt-1"></div>
    </div>
    <div class="bg-[#F7F3EC] border border-[#F7F3EC] rounded-[16px] p-[40px] flex flex-col items-center shadow-[0_4px_24px_rgba(0,0,0,0.07)]">
        <!-- Logo Section -->
        <header class="text-center mb-6 w-full">
            <span class="font-sans text-xs font-semibold text-[#6B6B6B] tracking-[0.2em] block mb-1 uppercase">WELCOME BACK</span>
            <h1 class="font-serif text-3xl font-bold text-[#3D6B4F] mb-1">Return to the nest</h1>
            <div class="flex items-center justify-center gap-2 mt-2">
                <div class="h-[1px] w-8 bg-[#F7F3EC]"></div>
                <span class="font-serif text-lg italic text-[#3D6B4F]">Tohfa<span class="text-[#C8973A]">.</span></span>
                <div class="h-[1px] w-8 bg-[#F7F3EC]"></div>
            </div>
        </header>

        <!-- General Success Alert Banner -->
        <div id="general-success" class="hidden w-full bg-[#8FAF82] border border-[#8FAF82] text-[#3D6B4F] p-4 rounded-[8px] mb-6 flex items-start gap-2.5">
            <span class="material-symbols-outlined text-[20px] text-[#3D6B4F] shrink-0 mt-0.5">check_circle</span>
            <p id="general-success-text" class="font-sans text-xs leading-relaxed"></p>
        </div>

        <!-- General Error Alert Banner -->
        <div id="general-error" class="hidden w-full bg-[#C8973A] border border-[#3D6B4F] text-[#3D6B4F] p-4 rounded-[8px] mb-6 flex items-start gap-2.5">
            <span class="material-symbols-outlined text-[20px] text-[#3D6B4F] shrink-0 mt-0.5">warning</span>
            <p id="general-error-text" class="font-sans text-xs leading-relaxed"></p>
        </div>

        <!-- Login Form -->
        <form class="space-y-4 w-full text-left" id="login-form">
            <!-- Email Field -->
            <div>
                <label class="block font-sans text-sm font-medium text-[#1A1A1A] mb-1.5" for="email">Email Address</label>
                <input class="w-full bg-[#F7F3EC] border-[1.5px] border-[#F7F3EC] rounded-[8px] px-[14px] py-[12px] font-sans text-sm text-[#1A1A1A] focus:ring-1 focus:ring-[#3D6B4F] focus:border-[#3D6B4F] transition-all outline-none" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
            </div>
            <!-- Password Field -->
            <div class="relative">
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block font-sans text-sm font-medium text-[#1A1A1A]" for="password">Password</label>
                    <a class="text-xs text-[#3D6B4F] hover:underline font-semibold" href="/auth/forgot-password.html">Forgot password?</a>
                </div>
                <div class="relative w-full">
                    <input class="w-full bg-[#F7F3EC] border-[1.5px] border-[#F7F3EC] rounded-[8px] px-[14px] py-[12px] font-sans text-sm text-[#1A1A1A] focus:ring-1 focus:ring-[#3D6B4F] focus:border-[#3D6B4F] transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
                    <button class="absolute right-4 top-1/2 -translate-y-1/2 text-[#6B6B6B] hover:text-[#3D6B4F] transition-colors" onclick="togglePassword()" type="button">
                        <span class="material-symbols-outlined text-lg" id="password-toggle-icon">visibility</span>
                    </button>
                </div>
            </div>
            <!-- Action Button -->
            <button class="w-full bg-[#3D6B4F] text-white font-semibold text-sm py-[14px] rounded-[8px] hover:bg-[#3D6B4F] transition-all duration-300 shadow-md active:scale-[0.98] mt-4" type="submit" id="submit-btn">
                Login
            </button>
        </form>
        <!-- Footer links inside card -->
        <footer class="mt-6 pt-5 border-t border-[#F7F3EC]/40 text-center w-full z-20">
            <p class="text-sm text-[#6B6B6B]">
                New here? 
                <a class="text-[#3D6B4F] font-semibold hover:underline ml-1" href="signup-buyer.html" id="signup-link">Create an account</a>
            </p>
            <a class="font-sans text-xs text-[#3D6B4F] hover:text-[#C8973A] transition-colors tracking-widest font-semibold uppercase flex items-center justify-center gap-2 mt-4" href="signup-seller.html">
                ✦ SELL ON TOHFA
            </a>
            <a class="font-sans text-xs text-[#6B6B6B] hover:text-[#3D6B4F] transition-colors mt-2 block text-center" href="signup-seller.html">
                Already a seller? Sign up here →
            </a>
        </footer>
        <!-- Cozy Cat Illustration -->
        <div class="w-32 md:w-36 pointer-events-none drop-shadow-sm mt-6 flex justify-center">
            <img alt="Curled sleeping cat illustration" class="w-full h-auto object-contain max-h-[120px]" src="https://lh3.googleusercontent.com/aida/ADBb0uguL628U-zz3tGpzegERPAMsrnAPYOBSCfxEaw1TqKdEbn5rxGmPytFgXj6JwfQX_MO-7DOXQBXBOJodYciMHF3sQVz58CfMgL53mE7rgEoSSOdGVMEd3N-_MQuYiIvbOX7Yj_1PawgpcXr59jivk-uzSimXee9IxwpDapu1mVdxof-OPqc8se15_5vWFIBZiOjQQpFj8lYfLlS4S33T03fqOP3tT_ZuMWxCuE00uiXapAr7HwnpEVSJowe" loading="lazy" />
        </div>
    </div>
    <!-- Back to Explore Button -->
    <div class="mt-6 text-center">
        <a class="inline-flex items-center gap-2 text-xs font-semibold text-[#6B6B6B] hover:text-[#3D6B4F] transition-colors uppercase tracking-wider" href="/buyer/home.html">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span>
            Back to Explore
        </a>
    </div>
</div>
</main>

<script type="module">
        import apiClient from '/src/utils/apiClient.js';

        const loginForm = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const generalError = document.getElementById('general-error');
        const generalErrorText = document.getElementById('general-error-text');
        const generalSuccess = document.getElementById('general-success');
        const generalSuccessText = document.getElementById('general-success-text');

        // Show success message if present in URL
        const urlParams = new URLSearchParams(window.location.search);
        const msg = urlParams.get('message');
        if (msg) {
            generalSuccessText.textContent = msg;
            generalSuccess.classList.remove('hidden');
        }

        function clearErrors() {
            generalError.classList.add('hidden');
            generalSuccess.classList.add('hidden');
            emailInput.classList.remove('border-error');
            passwordInput.classList.remove('border-error');
        }

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            clearErrors();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                generalErrorText.textContent = "Please fill in all fields.";
                generalError.classList.remove('hidden');
                return;
            }

            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'AUTHENTICATING...';
            submitBtn.style.opacity = '0.7';
            submitBtn.disabled = true;

            try {
                const response = await apiClient.post('/auth/login', { email, password });
                const data = response.data;

                if (data.success) {
                    // Success! Store access_token and refresh_token in sessionStorage
                    sessionStorage.setItem('tohfa_access_token', data.data.access_token);
                    sessionStorage.setItem('tohfa_refresh_token', data.data.refresh_token);
                    sessionStorage.setItem('tohfa_user', JSON.stringify(data.data.user));
                    
                    // Redirect based on returned role
                    if (data.data.user.role === 'seller') {
                        window.location.href = '/seller/dashboard.html';
                    } else if (data.data.user.role === 'admin') {
                        sessionStorage.setItem('tohfa_admin_token', data.data.access_token);
                        window.location.href = '/admin/sellers.html';
                    } else {
                        window.location.href = '/buyer/home.html';
                    }
                } else {
                    generalErrorText.textContent = data.message || "An unexpected error occurred.";
                    generalError.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Login request failed:", err);
                const response = err.response;
                if (response) {
                    const data = response.data || {};
                    if (response.status === 401) {
                        generalErrorText.textContent = data.message || "Incorrect email or password.";
                        emailInput.classList.add('border-error');
                        passwordInput.classList.add('border-error');
                    } else if (response.status === 403) {
                        generalErrorText.textContent = data.message || "Your account has been suspended. Contact support.";
                    } else if (response.status === 429) {
                        generalErrorText.textContent = data.message || "Too many attempts. Please try again later.";
                    } else {
                        generalErrorText.textContent = data.message || "An unexpected error occurred. Please try again.";
                    }
                } else {
                    generalErrorText.textContent = "Unable to connect to the authentication server. Please try again later.";
                }
                generalError.classList.remove('hidden');
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.style.opacity = '1';
            }
        });
    </script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }
    </script>
</body>
</html>
