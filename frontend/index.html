<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tohfa | Handcrafted Treasures</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F7F3EC;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-style: italic;
      color: #3D6B4F;
    }
    .brand span { color: #C8973A; }
    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid #8FAF82;
      border-top-color: #3D6B4F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .tagline {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: #6B6B6B;
      letter-spacing: 0.02em;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    (function() {
      // Detect mobile: user-agent check + viewport width
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
                     || window.innerWidth <= 768;

      // Read user role from session
      var role = 'buyer';
      try {
        var userStr = sessionStorage.getItem('tohfa_user');
        if (userStr) {
          var user = JSON.parse(userStr);
          role = user.role || 'buyer';
        }
      } catch(e) {}

      if (isMobile) {
        // ——— Mobile routing ———
        if (role === 'seller') {
          window.location.replace('/mobile-seller/dashboard.html');
        } else if (role === 'admin') {
          window.location.replace('/admin/dashboard.html');
        } else {
          window.location.replace('/mobile-buyer/home.html');
        }
      } else {
        // ——— Desktop routing (existing behavior preserved) ———
        if (role === 'seller') {
          window.location.replace('/seller/dashboard.html');
        } else if (role === 'admin') {
          window.location.replace('/admin/sellers.html');
        } else {
          window.location.replace('/buyer/home.html');
        }
      }
    })();
  </script>
</head>
<body>
  <div class="brand">Tohfa<span>.</span></div>
  <div class="loader"></div>
  <p class="tagline">Redirecting you to handcrafted treasures…</p>
</body>
</html>
