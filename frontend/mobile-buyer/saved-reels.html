<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script src="/src/components/DeviceRedirect.js"></script>
  <script src="/src/components/ReportWidget.js" defer></script>
  <script src="/src/components/ProtectedRoute.js"></script>
  <meta charset="utf-8"/>
  <title>Saved Makes | Tohfa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
  <style>
    body {
      background-color: #F7F3EC !important;
    }
    /* Hide scrollbar for category chips scroll container */
    #category-chips-container::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="text-on-surface selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col bg-[#F7F3EC]">

<main class="flex-grow relative bg-[#F7F3EC] px-4 py-4 font-['DM_Sans']">
  <!-- Header Section -->
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2">
      <a class="w-9 h-9 rounded-full bg-[#F0EDE6] border border-[#c3c8c1] text-[#3D6B4F] flex items-center justify-center active:scale-90 transition-all" href="/mobile-buyer/profile.html">
        <span class="material-symbols-outlined text-[20px] font-bold">chevron_left</span>
      </a>
      <div class="flex items-baseline gap-2">
        <h1 class="font-['Playfair_Display'] text-[22px] font-bold text-[#3D6B4F]">
          Saved makes <span class="text-[#7B5EA7] text-[18px]">✦</span>
        </h1>
        <span id="saved-makes-count" class="font-['Space_Mono'] text-[11px] bg-[#F0EDE6] border border-[#c3c8c1] text-[#444840] px-2 py-0.5 rounded-full font-bold">
          0
        </span>
      </div>
    </div>
  </div>

  <!-- Horizontal Category Slider with Chevrons -->
  <div class="relative flex items-center mb-6 px-1">
    <!-- Left Chevron -->
    <button id="slider-prev" class="w-7 h-7 rounded-full bg-[#F0EDE6] border border-[#c3c8c1] text-[#3D6B4F] flex items-center justify-center absolute left-0 z-10 shadow-sm active:scale-90 transition-all">
      <span class="material-symbols-outlined text-[16px] font-bold">chevron_left</span>
    </button>
    
    <!-- Chip Scroll Container -->
    <div id="category-chips-container" class="flex gap-2 overflow-x-auto scrollbar-none scroll-smooth px-8 w-full" style="-ms-overflow-style: none; scrollbar-width: none;">
      <button class="category-chip px-3 py-1 text-xs rounded-full border bg-[#3D6B4F] text-white border-[#3D6B4F] whitespace-nowrap active:scale-95 transition-all duration-200">All</button>
      <button class="category-chip px-3 py-1 text-xs rounded-full border bg-[#F0EDE6] border-[#c3c8c1] text-[#444840] whitespace-nowrap active:scale-95 transition-all duration-200">Textile Arts</button>
      <button class="category-chip px-3 py-1 text-xs rounded-full border bg-[#F0EDE6] border-[#c3c8c1] text-[#444840] whitespace-nowrap active:scale-95 transition-all duration-200">Jewellery</button>
      <button class="category-chip px-3 py-1 text-xs rounded-full border bg-[#F0EDE6] border-[#c3c8c1] text-[#444840] whitespace-nowrap active:scale-95 transition-all duration-200">Ceramics & Pottery</button>
      <button class="category-chip px-3 py-1 text-xs rounded-full border bg-[#F0EDE6] border-[#c3c8c1] text-[#444840] whitespace-nowrap active:scale-95 transition-all duration-200">Journals & Stationery</button>
      <button class="category-chip px-3 py-1 text-xs rounded-full border bg-[#F0EDE6] border-[#c3c8c1] text-[#444840] whitespace-nowrap active:scale-95 transition-all duration-200">Candles & Fragrance</button>
      <button class="category-chip px-3 py-1 text-xs rounded-full border bg-[#F0EDE6] border-[#c3c8c1] text-[#444840] whitespace-nowrap active:scale-95 transition-all duration-200">Paintings</button>
      <button class="category-chip px-3 py-1 text-xs rounded-full border bg-[#F0EDE6] border-[#c3c8c1] text-[#444840] whitespace-nowrap active:scale-95 transition-all duration-200">Home Decor</button>
      <button class="category-chip px-3 py-1 text-xs rounded-full border bg-[#F0EDE6] border-[#c3c8c1] text-[#444840] whitespace-nowrap active:scale-95 transition-all duration-200">Customized Gifts</button>
    </div>

    <!-- Right Chevron -->
    <button id="slider-next" class="w-7 h-7 rounded-full bg-[#F0EDE6] border border-[#c3c8c1] text-[#3D6B4F] flex items-center justify-center absolute right-0 z-10 shadow-sm active:scale-90 transition-all">
      <span class="material-symbols-outlined text-[16px] font-bold">chevron_right</span>
    </button>
  </div>

  <!-- Bento/Grid of Reels -->
  <div class="grid grid-cols-3 gap-0.5" id="reels-grid">
    <!-- Shimmer placeholders during load -->
    <div class="animate-pulse bg-[#E8E4DC] aspect-square rounded-sm"></div>
    <div class="animate-pulse bg-[#E8E4DC] aspect-square rounded-sm"></div>
    <div class="animate-pulse bg-[#E8E4DC] aspect-square rounded-sm"></div>
    <div class="animate-pulse bg-[#E8E4DC] aspect-square rounded-sm"></div>
    <div class="animate-pulse bg-[#E8E4DC] aspect-square rounded-sm"></div>
    <div class="animate-pulse bg-[#E8E4DC] aspect-square rounded-sm"></div>
    <div class="animate-pulse bg-[#E8E4DC] aspect-square rounded-sm"></div>
    <div class="animate-pulse bg-[#E8E4DC] aspect-square rounded-sm"></div>
    <div class="animate-pulse bg-[#E8E4DC] aspect-square rounded-sm"></div>
  </div>

  <!-- Empty State (Hidden by default) -->
  <div class="hidden flex flex-col items-center justify-center py-12 text-center" id="empty-state">
    <div class="flex items-center justify-center w-12 h-12 rounded-full bg-[#F0EDE6] text-[#3D6B4F] mb-4 border border-[#c3c8c1]/30 mx-auto">
      <span class="material-symbols-outlined text-[24px]">bookmark_border</span>
    </div>
    <h3 class="font-['Playfair_Display'] text-md font-semibold text-[#3D6B4F] mb-2">No saved reels yet</h3>
    <p class="font-['DM_Sans'] text-xs text-[#74786f] max-w-[260px] mx-auto mb-6">
      Tap the bookmark on any reel to keep it here for inspiration or later viewing.
    </p>
    <button onclick="window.location.href='reels.html'" class="bg-[#3D6B4F] hover:bg-[#2A4B37] text-white px-6 py-2.5 rounded-full font-['DM_Sans'] text-xs font-bold active:scale-95 transition-all flex items-center gap-2 mx-auto">
      Watch reels
      <span class="material-symbols-outlined text-[14px]">auto_awesome</span>
    </button>
  </div>

  <!-- Bottom spacer for bottom navigation -->
  <div class="pb-24"></div>
</main>

<script type="module">
  function getTohfaToken() {
    try {
      const user = JSON.parse(sessionStorage.getItem('tohfa_user') || '{}');
      return user.token || user.accessToken || user.access_token || sessionStorage.getItem('tohfa_access_token') || null;
    } catch(e) {
      return sessionStorage.getItem('tohfa_access_token') || null;
    }
  }

  import apiClient from '/src/utils/apiClient.js';
  import { logout } from '/src/utils/auth.js';

  let isLoggedIn = false;
  async function checkAuthState() {
    const token = getTohfaToken();
    if (token) {
      isLoggedIn = true;
    } else {
      isLoggedIn = false;
    }
  }

  async function loadSavedReels() {
    const grid = document.getElementById('reels-grid');
    const emptyState = document.getElementById('empty-state');
    const countPill = document.getElementById('saved-makes-count');

    try {
      const response = await apiClient.get('/reels/saved');
      
      if (response.data && response.data.success) {
        const reels = response.data.data.saved_reels || [];
        
        // Update count bubble
        if (countPill) {
          countPill.innerText = reels.length;
        }

        if (reels.length === 0) {
          grid.classList.add('hidden');
          emptyState.classList.remove('hidden');
          return;
        }

        emptyState.classList.add('hidden');
        grid.classList.remove('hidden');

        grid.innerHTML = reels.map(r => {
          const imgUrl = r.thumbnail_url ? r.thumbnail_url : 'https://placehold.co/400x700/f4ede3/516447?text=Artisan+Reel';
          return `
            <div class="group relative aspect-square bg-[#E8E4DC] overflow-hidden cursor-pointer" onclick="window.location.href='reels.html?id=${r.id}'">
              <img alt="${r.caption || 'Reel'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" src="${imgUrl}" loading="lazy">
              <!-- Overlay play and bookmark icons -->
              <span class="material-symbols-outlined text-white text-[14px] drop-shadow absolute top-1 right-1">play_arrow</span>
              <span class="material-symbols-outlined text-white text-[14px] drop-shadow absolute top-1 left-1" style="font-variation-settings: 'FILL' 1">bookmark</span>
            </div>
          `;
        }).join('');
      }
    } catch (e) {
      console.error("Error loading saved reels:", e);
      grid.classList.add('hidden');
      emptyState.classList.remove('hidden');
      if (countPill) {
        countPill.innerText = '0';
      }
    }
  }

  // Setup chip click visual toggle
  document.querySelectorAll('.category-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.category-chip').forEach(c => {
        c.classList.remove('bg-[#3D6B4F]', 'text-white', 'border-[#3D6B4F]');
        c.classList.add('bg-[#F0EDE6]', 'border-[#c3c8c1]', 'text-[#444840]');
      });
      chip.classList.add('bg-[#3D6B4F]', 'text-white', 'border-[#3D6B4F]');
      chip.classList.remove('bg-[#F0EDE6]', 'border-[#c3c8c1]', 'text-[#444840]');
    });
  });

  // Setup scroll buttons
  const container = document.getElementById('category-chips-container');
  const prevBtn = document.getElementById('slider-prev');
  const nextBtn = document.getElementById('slider-next');

  if (container && prevBtn && nextBtn) {
    prevBtn.addEventListener('click', () => {
      container.scrollBy({ left: -120, behavior: 'smooth' });
    });
    nextBtn.addEventListener('click', () => {
      container.scrollBy({ left: 120, behavior: 'smooth' });
    });
  }

  window.addEventListener('DOMContentLoaded', async () => {
    await checkAuthState();
    await loadSavedReels();
  });
</script>
</body>
</html>
