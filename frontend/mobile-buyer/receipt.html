    function getTohfaToken() {
        try {
            const user = JSON.parse(sessionStorage.getItem('tohfa_user') || '{}');
            return user.token || user.accessToken || user.access_token || sessionStorage.getItem('tohfa_access_token') || null;
        } catch(e) {
            return sessionStorage.getItem('tohfa_access_token') || null;
        }
    }

        const token = getTohfaToken();
        if (!token) {
            window.location.href = '/auth/login.html';
            return;
        }

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) {
            document.getElementById('receipt-canvas').innerHTML = `<p class="p-8 text-center text-error">No order ID specified.</p>`;
            return;
        }

        try {
            const res = await apiClient.get(`/orders/${id}/receipt`);
            if (res.data && res.data.success) {
                const r = res.data.data;
                document.title = `Tohfa - Printable Receipt #${r.order_ref}`;
                renderReceipt(r);
            }
        } catch (err) {
            console.error("Error fetching receipt:", err);
            document.getElementById('receipt-canvas').innerHTML = `
                <p class="p-8 text-center text-error font-semibold">Failed to load receipt.</p>
            `;
        }
    });

    let isLoggedIn = false;
    async function checkAuthState() {
        const token = getTohfaToken();
        const authContainer = document.getElementById('auth-buttons-container');
        
        if (token) {
            isLoggedIn = true;
            try {
                let avatarUrl = null;
                let initial = 'A';
                try {
                    const res = await apiClient.get('/profile/me');
                    if (res.data && res.data.success) {
                        avatarUrl = res.data.data.avatar_url;
                        if (res.data.data.full_name) {
                            initial = res.data.data.full_name.charAt(0).toUpperCase();
                        }
                    }
                } catch (err) {
                    console.error("Failed to fetch profile avatar:", err);
                }
                
                let avatarHtml = '';
                if (avatarUrl) {
                    avatarHtml = `<img src="${avatarUrl}" alt="Profile" class="w-10 h-10 rounded-full border border-[#8FAF82] object-cover cursor-pointer" onclick="window.location.href='profile.html'" loading="lazy" />`;
                } else {
                    avatarHtml = `
                        <a href="./profile.html" class="w-10 h-10 rounded-full bg-[#3D6B4F] flex items-center justify-center text-white font-bold border border-[#8FAF82] text-sm overflow-hidden flex-shrink-0 cursor-pointer">
                            ${initial}
                        </a>
                    `;
                }

                if (authContainer) {
                    authContainer.innerHTML = '';
                }
            } catch(e) {
                console.error("Failed to parse token:", e);
                logout();
            }
        } else {
            isLoggedIn = false;
            if (authContainer) {
                authContainer.innerHTML = `
                    <div class="flex items-center gap-md">
                        <a href="/auth/login.html" class="text-[#3D6B4F] hover:underline text-sm font-semibold">Login</a>

<script>
async function handleFooterSellerLink(e) {
  if (e) e.preventDefault();
  const isMobile = window.innerWidth < 768;
  const token = sessionStorage.getItem('tohfa_access_token');
  if (!token) {
    sessionStorage.setItem('tohfa_redirect_seller', 'true');
    window.location.href = '/auth/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
    return;
  }

  try {
    const res = await fetch('/api/profile/me', {
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      }
    });
    if (res.ok) {
      const data = await res.json();
      if (data && data.success) {
        const role = data.data.role;
        if (role === 'seller') {
          window.location.href = isMobile ? '/mobile-seller/dashboard.html' : '/seller/dashboard.html';
          return;
        }
      }
    }
  } catch(err) {
    console.error("Error checking seller status:", err);
  }
  
  window.location.href = isMobile ? '/mobile-buyer/become-seller.html' : '/buyer/become-seller.html';
}

// Check if we need to auto-redirect back to dashboard/signup after login redirect
document.addEventListener("DOMContentLoaded", () => {
  const needsRedirect = sessionStorage.getItem('tohfa_redirect_seller');
  if (needsRedirect === 'true') {
    sessionStorage.removeItem('tohfa_redirect_seller');
    const token = sessionStorage.getItem('tohfa_access_token');
    if (token) {
      handleFooterSellerLink();
    }
  }
});

window.openContactModal = function(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  const modal = document.getElementById('tohfa-contact-modal');
  if (modal) {
    modal.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }
};

window.closeContactModal = function() {
  const modal = document.getElementById('tohfa-contact-modal');
  if (modal) {
    modal.classList.remove('is-open');
    document.body.style.overflow = '';
  }
};

if (!window.hasContactModalEscListener) {
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.closeContactModal();
    }
  });
  window.hasContactModalEscListener = true;
}
