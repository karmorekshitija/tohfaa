<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script src="/src/components/DeviceRedirect.js"></script>
  <script src="/src/components/ProtectedRoute.js"></script>
  <meta charset="utf-8"/>
  <title>Basket | Tohfa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
  <style>
    body {
      background-color: #F7F3EC !important;
    }
  </style>
</head>
<body class="bg-[#F7F3EC] font-['DM_Sans'] text-[#1f1b15] min-h-screen flex flex-col">

<!-- BEGIN: Main Content -->
<main class="flex-grow p-4 max-w-2xl mx-auto w-full pb-48">
  <!-- BEGIN: Header Section -->
  <header class="flex items-center justify-between mb-6" data-purpose="basket-header">
    <div class="flex items-center gap-2">
      <a class="w-9 h-9 rounded-full bg-[#F0EDE6] border border-[#c3c8c1] text-[#3D6B4F] flex items-center justify-center active:scale-90 transition-all" href="/mobile-buyer/home.html">
        <span class="material-symbols-outlined text-[20px] font-bold">chevron_left</span>
      </a>
      <h1 class="text-2xl font-bold font-['Playfair_Display'] text-[#3D6B4F] ml-1">Your basket</h1>
    </div>
    <span id="cart-badge-count" class="font-['Space_Mono'] text-[11px] bg-[#F0EDE6] border border-[#c3c8c1] text-[#444840] px-2 py-0.5 rounded-full font-bold">
      0 ITEMS
    </span>
  </header>
  <!-- END: Header Section -->

  <!-- BEGIN: Product List -->
  <div class="space-y-4" data-purpose="basket-items-list" id="cart-items-container">
    <!-- Loaded dynamically -->
  </div>
  <!-- END: Product List -->
</main>
<!-- END: Main Content -->

<!-- BEGIN: Summary/Footer Action -->
<footer class="fixed bottom-16 left-0 right-0 p-4 bg-[#F7F3EC]/90 backdrop-blur-md border-t border-[#c3c8c1]/40 z-40" data-purpose="checkout-bar">
  <div class="max-w-2xl mx-auto">
    <button id="btn-checkout" class="w-full bg-[#3D6B4F] hover:bg-[#2A4B37] text-white font-bold py-3.5 px-6 rounded-xl flex justify-between items-center transition-all active:scale-[0.98]">
      <span class="uppercase tracking-wider text-xs font-bold">Proceed to Checkout</span>
      <span id="btn-total" class="text-white/90 font-semibold border-l border-white/20 pl-4 text-sm">₹0.00</span>
    </button>
  </div>
</footer>
<!-- END: Summary/Footer Action -->

<!-- BEGIN: Report Floating Button -->
<div class="fixed bottom-36 right-4 z-30">
  <button onclick="window.location.href='/mobile-buyer/report-problem.html'" class="flex items-center gap-2 bg-[#3D6B4F] text-white px-4 py-2 rounded-full shadow-lg text-xs font-medium hover:bg-[#2A4B37] active:scale-95 transition-all">
    <span class="material-symbols-outlined text-[16px]">flag</span>
    Report a Problem
  </button>
</div>
<!-- END: Report Floating Button -->

<script type="module">
  import apiClient from '/src/utils/apiClient.js';
  import { formatPaise } from '/src/utils/currency.js';
  
  async function initCart() {
    const token = sessionStorage.getItem('tohfa_access_token');
    if (!token) {
      window.location.href = '/auth/login.html';
      return;
    }
    await fetchCart();
  }

  async function fetchCart() {
    try {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = `
        <div class="flex flex-col gap-4 py-12 text-center text-[#74786f]">
          <span class="material-symbols-outlined animate-spin text-[32px] text-[#3D6B4F]">sync</span>
          <p class="text-sm">Loading your basket...</p>
        </div>
      `;
      
      const res = await apiClient.get('/cart');
      if (res.data && res.data.success) {
        const { items, total_paise, item_count } = res.data.data;
        
        // Update nav badge count if exists
        const navBadge = document.getElementById('nav-cart-badge');
        if (navBadge) {
          if (item_count > 0) {
            navBadge.innerText = item_count;
            navBadge.classList.remove('hidden');
          } else {
            navBadge.classList.add('hidden');
          }
        }
        
        if (items.length === 0) {
          window.location.href = 'cart-empty.html';
          return;
        }
        
        renderCartItems(items);
        
        const countBadge = document.getElementById('cart-badge-count');
        if (countBadge) {
          countBadge.innerText = `${item_count} ${item_count === 1 ? 'ITEM' : 'ITEMS'}`;
        }
        const totalBtn = document.getElementById('btn-total');
        if (totalBtn) {
          totalBtn.innerText = formatPaise(total_paise);
        }
      }
    } catch (err) {
      console.error("Error fetching cart:", err);
      const container = document.getElementById('cart-items-container');
      container.innerHTML = `
        <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-center my-4">
          <p class="text-red-700 font-bold">Failed to load basket</p>
          <button onclick="window.location.reload()" class="mt-2 px-4 py-2 bg-[#3D6B4F] text-white rounded-xl text-sm font-bold">Retry</button>
        </div>
      `;
    }
  }

  function renderCartItems(items) {
    const container = document.getElementById('cart-items-container');
    const hasUnavailable = items.some(i => !i.available);

    container.innerHTML = (hasUnavailable ? `
      <div class="flex items-start gap-2 px-4 py-3 bg-amber-50 border border-amber-200 rounded-xl mb-3">
        <span class="material-symbols-outlined text-amber-600 text-base mt-0.5" style="font-variation-settings:'FILL' 1;">warning</span>
        <p class="text-xs text-amber-800">Some items are <strong>unavailable</strong> and excluded from the total. Remove them or come back later.</p>
      </div>
    ` : '') + items.map(ci => {
      const imgUrl = ci.image_url ? ci.image_url : 'https://placehold.co/120x120/f4ede3/516447?text=Handcrafted';
      const isUnavailable = !ci.available;
      const cardBg = isUnavailable ? 'bg-gray-50 border-gray-200 opacity-70' : 'bg-white border-[#c3c8c1]/40';

      let unavailBanner = '';
      if (ci.unavailable_reason === 'paused') {
        const resumeStr = ci.resume_estimate_date
          ? ` Back: ${new Date(ci.resume_estimate_date).toLocaleDateString('en-IN', { day:'numeric', month:'short' })}`
          : '';
        unavailBanner = `<div class="flex items-center gap-1 px-3 py-1.5 bg-purple-50 border border-purple-200 rounded-lg text-xs text-purple-700">⏸️ Paused by artisan.${resumeStr}</div>`;
      } else if (ci.unavailable_reason === 'out_of_stock') {
        unavailBanner = `<div class="flex items-center gap-1 px-3 py-1.5 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700">Out of stock — remove from basket</div>`;
      }

      const qtyControls = isUnavailable
        ? `<div class="flex items-center border border-gray-200 rounded-lg bg-gray-100 h-8 overflow-hidden pointer-events-none opacity-50">
            <span class="px-2.5 h-full flex items-center text-gray-400 font-bold">−</span>
            <span class="px-2 text-xs font-bold text-gray-400 min-w-[20px] text-center">${ci.quantity}</span>
            <span class="px-2.5 h-full flex items-center text-gray-400 font-bold">+</span>
           </div>`
        : `<div class="flex items-center border border-[#c3c8c1]/60 rounded-lg bg-[#F0EDE6] h-8 overflow-hidden">
            <button onclick="updateQty('${ci.id}', ${ci.quantity - 1})" class="px-2.5 h-full flex items-center justify-center text-stone-600 hover:text-[#3D6B4F] font-bold active:bg-[#c3c8c1]/20 transition-all">−</button>
            <span class="px-2 text-xs font-bold text-[#3D6B4F] min-w-[20px] text-center">${ci.quantity}</span>
            <button onclick="updateQty('${ci.id}', ${ci.quantity + 1})" class="px-2.5 h-full flex items-center justify-center text-stone-600 hover:text-[#3D6B4F] font-bold active:bg-[#c3c8c1]/20 transition-all">+</button>
           </div>`;

      const priceDisplay = isUnavailable
        ? `<p class="text-md font-bold text-gray-400 line-through">${formatPaise(ci.price_paise * ci.quantity)}</p>`
        : `<p class="text-md font-bold text-[#3D6B4F]">${formatPaise(ci.price_paise * ci.quantity)}</p>`;

      return `
        <article class="${cardBg} border rounded-xl p-4 shadow-sm relative flex flex-col gap-3" data-purpose="basket-item">
          <div class="flex gap-4">
            <div class="w-20 h-20 bg-[#F7F3EC] border border-[#c3c8c1]/20 rounded-lg overflow-hidden flex-shrink-0 cursor-pointer" onclick="window.location.href='product.html?id=${ci.product_id}'">
              <img alt="${ci.name}" class="w-full h-full object-cover" src="${imgUrl}" loading="lazy" />
            </div>
            <div class="flex-grow pr-8">
              <h3 class="font-['Playfair_Display'] font-bold text-md ${isUnavailable ? 'text-gray-500' : 'text-[#3D6B4F]'} leading-tight cursor-pointer" onclick="window.location.href='product.html?id=${ci.product_id}'">${ci.name}</h3>
              <p class="text-xs text-[#74786f] mt-1 cursor-pointer" onclick="window.location.href='/mobile-buyer/seller-profile.html?id=${ci.seller_id}'">${ci.seller_name}</p>
              <p class="text-xs font-semibold ${isUnavailable ? 'text-gray-400' : 'text-[#C8973A]'} mt-1">${formatPaise(ci.price_paise)}</p>
            </div>
          </div>
          ${unavailBanner}
          <div class="flex justify-between items-center border-t border-[#c3c8c1]/20 pt-3 mt-1">
            ${qtyControls}
            <div class="text-right">${priceDisplay}</div>
          </div>
          <button onclick="removeItem('${ci.id}')" aria-label="Remove item" class="absolute top-2 right-2 p-1.5 text-stone-400 hover:text-red-500 rounded-full hover:bg-stone-100 transition-all flex items-center justify-center">
            <span class="material-symbols-outlined text-[18px]">close</span>
          </button>
        </article>
      `;
    }).join('');
  }


  async function updateQty(id, newQty) {
    if (newQty <= 0) {
      await removeItem(id);
      return;
    }
    try {
      const res = await apiClient.patch(`/cart/items/${id}`, { quantity: newQty });
      if (res.data && res.data.success) {
        await fetchCart();
      }
    } catch (err) {
      console.error("Failed to update quantity:", err);
      if (err.response?.status === 422) {
        alert("Cannot add more: requested quantity exceeds available stock.");
      } else {
        alert("Failed to update quantity.");
      }
    }
  }

  async function removeItem(id) {
    try {
      const res = await apiClient.delete(`/cart/items/${id}`);
      if (res.data && res.data.success) {
        await fetchCart();
      }
    } catch (err) {
      console.error("Failed to remove item:", err);
      alert("Failed to remove item.");
    }
  }

  document.getElementById('btn-checkout')?.addEventListener('click', () => {
    window.location.href = '/mobile-buyer/checkout.html';
  });

  window.updateQty = updateQty;
  window.removeItem = removeItem;
  window.addEventListener('DOMContentLoaded', initCart);
</script>
</body>
</html>
