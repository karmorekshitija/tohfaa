  <title>Terms &amp; Conditions | Tohfa</title>
  <script>
async function handleFooterSellerLink(e) {
  if (e) e.preventDefault();
  const isMobile = window.innerWidth < 768;
  const token = sessionStorage.getItem('tohfa_access_token');
  if (!token) {
    sessionStorage.setItem('tohfa_redirect_seller', 'true');
    /* login bypassed */(window.location.pathname + window.location.search);
    return;
  }

  try {
    const res = await fetch('/api/profile/me', {
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      }
    });
    if (res.ok) {
      const data = await res.json();
      if (data && data.success) {
        const role = data.data.role;
        if (role === 'seller') {
          window.location.href = isMobile ? '/mobile-seller/dashboard.html' : '/seller/dashboard.html';
          return;
        }
      }
    }
  } catch(err) {
    console.error("Error checking seller status:", err);
  }
  
  window.location.href = isMobile ? '/mobile-buyer/become-seller.html' : '/buyer/become-seller.html';
}

// Check if we need to auto-redirect back to dashboard/signup after login redirect
document.addEventListener("DOMContentLoaded", () => {
  const needsRedirect = sessionStorage.getItem('tohfa_redirect_seller');
  if (needsRedirect === 'true') {
    sessionStorage.removeItem('tohfa_redirect_seller');
    const token = sessionStorage.getItem('tohfa_access_token');
    if (token) {
      handleFooterSellerLink();
    }
  }
});

window.openContactModal = function(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  const modal = document.getElementById('tohfa-contact-modal');
  if (modal) {
    modal.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }
};

window.closeContactModal = function() {
  const modal = document.getElementById('tohfa-contact-modal');
  if (modal) {
    modal.classList.remove('is-open');
    document.body.style.overflow = '';
  }
};

if (!window.hasContactModalEscListener) {
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.closeContactModal();
    }
  });
  window.hasContactModalEscListener = true;
}

window.openRefundsModal = function(e) {
  if (e) {
    e.preventDefault();

if (!window.hasRefundsModalEscListener) {
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {

    }
  });
  window.hasRefundsModalEscListener = true;
}
</script>

  <script>
    function switchTab(type) {
        const sellersBtn = document.getElementById('tab-sellers');
        const buyersBtn = document.getElementById('tab-buyers');
        const sellersSection = document.getElementById('content-sellers-section');
        const buyersSection = document.getElementById('content-buyers-section');
        
        if (type === 'sellers') {
            sellersBtn.className = "flex-1 py-3 px-4 rounded-full font-bold text-[12px] transition-all duration-300 bg-[#2d5a3d] text-white active-tab-indicator";
            buyersBtn.className = "flex-1 py-3 px-4 rounded-full font-bold text-[12px] transition-all duration-300 text-[#144227] bg-transparent";
            sellersSection.classList.remove('hidden');
            buyersSection.classList.add('hidden');
        } else {
            buyersBtn.className = "flex-1 py-3 px-4 rounded-full font-bold text-[12px] transition-all duration-300 bg-[#2d5a3d] text-white active-tab-indicator";
            sellersBtn.className = "flex-1 py-3 px-4 rounded-full font-bold text-[12px] transition-all duration-300 text-[#144227] bg-transparent";
            buyersSection.classList.remove('hidden');
            sellersSection.classList.add('hidden');
        }
    }
  </script>
