<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="/src/components/DeviceRedirect.js"></script>
    <script src="/src/components/ReportWidget.js" defer></script>
    <script src="/src/components/ProtectedRoute.js"></script>
    <meta charset="utf-8"/>
    <title>Tohfa | Your Orders</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
      <style>
        .artisan-card-hover {
            transition: all 0.2s ease;
        }
        .artisan-card-hover:active {
            transform: scale(0.97);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-background text-on-surface font-dm-sans min-h-screen pb-24">

<!-- Mobile Header Bar -->
<header class="flex justify-between items-center px-4 h-16 w-full z-50 bg-[#F7F3EC] border-b border-[#8FAF82] sticky top-0">
    <button class="p-2 -ml-2 text-primary flex items-center justify-center min-h-[44px] min-w-[44px]" onclick="window.location.href='profile.html'">
        <span class="material-symbols-outlined text-2xl">arrow_back</span>
    </button>
    <h1 class="font-playfair text-xl font-bold text-primary">Your Orders</h1>
    <div class="w-10"></div> <!-- Spacer to center title -->
</header>

<main class="px-4 py-6 space-y-6 max-w-md mx-auto">
    <!-- Filter Pills (Horizontal Scrollable) -->
    <div class="flex flex-nowrap items-center gap-2 overflow-x-auto hide-scrollbar py-1">
        <button id="pill-all" onclick="filterStatus('all')" class="bg-primary text-white px-5 py-2 rounded-full text-xs font-semibold whitespace-nowrap artisan-card-hover">All</button>
        <button id="pill-active" onclick="filterStatus('active')" class="bg-white border border-[#8FAF82]/30 text-on-surface-variant px-5 py-2 rounded-full text-xs font-semibold whitespace-nowrap artisan-card-hover">Active</button>
        <button id="pill-delivered" onclick="filterStatus('Delivered')" class="bg-white border border-[#8FAF82]/30 text-on-surface-variant px-5 py-2 rounded-full text-xs font-semibold whitespace-nowrap artisan-card-hover">Delivered</button>
        <button id="pill-cancelled" onclick="filterStatus('Cancelled')" class="bg-white border border-[#8FAF82]/30 text-on-surface-variant px-5 py-2 rounded-full text-xs font-semibold whitespace-nowrap artisan-card-hover">Cancelled</button>
    </div>

    <!-- Order List Stack -->
    <div id="orders-list-container" class="space-y-4">
        <!-- Loader State -->
        <div class="flex flex-col items-center justify-center py-12 space-y-3 text-secondary">
            <span class="material-symbols-outlined animate-spin text-3xl text-primary">sync</span>
            <p class="text-xs">Loading your orders...</p>
        </div>
    </div>

    <!-- Load More Button -->
    <div class="flex justify-center pt-2">
        <button id="btn-load-more" onclick="loadMore()" class="hidden w-full py-3 bg-white border border-[#8FAF82]/40 text-primary rounded-lg font-bold text-sm shadow-sm artisan-card-hover">
            Load more orders
        </button>
    </div>
</main>

<!-- Bottom Navigation Bar -->
<div class="md:hidden fixed bottom-0 left-0 right-0 bg-[#F7F3EC] border-t border-[#8FAF82] h-16 flex items-center justify-around z-50">
    <a href="home.html" class="flex flex-col items-center gap-0.5 text-[#414942] hover:text-primary transition-colors py-1 px-3">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-[10px] font-medium">Home</span>
    </a>
    <a href="categories.html" class="flex flex-col items-center gap-0.5 text-[#414942] hover:text-primary transition-colors py-1 px-3">
        <span class="material-symbols-outlined text-2xl">category</span>
        <span class="text-[10px] font-medium">Category</span>
    </a>
    <a href="reels.html" class="flex flex-col items-center gap-0.5 text-[#414942] hover:text-primary transition-colors py-1 px-3">
        <span class="material-symbols-outlined text-2xl">movie</span>
        <span class="text-[10px] font-medium">Reels</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center gap-0.5 text-primary transition-colors py-1 px-3">
        <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">person</span>
        <span class="text-[10px] font-bold">Profile</span>
    </a>
</div>

<script type="module">
    import apiClient from '/src/utils/apiClient.js';
    import { formatPaise } from '/src/utils/currency.js';

    let ordersList = [];
    let nextCursor = null;
    let currentStatus = 'all';

    async function initOrders() {
        const token = sessionStorage.getItem('tohfa_access_token');
        if (!token) {
            window.location.href = '/auth/login.html';
            return;
        }

        await fetchOrders(true);
    }

    async function fetchOrders(reset = false) {
        if (reset) {
            nextCursor = null;
            ordersList = [];
        }

        const container = document.getElementById('orders-list-container');
        if (reset) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 space-y-3 text-secondary">
                    <span class="material-symbols-outlined animate-spin text-3xl text-primary">sync</span>
                    <p class="text-xs">Loading your orders...</p>
                </div>
            `;
        }

        try {
            let url = `/orders?limit=10`;
            if (currentStatus !== 'all') {
                url += `&status=${currentStatus}`;
            }
            if (nextCursor) {
                url += `&cursor=${nextCursor}`;
            }

            const res = await apiClient.get(url);
            if (res.data && res.data.success) {
                const { orders, next_cursor, has_more } = res.data.data;
                nextCursor = next_cursor;

                if (reset) {
                    ordersList = orders;
                } else {
                    ordersList = [...ordersList, ...orders];
                }

                renderOrders();

                const loadMoreBtn = document.getElementById('btn-load-more');
                if (loadMoreBtn) {
                    if (has_more) {
                        loadMoreBtn.classList.remove('hidden');
                    } else {
                        loadMoreBtn.classList.add('hidden');
                    }
                }
            }
        } catch (err) {
            console.error("Error fetching orders:", err);
            container.innerHTML = `
                <div class="p-6 bg-red-50 border border-red-100 rounded-xl text-center space-y-3">
                    <span class="material-symbols-outlined text-red-600 text-3xl">error</span>
                    <p class="text-sm font-semibold text-red-900">Failed to load orders</p>
                    <button onclick="window.location.reload()" class="px-4 py-2 bg-primary text-white text-xs font-bold rounded-lg artisan-card-hover">Retry</button>
                </div>
            `;
        }
    }

    function getStatusBadgeClass(status) {
        switch(status) {
            case 'Awaiting Payment':
                return 'bg-amber-50 text-amber-800 border-amber-200';
            case 'Processing':
                return 'bg-purple-50 text-purple-800 border-purple-200';
            case 'Shipped':
                return 'bg-green-50 text-green-800 border-green-200';
            case 'Delivered':
                return 'bg-emerald-800 text-white border-transparent';
            case 'Cancelled':
                return 'bg-gray-800 text-white border-transparent';
            default:
                return 'bg-slate-50 text-slate-800 border-slate-200';
        }
    }

    function renderOrders() {
        const container = document.getElementById('orders-list-container');
        if (ordersList.length === 0) {
            container.innerHTML = `
                <div class="text-center py-12 bg-white border border-dashed border-[#8FAF82]/40 rounded-xl p-6 space-y-3">
                    <span class="material-symbols-outlined text-secondary text-4xl">receipt_long</span>
                    <h3 class="font-playfair text-base font-bold text-primary">No orders found</h3>
                    <p class="text-xs text-secondary max-w-xs mx-auto">You haven't placed any orders matching this filter yet.</p>
                    <button onclick="window.location.href='categories.html'" class="px-5 py-2.5 bg-primary text-white text-xs font-bold rounded-lg artisan-card-hover">Shop Handcrafted Goods</button>
                </div>
            `;
            return;
        }

        container.innerHTML = ordersList.map(o => {
            const formattedDate = new Date(o.created_at).toLocaleDateString('en-IN', {
                year: 'numeric', month: 'short', day: 'numeric'
            });

            let displayRef = o.order_ref;
            const seedMatch = o.order_ref.match(/^(TH-\d+)-(\d+)$/);
            if (seedMatch) {
                displayRef = seedMatch[1];
            }

            const urls = o.image_urls && o.image_urls.length > 0 
                ? o.image_urls.slice(0, 3) 
                : [o.primary_image_url || 'https://placehold.co/120x120/f4ede3/516447?text=Handcrafted'];

            const isCancelled = o.status === 'Cancelled';
            const cardOpacity = isCancelled ? 'opacity-60' : '';
            const actionIcon = isCancelled ? 'close' : 'chevron_right';

            const thumbnailsHtml = `<div class="flex -space-x-4">` + urls.map(url => `
                <img class="w-10 h-10 rounded-lg object-cover border-2 border-white shadow-sm flex-shrink-0" src="${url || 'https://placehold.co/120x120/f4ede3/516447?text=Handcrafted'}" alt="Item preview" loading="lazy">
            `).join('') + `</div>`;

            return `
                <div onclick="window.location.href='order-detail.html?id=${o.id}'" class="bg-white border border-[#8FAF82]/20 rounded-xl p-4 shadow-sm flex items-center justify-between artisan-card-hover cursor-pointer ${cardOpacity}">
                    <div class="flex items-center gap-4 flex-1 min-w-0">
                        ${thumbnailsHtml}
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1.5 mb-1 flex-wrap">
                                <span class="font-space-mono text-[9px] text-secondary font-bold">#${displayRef}</span>
                                <span class="text-[9px] text-secondary/30">•</span>
                                <span class="text-[9px] text-secondary">${formattedDate}</span>
                            </div>
                            <h3 class="font-playfair text-sm font-bold text-on-surface truncate pr-2">${o.item_preview}</h3>
                            <div class="mt-2">
                                <span class="font-space-mono text-[9px] font-bold tracking-wider rounded-full px-2 py-0.5 border ${getStatusBadgeClass(o.status)}">${o.status}</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right flex flex-col items-end gap-1 flex-shrink-0">
                        <span class="font-space-mono text-xs font-bold text-gold">${formatPaise(o.total_paise)}</span>
                        <span class="material-symbols-outlined text-secondary text-sm">${actionIcon}</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterStatus(status) {
        currentStatus = status;

        const pills = ['all', 'active', 'Delivered', 'Cancelled'];
        pills.forEach(p => {
            const btn = document.getElementById(`pill-${p.toLowerCase()}`);
            if (btn) {
                if (p === status) {
                    btn.className = "bg-primary text-white px-5 py-2 rounded-full text-xs font-semibold whitespace-nowrap artisan-card-hover";
                } else {
                    btn.className = "bg-white border border-[#8FAF82]/30 text-on-surface-variant px-5 py-2 rounded-full text-xs font-semibold whitespace-nowrap artisan-card-hover";
                }
            }
        });

        fetchOrders(true);
    }

    function loadMore() {
        fetchOrders(false);
    }

    window.filterStatus = filterStatus;
    window.loadMore = loadMore;

    window.addEventListener('DOMContentLoaded', initOrders);
</script>
</body>
</html>
