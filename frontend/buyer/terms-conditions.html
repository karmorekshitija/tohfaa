<!DOCTYPE html>
<html class="light scroll-smooth" lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Terms & Conditions | Tohfa</title>
  <script>
async function handleFooterSellerLink(e) {
  if (e) e.preventDefault();
  const isMobile = window.innerWidth < 768;
  const token = sessionStorage.getItem('tohfa_access_token');
  if (!token) {
    sessionStorage.setItem('tohfa_redirect_seller', 'true');
    window.location.href = '/auth/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
    return;
  }

  try {
    const res = await fetch('/api/profile/me', {
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      }
    });
    if (res.ok) {
      const data = await res.json();
      if (data && data.success) {
        const role = data.data.role;
        if (role === 'seller') {
          window.location.href = isMobile ? '/mobile-seller/dashboard.html' : '/seller/dashboard.html';
          return;
        }
      }
    }
  } catch(err) {
    console.error("Error checking seller status:", err);
  }
  
  window.location.href = isMobile ? '/mobile-buyer/become-seller.html' : '/buyer/become-seller.html';
}

// Check if we need to auto-redirect back to dashboard/signup after login redirect
document.addEventListener("DOMContentLoaded", () => {
  const needsRedirect = sessionStorage.getItem('tohfa_redirect_seller');
  if (needsRedirect === 'true') {
    sessionStorage.removeItem('tohfa_redirect_seller');
    const token = sessionStorage.getItem('tohfa_access_token');
    if (token) {
      handleFooterSellerLink();
    }
  }
});

window.openContactModal = function(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  const modal = document.getElementById('tohfa-contact-modal');
  if (modal) {
    modal.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }
};

window.closeContactModal = function() {
  const modal = document.getElementById('tohfa-contact-modal');
  if (modal) {
    modal.classList.remove('is-open');
    document.body.style.overflow = '';
  }
};

if (!window.hasContactModalEscListener) {
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.closeContactModal();
    }
  });
  window.hasContactModalEscListener = true;
}

window.openRefundsModal = function(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  const modal = document.getElementById('tohfa-refunds-modal');
  if (modal) {
    modal.classList.add('is-open');
    document.body.style.overflow = 'hidden';

};

window.closeRefundsModal = function() {
  const modal = document.getElementById('tohfa-refunds-modal');
  if (modal) {
    modal.classList.remove('is-open');
    document.body.style.overflow = '';
  }
};

if (!window.hasRefundsModalEscListener) {
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.closeRefundsModal();
    }
  });
  window.hasRefundsModalEscListener = true;
}
</script>

  <script>
    function switchTab(tab) {
        const sellersContent = document.getElementById('content-sellers');
        const buyersContent = document.getElementById('content-buyers');
        const sellersBtn = document.getElementById('btn-sellers');
        const buyersBtn = document.getElementById('btn-buyers');

        if (tab === 'sellers') {
            sellersContent.classList.remove('hidden');
            buyersContent.classList.add('hidden');
            
            // Active State
            sellersBtn.className = "px-8 py-3 rounded-full font-bold transition-all duration-200 bg-[#144227] text-white border-b-4 border-[#755b00]";
            // Inactive State
            buyersBtn.className = "px-8 py-3 rounded-full font-bold transition-all duration-200 bg-white text-[#144227] border-2 border-[#144227] hover:bg-[#144227]/5";
        } else {
            sellersContent.classList.add('hidden');
            buyersContent.classList.remove('hidden');
            
            // Active State
            buyersBtn.className = "px-8 py-3 rounded-full font-bold transition-all duration-200 bg-[#144227] text-white border-b-4 border-[#755b00]";
            // Inactive State
            sellersBtn.className = "px-8 py-3 rounded-full font-bold transition-all duration-200 bg-white text-[#144227] border-2 border-[#144227] hover:bg-[#144227]/5";
        }
    }
  </script>
</body>
</html>
