    <style>
        .scrim-warm {
            background: linear-gradient(to top, rgba(30, 20, 10, 0.85) 0%, rgba(30, 20, 10, 0.3) 40%, transparent 70%);
        }

        /* Reels Vertical Scroll-Snap Feed Styles */
        .reels-main-container {
            width: 100%;
            height: calc(100vh - 80px); /* Height for desktop header */
            display: flex;
            justify-content: center;
            align-items: center;
            background: #121212; /* Warm dark scrim backdrop */
            position: relative;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        @media (max-width: 768px) {
            .reels-main-container {
                height: calc(100vh - 116px); /* 56px topbar + 60px bottombar on mobile */
            }
            .reels-feed-container {
                max-width: 100% !important;
            }
            #mbt-topbar, #mbn-bottomnav {
                z-index: 250 !important;
            }
        }
        .reels-feed-container {
            width: 100%;
            max-width: 375px; /* Centered mobile-sized aspect ratio viewport */
            height: 100%;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scrollbar-width: none; /* Hide scrollbar Firefox */
            -ms-overflow-style: none;  /* Hide scrollbar IE/Edge */
            position: relative;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            background: #000000;
        }
        .reels-feed-container::-webkit-scrollbar {
            display: none; /* Hide scrollbar Chrome/Safari */
        }
        .reel-slide {
            scroll-snap-align: start;
            height: 100%;
            width: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #000;
        }
        .reel-video-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
        }
        .reel-video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #F7F3EC;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #F7F3EC;
        }
        @keyframes heart-pop {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 0;
            }
            15% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.9;
            }
            30% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.9;
            }
            80% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.9;
            }
            100% {
                transform: translate(-50%, -50%) scale(2.2);
                opacity: 0;
            }
        }
        .heart-pop-anim {
            animation: heart-pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>

    const COLORS = [
      '#3D6B4F', '#3D6B4F', '#7B5EA7', '#593d5d', '#b492b7',
      '#8FAF82', '#605e57', '#452b4a', '#3D6B4F', '#74786f'
    ];

    function getInitials(name) {
      if (!name) return 'U';
      const parts = name.trim().split(/\s+/);
      if (parts.length > 1) {
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }
      return parts[0][0].toUpperCase();
    }

    function getAvatarColor(name) {
      if (!name) return COLORS[0];
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % COLORS.length;
      return COLORS[index];
    }

    function formatCount(num) {
      if (num >= 1000) {
        return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
      }
      return num;
    }

    // Video Tracking state
    let currentTrackingVideo = null;
    let currentTrackingListener = null;

    function setupVideoTracking(slideEl, video) {
      if (currentTrackingVideo && currentTrackingListener) {
        currentTrackingVideo.removeEventListener('timeupdate', currentTrackingListener);
      }
      
      const fillEl = slideEl.querySelector('.progress-bar-fill');
      if (!fillEl || !video) return;
      
      currentTrackingVideo = video;
      currentTrackingListener = () => {
        if (video.duration) {
          const pct = (video.currentTime / video.duration) * 100;
          fillEl.style.width = `${pct}%`;
        }
      };
      video.addEventListener('timeupdate', currentTrackingListener);
    }

    // Setup IntersectionObserver
    const observerOptions = {
      root: document.getElementById('reels-feed-container'),
      threshold: 0.6
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        if (entry.isIntersecting) {
          const index = parseInt(entry.target.getAttribute('data-index'), 10);
          currentIndex = index;
          
          if (video) {
            video.muted = isMuted;
            video.play().catch(err => {
              console.log("Play interrupted or autoplay prevented:", err);
            });
          }
          
          setupVideoTracking(entry.target, video);

          // Populate products tray for this reel
          const reel = reelsList[currentIndex];
          if (reel.linked_products && reel.linked_products.length > 1) {
            renderProductsTray(reel.linked_products);
          } else {
            productsTrayList.innerHTML = `<p class="text-xs text-outline italic text-center py-4">No tagged products found.</p>`;
          }
        } else {
          if (video) {
            video.pause();
          }
        }
      });
    }, observerOptions);

      // Fetch Reels Feed
      await fetchFeed(targetReelId);

      setupEvents();

    async function fetchFeed(targetReelId = null) {
      if (isLoadingFeed) return;
      isLoadingFeed = true;

      reelsList = [...MOCK_REELS];

      try {
        const res = await apiClient.get('/reels/feed');
        if (res.data && res.data.success) {
          const apiReels = res.data.data.reels || [];
          if (apiReels.length > 0) {
            reelsList = [...apiReels, ...MOCK_REELS];
          }
        }
      } catch (err) {
        console.warn("Reels API unavailable, using mock reels:", err.message);
      }

      if (targetReelId) {
        const targetIndex = reelsList.findIndex(r => r.id == targetReelId);
        if (targetIndex !== -1) {
          currentIndex = targetIndex;
        }
      }

      renderReelsFeed();

      if (currentIndex > 0) {
        const container = document.getElementById('reels-feed-container');
        const slide = container.querySelector(`.reel-slide[data-index="${currentIndex}"]`);
        if (slide) {
          setTimeout(() => {
            slide.scrollIntoView({ block: 'start' });
          }, 100);
        }
      }

      isLoadingFeed = false;
    }

    function updateCurrentUserAvatar() {
      const userStr = sessionStorage.getItem('tohfa_user');
      if (userStr) {
        try {
          const user = JSON.parse(userStr);
          const name = user.display_name || user.full_name || 'Artisan User';
          const initials = getInitials(name);
          const bgCol = getAvatarColor(name);
          userAvatarLetter.textContent = initials;
          userAvatarCircle.style.backgroundColor = bgCol;
          
          if (user.avatar_url) {
            userAvatarCircle.innerHTML = `<img src="${user.avatar_url}" alt="${name}" class="w-full h-full object-cover" />`;
          }
        } catch (e) {
          console.error(e);
        }
      }
    }

    // Event setup
    function setupEvents() {
      // Event delegation for all slide actions
      document.getElementById('reels-feed-container').addEventListener('click', async (e) => {
        const target = e.target;
        
        // Find closest button or interactive element
        const btn = target.closest('button, a, .seller-avatar-wrapper, .seller-name, .reel-video-wrapper, .multiple-products-chevron');
        if (!btn) return;
        
        const slide = btn.closest('.reel-slide');
        if (!slide) return;
        
        const index = parseInt(slide.getAttribute('data-index'), 10);
        const activeReel = reelsList[index];
        
        if (btn.classList.contains('volume-toggle-btn')) {
          e.stopPropagation();
          isMuted = !isMuted;
          // Update mute state on all videos
          const videos = document.querySelectorAll('#reels-feed-container video');
          videos.forEach(v => { v.muted = isMuted; });
          // Update icons on all volume buttons
          const volumeIcons = document.querySelectorAll('#reels-feed-container .volume-toggle-btn span');
          volumeIcons.forEach(icon => {
            icon.textContent = isMuted ? 'volume_off' : 'volume_up';
          });
        }
        else if (btn.classList.contains('reel-video-wrapper')) {
          // Play/Pause toggle
          const video = slide.querySelector('video');
          const playOverlay = slide.querySelector('.play-overlay');
          if (video.paused) {
            video.play();
            playOverlay.style.opacity = '0';
          } else {
            video.pause();
            playOverlay.style.opacity = '1';
          }
        }
        else if (btn.classList.contains('like-btn')) {
          e.stopPropagation();
          activeReel.is_liked = !activeReel.is_liked;
          if (activeReel.is_liked) {
            activeReel.like_count = (activeReel.like_count || 0) + 1;
          } else {
            activeReel.like_count = Math.max(0, (activeReel.like_count || 0) - 1);
          }
          
          // Update like UI for this slide
          const likeIcon = btn.querySelector('span');
          const likeCountEl = btn.nextElementSibling;
          if (activeReel.is_liked) {
            btn.style.color = '#ef4444';
            likeIcon.style.fontVariationSettings = "'FILL' 1";
            btn.style.transform = 'scale(1.3)';
            setTimeout(() => { btn.style.transform = 'scale(1)'; }, 200);
          } else {
            btn.style.color = '';
            likeIcon.style.fontVariationSettings = "'FILL' 0";
          }
          likeCountEl.textContent = formatCount(activeReel.like_count);
          
          // API call
          if (activeReel.id && !String(activeReel.id).startsWith('mock-')) {
            try {
              const res = await apiClient.post(`/reels/${activeReel.id}/like`);
              if (res.data && res.data.success) {
                activeReel.is_liked = res.data.data.liked;
                activeReel.like_count = res.data.data.like_count;
                likeCountEl.textContent = formatCount(activeReel.like_count);
              }
            } catch (err) {
              console.error("Like toggle backend API call failed:", err);
            }
          }
        }
        else if (btn.classList.contains('comment-btn')) {
          e.stopPropagation();
          openCommentsDrawer();
        }
        else if (btn.classList.contains('save-btn')) {
          e.stopPropagation();
          const token = sessionStorage.getItem('tohfa_access_token');
          if (!token) {
            window.location.href = '/auth/login.html';
            return;
          }
          try {
            const saveIcon = btn.querySelector('span');
            const saveCountEl = btn.nextElementSibling;
            if (activeReel.is_saved) {
              await apiClient.delete(`/reels/${activeReel.id}/save`);
              activeReel.is_saved = false;
              activeReel.save_count = Math.max(0, (activeReel.save_count || 1) - 1);
              btn.classList.remove('text-[#C8973A]');
              saveIcon.style.fontVariationSettings = "'FILL' 0";
            } else {
              await apiClient.post(`/reels/${activeReel.id}/save`);
              activeReel.is_saved = true;
              activeReel.save_count = (activeReel.save_count || 0) + 1;
              btn.classList.add('text-[#C8973A]');
              saveIcon.style.fontVariationSettings = "'FILL' 1";
            }
            saveCountEl.textContent = formatCount(activeReel.save_count);
          } catch (err) {
            console.error("Save toggle failed:", err);
          }
        }
        else if (btn.classList.contains('follow-btn')) {
          e.stopPropagation();
          const token = sessionStorage.getItem('tohfa_access_token');
          if (!token) {
            window.location.href = '/auth/login.html';
            return;
          }
          const sellerId = btn.getAttribute('data-seller-id');
          const isFollowed = activeReel.seller.is_followed;
          try {
            if (isFollowed) {
              await apiClient.delete(`/follows/${sellerId}`);
              activeReel.seller.is_followed = false;
            } else {
              await apiClient.post(`/follows/${sellerId}`);
              activeReel.seller.is_followed = true;
            }
            // Update follow button text on all slides for the same seller
            const followButtons = document.querySelectorAll(`#reels-feed-container button[data-seller-id="${sellerId}"]`);
            followButtons.forEach(fBtn => {
              if (activeReel.seller.is_followed) {
                fBtn.textContent = 'Following';
                fBtn.classList.remove('bg-white/20', 'hover:bg-white/30', 'border-white/30');
                fBtn.classList.add('bg-primary/55', 'border-white/60');
              } else {
                fBtn.textContent = '+ Follow';
                fBtn.classList.remove('bg-primary/55', 'border-white/60');
                fBtn.classList.add('bg-white/20', 'hover:bg-white/30', 'border-white/30');
              }
            });
          } catch (err) {
            console.error("Follow toggle failed:", err);
          }
        }
        else if (btn.classList.contains('seller-avatar-wrapper') || btn.classList.contains('seller-name')) {
          e.stopPropagation();
          const sellerId = btn.getAttribute('data-seller-id');
          if (sellerId) {
            sessionStorage.setItem('last_reel_id', activeReel.id);
            window.location.href = `/buyer/seller-profile.html?id=${sellerId}`;
          }
        }
        else if (btn.classList.contains('multiple-products-chevron')) {
          e.preventDefault();
          e.stopPropagation();
          toggleProductsTray();
        }
      });

      // Up/Down Arrows navigation
      btnPrev.addEventListener('click', () => navigateFeed(-1));
      btnNext.addEventListener('click', () => navigateFeed(1));

      window.addEventListener('keydown', (e) => {
        if (document.activeElement === commentInput) return; // ignore when typing comments
        if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault();
          navigateFeed(-1);
        } else if (e.key === 'ArrowDown' || e.key === 'PageDown') {
          e.preventDefault();
          navigateFeed(1);
        }
      });

      // Comments Drawer Controls
      closeCommentsBtn.addEventListener('click', closeCommentsDrawer);
      commentsNotch.addEventListener('click', closeCommentsDrawer);

      // Products Tray Controls
      closeTrayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeProductsTray();
      });

      // Escape key to close tray and drawer
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeProductsTray();
          closeCommentsDrawer();
        }
      });

      // Comment input validation & counter
      commentInput.addEventListener('input', () => {
        const text = commentInput.value;
        const len = text.length;
        charCounter.textContent = `${len}/300`;
        sendCommentBtn.disabled = (len === 0 || len > 300);
      });

      // Send comment
      sendCommentBtn.addEventListener('click', async () => {
        const text = commentInput.value.trim();
        if (!text) return;
        const token = sessionStorage.getItem('tohfa_access_token');
        if (!token) {
          window.location.href = '/auth/login.html';
          return;
        }

        try {
          sendCommentBtn.disabled = true;
          const res = await apiClient.post(`/reels/${reelsList[currentIndex].id}/comments`, { body: text });
          if (res.data && res.data.success) {
            const addedComment = res.data.data;
            // Update local state if needed (not fully managing full list in this simplified version)
            renderCommentsSection();

            // Update local reel state & UI counts
            const currentReel = reelsList[currentIndex];
            currentReel.comment_count = (currentReel.comment_count || 0) + 1;
            
            const activeSlide = document.querySelector(`.reel-slide[data-index="${currentIndex}"]`);
            if (activeSlide) {
              const countEl = activeSlide.querySelector('.comment-count');
              if (countEl) countEl.textContent = formatCount(currentReel.comment_count);
            }
            commentsTitleCount.textContent = currentReel.comment_count;

            // Clear textbox
            commentInput.value = '';
            charCounter.textContent = '0/300';
            sendCommentBtn.disabled = true;

            // Scroll comments list back to top
            commentsListEl.scrollTo({ top: 0, behavior: 'smooth' });
          }
        } catch (err) {
          console.error("Failed to add comment:", err);
        } finally {
          sendCommentBtn.disabled = false;
        }
      });
    }


    function navigateFeed(dir) {
      if (reelsList.length === 0) return;
      
      // Close comments drawer and products tray first
      closeCommentsDrawer();
      closeProductsTray();

      currentIndex += dir;
      if (currentIndex < 0) {
        currentIndex = 0;
        Toast.show("You've reached the start of the feed", "info");
      } else if (currentIndex >= reelsList.length) {
        currentIndex = reelsList.length - 1;
        Toast.show("You've reached the end of the feed", "info");
      } else {
        const container = document.getElementById('reels-feed-container');
        const slide = container.querySelector(`.reel-slide[data-index="${currentIndex}"]`);
        if (slide) {
          slide.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    }

    // Comments overlay sliding drawer
    function openCommentsDrawer() {
      closeProductsTray();
      commentsDrawer.classList.remove('translate-y-full');
      loadComments();
    }

    function closeCommentsDrawer() {
      commentsDrawer.classList.add('translate-y-full');
    }

    // Products Tray sliding drawer
    function openProductsTray() {
      if (!productsTray) return;
      closeCommentsDrawer();
      productsTray.classList.remove('translate-y-full');
      productsTray.classList.add('translate-y-0');
    }

    function closeProductsTray() {
      if (!productsTray) return;
      productsTray.classList.remove('translate-y-0');
      productsTray.classList.add('translate-y-full');
    }

    function toggleProductsTray() {
      if (!productsTray) return;
      if (productsTray.classList.contains('translate-y-full')) {
        openProductsTray();
      } else {
        closeProductsTray();
      }
    }

    function renderProductsTray(products) {
      if (!productsTrayList) return;
      productsTrayList.innerHTML = products.map(p => {
        const imageUrl = p.image_url || 'https://lh3.googleusercontent.com/aida-public/AB6AXuAAZiDnM3KZeHPoNlisnrstR7ME6BmQFPXvK76PYKy1ujj2agVH3udiLlw98xG6eWUk198aT8h7Vw1voxQNgsbfvq_XIlClNc9JuK-1FeQ1a1RpIcJBUfmf2y0JlIfo7ZdBCZBtLKrnDq993tYtD9I8bnKBAIaLwYx9vH53IF9Ck4Mn7nj4pUrjZVHDdPQNZZTRUPzrcl7S9pKbFX2rSqgbrz4FmwxTrZHN-m8D66nSgQbUzz92WUQSKzCvd_K368R8nFscdjVvPoE';
        const price = (p.price_paise || 0) / 100;
        return `
          <div class="product-tray-item flex items-center gap-md p-sm bg-[#F7F3EC] border border-[#8FAF82]/50 rounded-xl hover:border-primary hover:bg-surface-container transition-all cursor-pointer active:scale-[0.98] pointer-events-auto" data-id="${p.id}">
            <div class="w-12 h-12 rounded-lg overflow-hidden bg-white border border-[#8FAF82]/20 flex-shrink-0">
              <img src="${imageUrl}" alt="${p.name}" class="w-full h-full object-cover">
            </div>
            <div class="flex-grow min-w-0">
              <h4 class="text-xs font-semibold text-primary truncate leading-tight">${p.name}</h4>
              <p class="text-xs font-bold text-on-surface mt-1">₹${price}</p>
            </div>
            <span class="material-symbols-outlined text-[16px] text-outline">arrow_forward_ios</span>
          </div>
        `;
      }).join('');

      productsTrayList.querySelectorAll('.product-tray-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const productId = item.getAttribute('data-id');
          closeProductsTray();
          window.location.href = `/buyer/product.html?id=${productId}`;
        });
      });
    }

    async function loadComments() {
      commentsListEl.innerHTML = `<div class="p-4 text-center">Loading...</div>`;
      try {
        const res = await apiClient.get(`/reels/${reelsList[currentIndex].id}/comments`);
        if (res.data && res.data.success) {
          const comments = res.data.data.comments || [];
          commentsTitleCount.textContent = res.data.data.comment_count || 0;
          
          if (comments.length === 0) {
            commentsListEl.innerHTML = `<p class="p-4 text-center text-sm">No comments yet.</p>`;
          } else {
            commentsListEl.innerHTML = comments.map(comment => {
              const name = comment.user_name || 'Artisan Admirer';
              const initials = getInitials(name);
              const bgCol = getAvatarColor(name);
              return `
                <div class="flex items-start gap-sm">
                  <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 border border-outline-variant" style="background-color: ${bgCol}">
                    <span class="text-white font-bold text-xs">${initials}</span>
                  </div>
                  <div class="flex-grow min-w-0">
                    <div class="flex items-baseline">
                      <span class="font-bold text-sm">${name}</span>
                      <span class="text-xs text-outline/80 ml-2">${comment.time_ago || 'Just now'}</span>
                    </div>
                    <p class="text-sm text-on-surface-variant mt-[2px] leading-relaxed break-words pr-2">${comment.body}</p>
                  </div>
                </div>
              `;
            }).join('');
          }
        }
      } catch (err) {
        console.error("Failed to load comments:", err);
      }
    }

    function renderCommentsSection() {
      loadComments();
    }

    // Run on DOMContentLoaded
    window.addEventListener('DOMContentLoaded', initPage);

    async function checkAuthState() {
        const token = sessionStorage.getItem('tohfa_access_token');
        const authContainer = document.getElementById('auth-buttons-container');
        
        if (token) {
            isLoggedIn = true;
            try {
                let avatarUrl = null;
                let initial = 'A';
                try {
                    const res = await apiClient.get('/profile/me');
                    if (res.data && res.data.success) {
                        avatarUrl = res.data.data.avatar_url;
                        if (res.data.data.full_name) {
                            initial = res.data.data.full_name.charAt(0).toUpperCase();
                        }
                    }
                } catch (err) {
                    console.error("Failed to fetch profile avatar:", err);
                }
                
                let avatarHtml = '';
                if (avatarUrl) {
                    avatarHtml = `<img src="${avatarUrl}" alt="Profile" class="w-10 h-10 rounded-full border border-[#8FAF82] object-cover cursor-pointer" onclick="window.location.href='profile.html'"/>`;
                } else {
                    avatarHtml = `
                        <a href="/buyer/profile.html" class="w-10 h-10 rounded-full bg-[#3D6B4F] flex items-center justify-center text-white font-bold border border-[#8FAF82] text-sm overflow-hidden flex-shrink-0 cursor-pointer">
                            ${initial}
                        </a>
                    `;
                }

                if (authContainer) {
                    authContainer.innerHTML = '';
                }
            } catch(e) {
                console.error("Failed to parse token:", e);
                logout();
            }
        } else {
            isLoggedIn = false;
            if (authContainer) {
                authContainer.innerHTML = `
                    <div class="flex items-center gap-md">
                        <a href="/auth/login.html" class="text-[#3D6B4F] hover:underline text-sm font-semibold">Login</a>
                        <a href="/auth/signup-buyer.html" class="bg-[#3D6B4F] text-white px-md py-sm rounded-lg text-sm font-semibold hover:opacity-90 transition-all">Register</a>
                    </div>
                `;
            }
        }
    }

    checkAuthState();
</script>
