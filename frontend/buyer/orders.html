<script type="module">
    import apiClient from '/src/utils/apiClient.js';
    import { logout } from '/src/utils/auth.js';
    import { formatPaise } from '/src/utils/currency.js';

    let ordersList = [];
    let nextCursor = null;
    let currentStatus = 'all';

    async function initOrders() {
        const token = sessionStorage.getItem('tohfa_access_token');
        if (!token) {
            window.location.href = '/auth/login.html';
            return;
        }
        
        // Set user avatar
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const payload = JSON.parse(window.atob(base64));
            const avatarEl = document.getElementById('nav-avatar');
            if (avatarEl) {
                if (payload.username) {
                    avatarEl.innerText = payload.username.substring(0, 1).toUpperCase();
                } else if (payload.email) {
                    avatarEl.innerText = payload.email.substring(0, 1).toUpperCase();
                }
            }
            
            // Fetch profile to get real avatar
            try {
                const res = await apiClient.get('/profile/me');
                if (res.data && res.data.success && res.data.data.avatar_url) {
                    if (avatarEl) {
                        avatarEl.innerHTML = `<img src="${res.data.data.avatar_url}" alt="Avatar" class="w-full h-full object-cover"/>`;
                    }
                }
            } catch (err) {
                console.error("Failed to fetch avatar:", err);
            }
        } catch(e) {
            console.error(e);
        }
        
        // Fetch cart count for nav badge
        try {
            const res = await apiClient.get('/cart');
            if (res.data && res.data.success) {
                const count = res.data.data.item_count;
                const navBadge = document.getElementById('nav-cart-badge');
                if (navBadge) {
                    if (count > 0) {
                        navBadge.innerText = count;
                        navBadge.classList.remove('hidden');
                    } else {
                        navBadge.classList.add('hidden');
                    }
                }
            }
        } catch (e) {
            console.error(e);
        }

        await fetchOrders(true);
    }

    async function fetchOrders(reset = false) {
        if (reset) {
            nextCursor = null;
            ordersList = [];
        }
        
        const container = document.getElementById('orders-list-container');
        if (reset) {
            container.innerHTML = `
                <div class="flex flex-col gap-sm py-8 text-center text-sage">
                    <span class="material-symbols-outlined animate-spin text-[32px] text-primary">sync</span>
                    <p class="font-body-md mt-sm text-on-surface-variant">Loading orders...</p>
                </div>
            `;
        }

        try {
            let url = `/orders?limit=10`;
            if (currentStatus !== 'all') {
                url += `&status=${currentStatus}`;
            }
            if (nextCursor) {
                url += `&cursor=${nextCursor}`;
            }

            const res = await apiClient.get(url);
            if (res.data && res.data.success) {
                const { orders, next_cursor, has_more } = res.data.data;
                nextCursor = next_cursor;

                if (reset) {
                    ordersList = orders;
                } else {
                    ordersList = [...ordersList, ...orders];
                }

                renderOrders();

                const loadMoreBtn = document.getElementById('btn-load-more');
                if (has_more) {
                    loadMoreBtn.classList.remove('hidden');
                } else {
                    loadMoreBtn.classList.add('hidden');
                }
            }
        } catch (err) {
            console.error("Error fetching orders:", err);
            container.innerHTML = `
                <div class="bg-error-container/20 border border-error/30 rounded-2xl p-lg text-center my-lg">
                    <span class="material-symbols-outlined text-error text-[32px] mb-xs">error</span>
                    <p class="font-body-md text-error font-semibold">Failed to load orders</p>
                    <button onclick="window.location.reload()" class="mt-md px-md py-sm bg-primary text-white rounded-lg font-bold hover:bg-primary/95 transition-all">Retry</button>
                </div>
            `;
        }
    }

    function getStatusBadgeClass(status) {
        switch(status) {
            case 'Awaiting Payment':
                return 'bg-amber-50 text-amber-800 border border-amber-200';
            case 'Processing':
                return 'bg-violet-50 text-violet-800 border border-violet-200';
            case 'Shipped':
                return 'bg-[#8FAF82] text-[#3D6B4F] border border-[#8FAF82]';
            case 'Delivered':
                return 'bg-[#3D6B4F] text-white';
            case 'Cancelled':
                return 'bg-[#3D6B4F] text-white';
            default:
                return 'bg-sage-soft text-primary border border-sage';
        }
    }

    function renderOrders() {
        const container = document.getElementById('orders-list-container');
        if (ordersList.length === 0) {
            container.innerHTML = `
                <div class="text-center py-12 bg-white border border-dashed border-sage rounded-2xl p-lg">
                    <span class="material-symbols-outlined text-sage text-[48px] mb-sm">receipt_long</span>
                    <h3 class="font-headline-lg text-lg text-primary">No orders found</h3>
                    <p class="text-on-surface-variant text-sm mt-xs max-w-xs mx-auto">You haven't placed any orders matching this filter yet.</p>
                    <button onclick="window.location.href='category.html'" class="mt-md px-xl py-md bg-primary text-white font-bold rounded-lg hover:bg-primary/90 transition-all">Shop Handcrafted Goods</button>
                </div>
            `;
            return;
        }

        container.innerHTML = ordersList.map(o => {
            const formattedDate = new Date(o.created_at).toLocaleDateString('en-IN', {
                year: 'numeric', month: 'short', day: 'numeric'
            });

            let displayRef = o.order_ref;
            const seedMatch = o.order_ref.match(/^(TH-\d+)-(\d+)$/);
            if (seedMatch) {
                displayRef = seedMatch[1];
            }

            const subOrdersHtml = (o.sub_orders || []).map(sub => {
                const subStatusBadge = getStatusBadgeClass(sub.delivery_status);
                const trackingHtml = sub.tracking_number 
                    ? `<div class="mt-sm text-xs text-on-surface-variant bg-sage-soft/30 p-sm rounded-lg flex flex-wrap items-center gap-md">
                         <span><strong>Courier:</strong> ${sub.courier_name || 'N/A'}</span>
                         <span><strong>Tracking #:</strong> ${sub.tracking_number}</span>
                         ${sub.estimated_delivery ? `<span><strong>Est. Delivery:</strong> ${sub.estimated_delivery}</span>` : ''}
                       </div>`
                    : '';

                const subItemsHtml = (sub.items || []).map(item => {
                    const imgUrl = item.image_url || 'https://placehold.co/120x120/f4ede3/516447?text=Handcrafted';
                    return `
                        <div class="flex items-center gap-md py-sm border-b border-sage/10 last:border-b-0">
                            <img class="w-10 h-10 rounded-lg object-cover flex-shrink-0 border border-sage/20" src="${imgUrl}" alt="${item.product_name}">
                            <div class="flex-grow">
                                <h4 class="font-body-md text-sm font-semibold text-on-surface leading-tight">${item.product_name}</h4>
                                <p class="text-xs text-on-surface-variant mt-0.5">Qty: ${item.quantity} • ${formatPaise(item.unit_price_paise)} each</p>
                            </div>
                            <span class="font-data-price text-sm text-on-surface font-semibold">${formatPaise(item.unit_price_paise * item.quantity)}</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-ivory-card border border-sage/20 rounded-xl p-md mt-md first:mt-0 shadow-sm">
                        <div class="flex justify-between items-center border-b border-sage/10 pb-sm mb-sm flex-wrap gap-sm">
                            <div>
                                <span class="font-body-md text-xs text-on-surface-variant uppercase tracking-wider font-semibold">Seller:</span>
                                <span class="font-title-serif text-sm font-bold text-primary ml-1">${sub.shop_name || sub.seller_name}</span>
                            </div>
                            <span class="font-['Cinzel'] text-[10px] font-bold tracking-[0.1em] rounded-full px-2.5 py-0.5 border ${subStatusBadge} uppercase">${sub.delivery_status}</span>
                        </div>
                        <div class="divide-y divide-sage/5">
                            ${subItemsHtml}
                        </div>
                        ${trackingHtml}
                        <div class="flex justify-between items-center mt-sm pt-sm border-t border-dashed border-sage/10 text-xs">
                            <span class="text-on-surface-variant">Seller Subtotal</span>
                            <span class="font-data-price text-primary font-bold">${formatPaise(sub.subtotal_paise)}</span>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="bg-white border-2 border-sage/30 rounded-2xl p-lg artisan-shadow flex flex-col hover:border-primary transition-all duration-300">
                    <!-- Parent Order Header -->
                    <div class="flex justify-between items-start border-b border-sage/20 pb-md mb-md flex-wrap gap-md">
                        <div>
                            <div class="flex items-center gap-sm flex-wrap mb-1">
                                <span class="font-data-price text-[13px] font-bold text-primary tracking-wide">#${displayRef}</span>
                                <span class="text-outline opacity-40">•</span>
                                <span class="font-data-price text-xs text-on-surface-variant opacity-80">${formattedDate}</span>
                            </div>
                            <div class="flex items-center gap-xs">
                                <span class="text-xs text-on-surface-variant">Overall Status:</span>
                                <span class="font-['Cinzel'] text-[10px] font-bold tracking-[0.1em] rounded-full px-2 py-0.5 border ${getStatusBadgeClass(o.status)} uppercase">${o.status}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-on-surface-variant block mb-1">Grand Total</span>
                            <span class="font-data-price text-xl font-bold text-gold">${formatPaise(o.total_paise)}</span>
                        </div>
                    </div>

                    <!-- Sub Orders List -->
                    <div class="space-y-sm">
                        ${subOrdersHtml}
                    </div>

                    <!-- Card Action Footer -->
                    <div class="flex justify-end mt-md pt-sm border-t border-sage/10">
                        <button onclick="window.location.href='order-detail.html?id=${o.id}'" class="flex items-center gap-xs text-sm font-semibold text-primary hover:text-primary-container transition-colors group">
                            <span>View Tracking Details</span>
                            <span class="material-symbols-outlined text-[18px] group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterStatus(status) {
        currentStatus = status;
        
        // Reset pills styling
        const pills = ['all', 'active', 'Delivered', 'Cancelled'];
        pills.forEach(p => {
            const btn = document.getElementById(`pill-${p.toLowerCase()}`);
            if (btn) {
                if (p === status) {
                    btn.className = "bg-primary text-white px-lg py-sm rounded-full font-body-md transition-transform active:scale-95";
                } else {
                    btn.className = "bg-ivory border border-sage text-on-surface-variant px-lg py-sm rounded-full font-body-md hover:bg-surface-container-low transition-colors";
                }
            }
        });

        fetchOrders(true);
    }

    function loadMore() {
        fetchOrders(false);
    }

    window.filterStatus = filterStatus;
    window.loadMore = loadMore;

    window.addEventListener('DOMContentLoaded', initOrders);

    let isLoggedIn = false;
    async function checkAuthState() {
        const token = sessionStorage.getItem('tohfa_access_token');
        const authContainer = document.getElementById('auth-buttons-container');
        
        if (token) {
            isLoggedIn = true;
            try {
                let avatarUrl = null;
                let initial = 'A';
                try {
                    const res = await apiClient.get('/profile/me');
                    if (res.data && res.data.success) {
                        avatarUrl = res.data.data.avatar_url;
                        if (res.data.data.full_name) {
                            initial = res.data.data.full_name.charAt(0).toUpperCase();
                        }
                    }
                } catch (err) {
                    console.error("Failed to fetch profile avatar:", err);
                }
                
                let avatarHtml = '';
                if (avatarUrl) {
                    avatarHtml = `<img src="${avatarUrl}" alt="Profile" class="w-10 h-10 rounded-full border border-[#8FAF82] object-cover cursor-pointer" onclick="window.location.href='profile.html'"/>`;
                } else {
                    avatarHtml = `
                        <a href="/buyer/profile.html" class="w-10 h-10 rounded-full bg-[#3D6B4F] flex items-center justify-center text-white font-bold border border-[#8FAF82] text-sm overflow-hidden flex-shrink-0 cursor-pointer">
                            ${initial}
                        </a>
                    `;
                }

                if (authContainer) {
                    authContainer.innerHTML = '';
                }
            } catch(e) {
                console.error("Failed to parse token:", e);
                logout();
            }
        } else {
            isLoggedIn = false;
            if (authContainer) {
                authContainer.innerHTML = `
                    <div class="flex items-center gap-md">
                        <a href="/auth/login.html" class="text-[#3D6B4F] hover:underline text-sm font-semibold">Login</a>
                        <a href="/auth/signup-buyer.html" class="bg-[#3D6B4F] text-white px-md py-sm rounded-lg text-sm font-semibold hover:opacity-90 transition-all">Register</a>
                    </div>
                `;
            }
        }
    }

    checkAuthState();
</script>
