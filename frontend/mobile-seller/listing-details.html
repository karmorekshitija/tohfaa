<!DOCTYPE html>

<html lang="en"><head>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script src="/src/components/DeviceRedirect.js"></script>

<meta charset="utf-8"/>
<title>Tohfa - Craft New Listing</title>
<!-- Tailwind CSS v3 CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
  <script src="/components/seller-components.js"></script>
</head>
<body class="bg-parchment text-forest">
<seller-layout active-tab="catalog">
<main class="px-4 py-6">
<!-- BEGIN: Header Section -->
<section class="mb-8" data-purpose="listing-header">
<div class="flex items-center gap-4 mb-4">
<button id="btn-back" class="bg-white rounded-full p-2 border border-forest/20 transition-all hover:bg-forest/5 active:scale-95 duration-200">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<h1 class="text-3xl font-playfair">Craft New Listing</h1>
</div>
<!-- BEGIN: Progress Indicator -->
<div class="relative py-4 overflow-x-auto scrollbar-hide" data-purpose="progress-stepper">
<div class="flex items-center justify-between min-w-[500px] relative px-4">
<div class="progress-line"></div>
<div class="flex flex-col items-center gap-2 relative z-10">
<div class="w-9 h-9 rounded-full flex items-center justify-center step-completed">
<svg class="h-5 w-5" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</div>
<span class="text-[10px] font-mono tracking-widest uppercase">Photos</span>
</div>
<div class="flex flex-col items-center gap-2 relative z-10">
<div class="w-9 h-9 rounded-full flex items-center justify-center bg-white border-2 border-forest ring-4 ring-parchment">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[10px] font-mono tracking-widest uppercase border-b-2 border-forest pb-1">Details</span>
</div>
<div class="flex flex-col items-center gap-2 relative z-10">
<div class="w-9 h-9 rounded-full flex items-center justify-center bg-white border border-forest/20">
<svg class="h-5 w-5 opacity-40" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[10px] font-mono tracking-widest uppercase opacity-40">Pricing</span>
</div>
<div class="flex flex-col items-center gap-2 relative z-10">
<div class="w-9 h-9 rounded-full flex items-center justify-center bg-white border border-forest/20">
<svg class="h-5 w-5 opacity-40" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6 0a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[10px] font-mono tracking-widest uppercase opacity-40">Shipping</span>
</div>
<div class="flex flex-col items-center gap-2 relative z-10">
<div class="w-9 h-9 rounded-full flex items-center justify-center bg-white border border-forest/20">
<svg class="h-5 w-5 opacity-40" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[10px] font-mono tracking-widest uppercase opacity-40">Preview</span>
</div>
</div>
</div>
<!-- END: Progress Indicator -->
</section>
<!-- END: Header Section -->
<!-- BEGIN: Listing Form -->
<form class="space-y-8" data-purpose="listing-form">
<!-- BEGIN: Product Type -->
<fieldset>
<legend class="text-xl font-playfair mb-4">Product Type</legend>
<div class="grid grid-cols-1 gap-4">
<!-- Selection 1 -->
<label id="label-product-type-premade" class="relative flex flex-col p-5 bg-white border-2 border-forest rounded-2xl cursor-pointer">
<div class="flex items-start gap-4">
<div id="outer-product-type-premade" class="mt-1 w-5 h-5 border-2 border-forest rounded-full flex items-center justify-center">
<div id="dot-product-type-premade" class="w-2.5 h-2.5 bg-forest rounded-full"></div>
</div>
<div>
<span class="block font-bold text-lg mb-1">Pre-made / Ready Inventory</span>
<span class="text-sm opacity-70">Standard item ready to ship directly from inventory</span>
</div>
</div>
<input checked="" class="hidden" name="product_type" type="radio" value="pre-made" id="input-product-type-premade"/>
</label>
<!-- Selection 2 -->
<label id="label-product-type-custom" class="relative flex flex-col p-5 bg-white border border-forest/10 rounded-2xl cursor-pointer">
<div class="flex items-start gap-4">
<div id="outer-product-type-custom" class="mt-1 w-5 h-5 border border-forest/30 rounded-full flex items-center justify-center">
<div id="dot-product-type-custom" class="w-2.5 h-2.5 bg-forest rounded-full hidden"></div>
</div>
<div>
<span class="block font-bold text-lg mb-1">Customisable / Made-to-Order</span>
<span class="text-sm opacity-70">Accept custom text, colors, photos, or special instructions</span>
</div>
</div>
<input class="hidden" name="product_type" type="radio" value="custom" id="input-product-type-custom"/>
</label>
</div>
</fieldset>
<!-- END: Product Type -->
<!-- BEGIN: Discovery Settings -->
<div class="p-6 bg-forest/[0.03] border border-forest/10 rounded-2xl">
<h2 class="text-xl font-playfair mb-2">Discovery Settings</h2>
<div class="space-y-2">
<label class="text-[10px] font-mono uppercase tracking-widest opacity-60">Product Tags</label>
<div class="relative">
<input id="input-tags" class="w-full bg-white border border-forest/10 rounded-xl px-4 py-3 font-sans focus:ring-forest focus:border-forest" placeholder="Add tags..." type="text"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-forest/40">#</span>
</div>
</div>
</div>
<!-- END: Discovery Settings -->
<!-- BEGIN: Listing Title -->
<div class="space-y-2">
<h2 class="text-xl font-playfair">Listing Title</h2>
<div class="relative">
<input id="input-title" maxlength="80" class="w-full bg-white border border-forest/10 rounded-xl px-4 py-4 italic font-sans focus:ring-forest focus:border-forest text-lg" placeholder="e.g. Moonlight Jasmine Resin Study" type="text"/>
<div class="text-right mt-2">
<span id="title-char-count" class="text-[10px] font-mono uppercase text-sage">0/80 characters</span>
</div>
</div>
</div>
<!-- END: Listing Title -->
<!-- BEGIN: Category Selection -->
<div class="space-y-4">
<h2 class="text-xl font-playfair">Category Selection</h2>
<div id="category-buttons-container" class="flex flex-wrap gap-2"></div>
</div>
<!-- END: Category Selection -->
<!-- BEGIN: Dimensions & Weight -->
<div class="space-y-4">
<h2 class="text-xl font-playfair">Dimensions &amp; Weight</h2>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="text-[10px] font-mono uppercase tracking-widest opacity-60">L (CM)</label>
<input id="input-length" class="w-full bg-white border border-forest/10 rounded-xl px-4 py-3 focus:ring-forest focus:border-forest" placeholder="L" type="number"/>
</div>
<div class="space-y-2">
<label class="text-[10px] font-mono uppercase tracking-widest opacity-60">W (CM)</label>
<input id="input-width" class="w-full bg-white border border-forest/10 rounded-xl px-4 py-3 focus:ring-forest focus:border-forest" placeholder="W" type="number"/>
</div>
<div class="space-y-2">
<label class="text-[10px] font-mono uppercase tracking-widest opacity-60">H (CM)</label>
<input id="input-height" class="w-full bg-white border border-forest/10 rounded-xl px-4 py-3 focus:ring-forest focus:border-forest" placeholder="H" type="number"/>
</div>
<div class="space-y-2">
<label class="text-[10px] font-mono uppercase tracking-widest opacity-60">Weight (G)</label>
<input id="input-weight" class="w-full bg-white border border-forest/10 rounded-xl px-4 py-3 focus:ring-forest focus:border-forest" placeholder="Weight" type="number"/>
</div>
</div>
</div>
<!-- END: Dimensions & Weight -->
<!-- BEGIN: Product Description -->
<div class="space-y-4">
<h2 class="text-xl font-playfair">Product Description</h2>
<textarea id="textarea-description" class="w-full bg-white border border-forest/10 rounded-2xl px-4 py-4 font-sans focus:ring-forest focus:border-forest resize-none" placeholder="Provide a detailed description of the product that you are offering..." rows="6"></textarea>
</div>
<!-- END: Product Description -->
</form>
<!-- END: Listing Form -->
</main>
<!-- BEGIN: Footer Actions -->
<footer class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-forest/10 p-4" data-purpose="sticky-footer">
<div class="flex items-center gap-3">
<button id="btn-keep-draft" class="flex-1 bg-white border border-forest py-3 px-2 rounded-full font-sans font-bold text-xs whitespace-nowrap min-h-[48px] transition-all hover:bg-forest/5 active:scale-95 duration-200">
        Keep Draft
      </button>
<button id="btn-continue" class="flex-[2] bg-forest text-white py-3 px-4 rounded-full font-sans font-bold text-sm min-h-[48px] flex items-center justify-center gap-2 transition-all hover:opacity-90 active:scale-95 duration-200">
        Continue
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button id="btn-discard" class="flex-1 bg-white border border-red-200 text-red-600 py-3 px-2 rounded-full font-sans font-bold text-xs whitespace-nowrap min-h-[48px] transition-all hover:bg-red-50 active:scale-95 duration-200">
        Discard
      </button>
</div>
</footer>
<!-- END: Footer Actions -->
</seller-layout>

<script>
(function() {
  const DRAFT_ID = sessionStorage.getItem('draft_id');
  if (!DRAFT_ID) {
    window.location.href = '/mobile-seller/catalog.html';
    return;
  }

  const API_BASE = window.location.origin;
  let selectedCategory = '';

  function getToken() {
    try {
      const user = JSON.parse(sessionStorage.getItem('tohfa_user') || '{}');
      return user.token || user.accessToken || user.access_token || sessionStorage.getItem('tohfa_access_token');
    } catch { return null; }
  }

  function showToast(msg, type = 'success') {
    let t = document.getElementById('toast-details');
    if (!t) { t = document.createElement('div'); t.id = 'toast-details'; document.body.appendChild(t); }
    t.className = `fixed top-5 left-1/2 -translate-x-1/2 z-[300] px-5 py-3 rounded-xl shadow-lg text-sm font-semibold transition-all duration-300 ${
      type === 'success' ? 'bg-forest text-white' : 'bg-red-500 text-white'
    }`;
    t.textContent = msg;
    t.style.opacity = '1';
    setTimeout(() => { t.style.opacity = '0'; }, 3500);
  }

  function updateProductTypeUI() {
    const isPremade = document.getElementById('input-product-type-premade').checked;
    
    const labelPremade = document.getElementById('label-product-type-premade');
    const labelCustom = document.getElementById('label-product-type-custom');
    
    const outerPremade = document.getElementById('outer-product-type-premade');
    const outerCustom = document.getElementById('outer-product-type-custom');
    
    const dotPremade = document.getElementById('dot-product-type-premade');
    const dotCustom = document.getElementById('dot-product-type-custom');

    if (isPremade) {
      labelPremade.className = "relative flex flex-col p-5 bg-white border-2 border-forest rounded-2xl cursor-pointer";
      labelCustom.className = "relative flex flex-col p-5 bg-white border border-forest/10 rounded-2xl cursor-pointer";
      outerPremade.className = "mt-1 w-5 h-5 border-2 border-forest rounded-full flex items-center justify-center";
      outerCustom.className = "mt-1 w-5 h-5 border border-forest/30 rounded-full flex items-center justify-center";
      dotPremade.classList.remove('hidden');
      dotCustom.classList.add('hidden');
    } else {
      labelPremade.className = "relative flex flex-col p-5 bg-white border border-forest/10 rounded-2xl cursor-pointer";
      labelCustom.className = "relative flex flex-col p-5 bg-white border-2 border-forest rounded-2xl cursor-pointer";
      outerPremade.className = "mt-1 w-5 h-5 border border-forest/30 rounded-full flex items-center justify-center";
      outerCustom.className = "mt-1 w-5 h-5 border-2 border-forest rounded-full flex items-center justify-center";
      dotPremade.classList.add('hidden');
      dotCustom.classList.remove('hidden');
    }
  }

  document.getElementById('input-product-type-premade').addEventListener('change', updateProductTypeUI);
  document.getElementById('input-product-type-custom').addEventListener('change', updateProductTypeUI);

  const titleInput = document.getElementById('input-title');
  const titleCharCount = document.getElementById('title-char-count');
  titleInput.addEventListener('input', () => {
    const len = titleInput.value.length;
    titleCharCount.textContent = `${len}/80 characters`;
  });

  async function fetchCategories() {
    try {
      const res = await fetch(`${API_BASE}/api/admin/categories`, {
        headers: { 'Authorization': `Bearer ${getToken()}` }
      });
      if (!res.ok) throw new Error('API failed');
      const data = await res.json();
      const categories = data.data || data || [];
      renderCategoryButtons(categories.map(c => typeof c === 'string' ? c : (c.name || '')));
    } catch (err) {
      console.warn('Failed to fetch categories, falling back to default list', err);
      renderCategoryButtons(['Pressed Flowers', 'Cyanotypes', 'Handmade Paper', 'Artisan Kits']);
    }
  }

  function renderCategoryButtons(categories) {
    const container = document.getElementById('category-buttons-container');
    container.innerHTML = '';
    categories.forEach(catName => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = catName;
      btn.className = `px-5 py-3 rounded-full text-sm font-sans transition-all duration-200 active:scale-95 ${
        selectedCategory === catName 
          ? 'bg-forest text-white border-2 border-forest font-bold font-sans' 
          : 'bg-white border border-forest/10 hover:border-forest hover:bg-forest/5'
      }`;
      btn.addEventListener('click', () => {
        selectedCategory = catName;
        renderCategoryButtons(categories);
      });
      container.appendChild(btn);
    });
  }

  function init() {
    let draftData = {};
    try {
      draftData = JSON.parse(sessionStorage.getItem('draft_data') || '{}');
    } catch {}

    if (draftData.product_type === 'custom') {
      document.getElementById('input-product-type-custom').checked = true;
    } else {
      document.getElementById('input-product-type-premade').checked = true;
    }
    updateProductTypeUI();

    document.getElementById('input-title').value = draftData.title || '';
    titleInput.dispatchEvent(new Event('input'));

    document.getElementById('input-tags').value = Array.isArray(draftData.tags) ? draftData.tags.join(', ') : (draftData.tags || '');
    document.getElementById('input-length').value = draftData.length_cm || '';
    document.getElementById('input-width').value = draftData.width_cm || '';
    document.getElementById('input-height').value = draftData.height_cm || '';
    document.getElementById('input-weight').value = draftData.weight_g || '';
    document.getElementById('textarea-description').value = draftData.description || '';

    selectedCategory = draftData.category || '';
    fetchCategories();
  }

  function gatherFormData() {
    const isCustom = document.getElementById('input-product-type-custom').checked;
    const tagsRaw = document.getElementById('input-tags').value;
    const tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);

    return {
      product_type: isCustom ? 'custom' : 'pre-made',
      title: document.getElementById('input-title').value.trim() || 'Untitled Draft',
      tags: tags,
      length_cm: parseFloat(document.getElementById('input-length').value) || null,
      width_cm: parseFloat(document.getElementById('input-width').value) || null,
      height_cm: parseFloat(document.getElementById('input-height').value) || null,
      weight_g: parseFloat(document.getElementById('input-weight').value) || null,
      description: document.getElementById('textarea-description').value.trim(),
      category: selectedCategory
    };
  }

  async function updateDraftOnBackend(fields) {
    const token = getToken();
    const res = await fetch(`${API_BASE}/api/seller/listings/${DRAFT_ID}`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify(fields)
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || 'Failed to update draft');
    }
    return await res.json();
  }

  document.getElementById('btn-back').addEventListener('click', () => {
    const local = gatherFormData();
    let oldData = {};
    try { oldData = JSON.parse(sessionStorage.getItem('draft_data') || '{}'); } catch {}
    sessionStorage.setItem('draft_data', JSON.stringify({ ...oldData, ...local }));
    window.location.href = '/mobile-seller/listing-photos.html';
  });

  document.getElementById('btn-keep-draft').addEventListener('click', async () => {
    const btn = document.getElementById('btn-keep-draft');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-forest border-t-transparent rounded-full animate-spin"></span>`;

    try {
      const local = gatherFormData();
      let oldData = {};
      try { oldData = JSON.parse(sessionStorage.getItem('draft_data') || '{}'); } catch {}
      const merged = { ...oldData, ...local };
      sessionStorage.setItem('draft_data', JSON.stringify(merged));
      await updateDraftOnBackend(local);
      showToast('Draft saved successfully', 'success');
      setTimeout(() => {
        window.location.href = '/mobile-seller/catalog.html';
      }, 1000);
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });

  document.getElementById('btn-continue').addEventListener('click', async () => {
    const btn = document.getElementById('btn-continue');
    const originalText = btn.innerHTML;
    
    const local = gatherFormData();
    if (!local.title) {
      showToast('Please enter a listing title', 'error');
      return;
    }
    if (!local.category) {
      showToast('Please select a category', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span class="inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

    try {
      let oldData = {};
      try { oldData = JSON.parse(sessionStorage.getItem('draft_data') || '{}'); } catch {}
      const merged = { ...oldData, ...local };
      sessionStorage.setItem('draft_data', JSON.stringify(merged));
      await updateDraftOnBackend(local);
      window.location.href = '/mobile-seller/listing-pricing-a.html';
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  });

  document.getElementById('btn-discard').addEventListener('click', async () => {
    if (!confirm('Are you sure you want to discard this draft? This will permanently delete it.')) return;
    
    const btn = document.getElementById('btn-discard');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-red-600 border-t-transparent rounded-full animate-spin"></span>`;

    try {
      const token = getToken();
      const res = await fetch(`${API_BASE}/api/seller/listings/${DRAFT_ID}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Failed to delete draft');
      sessionStorage.removeItem('draft_id');
      sessionStorage.removeItem('draft_data');
      showToast('Draft discarded', 'success');
      setTimeout(() => {
        window.location.href = '/mobile-seller/catalog.html';
      }, 1000);
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });

  init();
})();
</script>
</body></html>
