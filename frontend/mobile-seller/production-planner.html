<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script src="/src/components/DeviceRedirect.js"></script>

  <script src="/src/components/ReportWidget.js" defer></script>
  <script src="/src/components/ProtectedRoute.js"></script>
  <meta charset="utf-8"/>
  <title>Production Planner | Tohfa Artisan Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
  
</head>
<body class="bg-white text-slate-800 font-body p-4 min-h-screen">
  <header class="flex items-center gap-4 mb-6">
    <a href="/mobile-seller/dashboard.html" class="p-2 hover:bg-slate-100 rounded-full transition-colors flex items-center justify-center">
      <span class="material-symbols-outlined text-primary text-3xl">arrow_back</span>
    </a>
    <div>
      <h1 class="text-2xl font-heading font-bold text-primary">Production Planner</h1>
      <p class="text-xs text-slate-500">Manage studio capacities & deadlines.</p>
    </div>
  </header>

  <!-- Main view tabs for mobile screen sizing -->
  <div class="flex border-b border-slate-200 mb-6 bg-slate-50 rounded-lg overflow-hidden">
    <button id="tab-capacity-btn" class="flex-1 py-3 text-center text-sm font-bold text-primary border-b-2 border-primary">Bandwidth</button>
    <button id="tab-calendar-btn" class="flex-1 py-3 text-center text-sm font-bold text-slate-500 border-b-2 border-transparent">Schedule</button>
    <button id="tab-batches-btn" class="flex-1 py-3 text-center text-sm font-bold text-slate-500 border-b-2 border-transparent">Batches</button>
  </div>

  <div id="tab-capacity" class="space-y-4">
    <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Product Capacity Limits</h2>
    <div id="bandwidth-list" class="space-y-4"></div>
  </div>

  <div id="tab-calendar" class="space-y-4 hidden">
    <!-- Quick horizontal week pagination -->
    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
      <button id="prev-week" class="material-symbols-outlined text-slate-600">chevron_left</button>
      <span id="week-label" class="text-xs font-bold font-mono text-primary"></span>
      <button id="next-week" class="material-symbols-outlined text-slate-600">chevron_right</button>
    </div>
    <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
  </div>

  <div id="tab-batches" class="space-y-4 hidden">
    <div id="batches-list" class="space-y-4"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] items-center gap-3 px-5 py-3 rounded-full text-white text-sm font-bold shadow-lg transition-all duration-300"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = sessionStorage.getItem('tohfa_access_token') || sessionStorage.getItem('access_token');
      if (!token) {
        window.location.href = '/auth/login.html?next=/mobile-seller/production-planner.html';
        return;
      }

      // Mobile Tab Controls
      const tabs = {
        'capacity': document.getElementById('tab-capacity'),
        'calendar': document.getElementById('tab-calendar'),
        'batches': document.getElementById('tab-batches')
      };
      const tabBtns = {
        'capacity': document.getElementById('tab-capacity-btn'),
        'calendar': document.getElementById('tab-calendar-btn'),
        'batches': document.getElementById('tab-batches-btn')
      };

      function switchTab(activeId) {
        Object.keys(tabs).forEach(id => {
          if (id === activeId) {
            tabs[id].classList.remove('hidden');
            tabBtns[id].className = "flex-1 py-3 text-center text-sm font-bold text-primary border-b-2 border-primary";
          } else {
            tabs[id].classList.add('hidden');
            tabBtns[id].className = "flex-1 py-3 text-center text-sm font-bold text-slate-500 border-b-2 border-transparent";
          }
        });
      }

      Object.keys(tabBtns).forEach(id => {
        tabBtns[id].addEventListener('click', () => switchTab(id));
      });

      function showToast(msg, type='success') {
        const toast = document.getElementById('toast');
        toast.style.backgroundColor = type === 'success' ? '#3D6B4F' : '#BA1A1A';
        toast.innerHTML = `<span>${msg}</span>`;
        toast.classList.remove('hidden');
        toast.classList.add('flex');
        setTimeout(() => {
          toast.classList.add('hidden');
          toast.classList.remove('flex');
        }, 3000);
      }

      let currentWeekStart = getStartOfWeek(new Date());
      let selectedDate = new Date();
      let listings = [];
      let orders = [];

      function getStartOfWeek(d) {
        const date = new Date(d);
        const day = date.getDay();
        const diff = date.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(date.setDate(diff));
      }

      function isSameDay(d1Str, d2Date) {
        if (!d1Str) return false;
        const d1 = new Date(d1Str);
        return d1.getFullYear() === d2Date.getFullYear() &&
               d1.getMonth() === d2Date.getMonth() &&
               d1.getDate() === d2Date.getDate();
      }

      async function loadData() {
        try {
          const catRes = await fetch('/api/seller/catalog', { headers: { 'Authorization': `Bearer ${token}` } });
          if (catRes.ok) {
            const resp = await catRes.json();
            listings = (resp.data?.listings || resp.listings || []).filter(l => l.status === 'active');
          }
          const ordRes = await fetch('/api/seller/orders?per_page=100', { headers: { 'Authorization': `Bearer ${token}` } });
          if (ordRes.ok) {
            const resp = await ordRes.json();
            orders = resp.data?.orders || resp.orders || [];
          }
          renderBandwidth();
          renderCalendar();
          renderBatches();
        } catch (err) {
          console.error(err);
          showToast("Failed to load planner data.", "error");
        }
      }

      function renderBandwidth() {
        const list = document.getElementById('bandwidth-list');
        list.innerHTML = '';
        if (listings.length === 0) {
          list.innerHTML = '<p class="text-xs text-slate-500 italic py-4">No active listings.</p>';
          return;
        }

        listings.forEach(l => {
          const card = document.createElement('div');
          card.className = 'bg-slate-50 border border-slate-200/60 rounded-xl p-4 space-y-3';
          card.innerHTML = `
            <div class="flex justify-between items-start">
              <h3 class="font-heading font-bold text-primary text-base">${l.title}</h3>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Daily Slots</label>
                <input class="w-full bg-white border border-slate-200 rounded py-1 px-2 text-center text-xs font-mono" type="number" min="0" value="${l.daily_max_slots || 0}" id="daily-${l.listing_id || l.id}"/>
              </div>
              <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Weekly Cap</label>
                <input class="w-full bg-white border border-slate-200 rounded py-1 px-2 text-center text-xs font-mono" type="number" min="0" value="${l.weekly_cap || 0}" id="weekly-${l.listing_id || l.id}"/>
              </div>
            </div>
          `;
          card.querySelector(`#daily-${l.listing_id || l.id}`).addEventListener('change', (e) => {
            updateCapacity(l.listing_id || l.id, { daily_max_slots: parseInt(e.target.value) || 0 });
          });
          card.querySelector(`#weekly-${l.listing_id || l.id}`).addEventListener('change', (e) => {
            updateCapacity(l.listing_id || l.id, { weekly_cap: parseInt(e.target.value) || 0 });
          });
          list.appendChild(card);
        });
      }

      async function updateCapacity(listingId, fields) {
        try {
          const res = await fetch(`/api/seller/listings/${listingId}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(fields)
          });
          if (res.ok) {
            showToast("Capacity updated!", "success");
            loadData();
          }
        } catch {
          showToast("Update failed", "error");
        }
      }

      function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';

        const weekDates = [];
        const dayNames = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
        for (let i = 0; i < 7; i++) {
          const d = new Date(currentWeekStart);
          d.setDate(currentWeekStart.getDate() + i);
          weekDates.push(d);
        }

        document.getElementById('week-label').textContent = `${weekDates[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${weekDates[6].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;

        weekDates.forEach((date, index) => {
          const isSelected = isSameDay(selectedDate.toISOString(), date);
          const activeOrders = orders.filter(o => !['cancelled', 'rto', 'delivered'].includes(o.status) && isSameDay(o.deadline_at, date));

          const dayCell = document.createElement('div');
          dayCell.className = `flex flex-col items-center justify-center py-3 rounded-lg border cursor-pointer ${isSelected ? 'bg-primary text-white border-primary' : 'bg-slate-50 border-slate-200'}`;
          dayCell.innerHTML = `
            <span class="text-[9px] uppercase font-bold opacity-75">${dayNames[index]}</span>
            <span class="text-sm font-bold mt-1 font-mono">${date.getDate()}</span>
            <span class="text-[10px] font-mono mt-1 ${activeOrders.length > 0 ? 'bg-orange-400 text-white rounded px-1' : 'opacity-50'}">${activeOrders.length}</span>
          `;
          dayCell.addEventListener('click', () => {
            selectedDate = date;
            renderCalendar();
            renderBatches();
            switchTab('batches');
          });
          grid.appendChild(dayCell);
        });
      }

      function renderBatches() {
        const list = document.getElementById('batches-list');
        list.innerHTML = '';

        const formattedDate = selectedDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        const dayOrders = orders.filter(o => !['cancelled', 'rto', 'delivered'].includes(o.status) && isSameDay(o.deadline_at, selectedDate));

        list.innerHTML = `<h3 class="font-heading font-bold text-primary text-base border-b border-slate-200 pb-2">${formattedDate} batches (${dayOrders.length} orders)</h3>`;

        if (dayOrders.length === 0) {
          list.innerHTML += '<p class="text-xs text-slate-500 italic py-6 text-center">No orders due.</p>';
          return;
        }

        const groups = {};
        dayOrders.forEach(o => {
          if (!groups[o.listing_id]) {
            groups[o.listing_id] = { title: o.product_title || 'Craft Item', orders: [] };
          }
          groups[o.listing_id].orders.push(o);
        });

        Object.keys(groups).forEach(listingId => {
          const group = groups[listingId];
          const item = document.createElement('div');
          item.className = 'bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3';
          item.innerHTML = `
            <div class="flex justify-between">
              <span class="text-[10px] font-bold text-slate-400">BATCH #${listingId}</span>
              <span class="text-xs font-bold text-primary">${group.orders.length} units</span>
            </div>
            <h4 class="font-heading font-bold text-slate-800 text-sm">${group.title}</h4>
            <button class="w-full bg-primary text-white py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 active:scale-95 transition-transform" id="btn-complete-${listingId}">
              <span class="material-symbols-outlined text-[16px]">check_circle</span> Mark Batch Complete
            </button>
          `;
          item.querySelector(`#btn-complete-${listingId}`).addEventListener('click', async (e) => {
            const btn = e.target.closest('button');
            btn.disabled = true;
            btn.textContent = 'Updating...';
            try {
              for (const o of group.orders) {
                await fetch(`/api/seller/orders/${o.id}/status`, {
                  method: 'PATCH',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                  },
                  body: JSON.stringify({ status: 'packed' })
                });
              }
              showToast("Batch updated successfully!", "success");
              loadData();
            } catch {
              showToast("Error updating batch", "error");
              btn.disabled = false;
            }
          });
          list.appendChild(item);
        });
      }

      document.getElementById('prev-week').addEventListener('click', () => {
        currentWeekStart.setDate(currentWeekStart.getDate() - 7);
        renderCalendar();
      });
      document.getElementById('next-week').addEventListener('click', () => {
        currentWeekStart.setDate(currentWeekStart.getDate() + 7);
        renderCalendar();
      });

      loadData();
    });
  </script>
</body>
</html>
