<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script src="/src/components/DeviceRedirect.js"></script>

    <script src="/src/components/ReportWidget.js" defer></script>
    <script src="/src/components/ProtectedRoute.js"></script>
    <meta charset="utf-8"/>
    <title>Transaction Ledger | Seller Studio | Tohfa</title>
    <!-- Google Fonts -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
    <script src="/components/seller-components.js"></script>
    
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #F7F3EC;
            color: #1A1A1A;
        }
        h1, h2, h3, h4, .font-heading {
            font-family: 'Playfair Display', serif;
        }
        .font-mono {
            font-family: 'Space Mono', monospace;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        button, a {
            transition: all 0.2s ease;
        }
        button:hover, a:hover {
            opacity: 0.9;
        }
    </style>

<!-- Mobile Style Overrides -->
<style>
  @media (max-width: 768px) {
    /* Stack grid & flex items */
    .grid, [class*="grid-cols-"], .flex-row, .md\:flex-row {
      display: flex !important;
      flex-direction: column !important;
      width: 100% !important;
    }
    /* Let card items span full width */
    .col-span-1, .col-span-2, .col-span-3, .col-span-4, .col-span-5, .col-span-6,
    .col-span-7, .col-span-8, .col-span-9, .col-span-10, .col-span-11, .col-span-12,
    .lg\:col-span-1, .lg\:col-span-2, .lg\:col-span-3, .lg\:col-span-4,
    .lg\:col-span-5, .lg\:col-span-6, .lg\:col-span-7, .lg\:col-span-8,
    .lg\:col-span-9, .lg\:col-span-10, .lg\:col-span-11, .lg\:col-span-12 {
      grid-column: span 12 / span 12 !important;
      width: 100% !important;
    }
    /* Set min spacing */
    .grid > div, .flex > div, .space-y-lg > div, .space-y-md > div {
      margin-top: 12px;
    }
    /* Enforce playfair display for headings */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Playfair Display', serif !important;
    }
  }
</style>

</head>
<body class="min-h-screen bg-white" id="body-content">

<seller-layout active-tab="payments">
    <!-- Header -->
    <header class="mb-8 flex items-center gap-4">
        <a href="/mobile-seller/payouts.html" class="p-2 hover:bg-sage/10 rounded-full transition-colors flex items-center justify-center">
            <span class="material-symbols-outlined text-forest text-3xl">arrow_back</span>
        </a>
        <div>
            <h1 class="text-xl font-bold text-forest">Transaction Ledger</h1>
            <p class="text-base text-forest">Complete records of sales, refunds, commissions, and manual/direct settlement entries.</p>
        </div>
    </header>

    <!-- Filters Section -->
    <section class="bg-white p-6 rounded-card border border-sage/20 shadow-premium space-y-4 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm font-bold text-forest uppercase mb-1">Start Date</label>
                <input type="date" id="start-date" class="w-full px-3 py-2 bg-parchment/20 border border-sage/30 rounded-btn text-sm text-forest focus:ring-1 focus:ring-forest outline-none" onchange="loadLedger()" />
            </div>
            <div>
                <label class="block text-sm font-bold text-forest uppercase mb-1">End Date</label>
                <input type="date" id="end-date" class="w-full px-3 py-2 bg-parchment/20 border border-sage/30 rounded-btn text-sm text-forest focus:ring-1 focus:ring-forest outline-none" onchange="loadLedger()" />
            </div>
            <div>
                <label class="block text-sm font-bold text-forest uppercase mb-1">Type</label>
                <select id="type-select" class="w-full px-3 py-2 bg-parchment/20 border border-sage/30 rounded-btn text-sm text-forest focus:ring-1 focus:ring-forest outline-none" onchange="loadLedger()">
                    <option value="">All Types</option>
                    <option value="SALE">Sales</option>
                    <option value="REFUND">Refunds</option>
                    <option value="FEE">Platform Fees</option>
                    <option value="ADJUSTMENT">Adjustments</option>
                </select>
            </div>
            <div class="flex items-end">
                <button onclick="clearFilters()" class="w-full py-2.5 bg-parchment/40 text-forest text-sm font-bold border border-sage/35 rounded-btn hover:bg-parchment/80 transition-colors">Clear Filters</button>
            </div>
        </div>
    </section>

    <!-- Ledger Table -->
    <div class="bg-white p-6 rounded-card border border-sage/20 shadow-premium space-y-6">
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="text-sm font-bold uppercase tracking-wider text-forest border-b border-sage/10">
                    <tr>
                        <th class="py-3 px-4">Date</th>
                        <th class="py-3 px-4">Ref ID</th>
                        <th class="py-3 px-4">Type</th>
                        <th class="py-3 px-4">Gross Amt</th>
                        <th class="py-3 px-4">Fee Deducted</th>
                        <th class="py-3 px-4">Taxes (TDS)</th>
                        <th class="py-3 px-4">Net Amount</th>
                    </tr>
                </thead>
                <tbody id="ledger-tbody" class="divide-y divide-sage/10 text-sm font-medium text-forest">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>

        <div id="ledger-empty-state" class="hidden text-center py-12">
            <span class="material-symbols-outlined text-4xl text-sage mb-2">history</span>
            <p class="text-sm text-forest/70">No transaction logs found.</p>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex justify-between items-center mt-6 pt-4 border-t border-sage/10">
            <button onclick="changePage(-1)" id="prev-btn" class="px-4 py-2 border border-sage/30 rounded-btn text-xs text-forest font-bold disabled:opacity-50">Previous</button>
            <span id="page-info" class="text-sm text-forest">Page 1 of 1</span>
            <button onclick="changePage(1)" id="next-btn" class="px-4 py-2 border border-sage/30 rounded-btn text-xs text-forest font-bold disabled:opacity-50">Next</button>
        </div>
    </div>
</seller-layout>

<script>
    const API_BASE = window.location.origin;
    let currentPage = 1;
    let pageLimit = 15;
    
    async function fetchAPI(url, options = {}) {
        const res = await fetch(url, options);
        if (res.status === 401 || res.status === 403) {
            sessionStorage.clear();
            window.location.href = '/auth/login.html';
            throw new Error('Unauthorized session.');
        }
        return res;
    }

    function getAuthHeaders() {
        const token = sessionStorage.getItem('tohfa_access_token') || sessionStorage.getItem('access_token');
        return {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        };
    }

    function formatINR(amount) {
        return '₹' + Number(amount).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(dt) {
        if (!dt) return '—';
        return new Date(dt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    async function loadLedger() {
        const start = document.getElementById('start-date').value;
        const end = document.getElementById('end-date').value;
        const type = document.getElementById('type-select').value;

        let query = `?page=${currentPage}&limit=${pageLimit}`;
        if (start) query += `&start_date=${start}`;
        if (end) query += `&end_date=${end}`;
        if (type) query += `&type=${type}`;

        try {
            const res = await fetchAPI(`${API_BASE}/api/payments/ledger/all${query}`, { headers: getAuthHeaders() });
            if (!res.ok) throw new Error();
            const resp = await res.json();
            const data = resp.data || {};
            const items = data.items || [];
            const pagination = data.pagination || { total: 0, pages: 1 };

            const tbody = document.getElementById('ledger-tbody');
            const empty = document.getElementById('ledger-empty-state');

            if (items.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            tbody.innerHTML = items.map(tx => `
                <tr class="hover:bg-parchment/10 transition-colors">
                    <td class="py-3 px-4">${formatDate(tx.date)}</td>
                    <td class="py-3 px-4 font-mono font-semibold text-xs text-forest/70">${tx.order_id || tx.id}</td>
                    <td class="py-3 px-4">
                        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${
                            tx.type === 'SALE' ? 'bg-forest/10 text-forest' : 
                            tx.type === 'REFUND' ? 'bg-error/10 text-error' : 'bg-violet/10 text-violet'
                        }">${tx.type}</span>
                    </td>
                    <td class="py-3 px-4 font-mono text-sm text-forest font-bold">${formatINR(tx.gross_amount)}</td>
                    <td class="py-3 px-4 font-mono text-sm text-forest/80">${formatINR(tx.platform_fee)}</td>
                    <td class="py-3 px-4 font-mono text-sm text-forest/80">${formatINR(tx.tax_amount)}</td>
                    <td class="py-3 px-4 font-mono text-sm font-bold ${tx.type === 'SALE' ? 'text-forest' : 'text-error'}">${formatINR(tx.net_amount)}</td>
                </tr>
            `).join('');

            document.getElementById('page-info').textContent = `Page ${currentPage} of ${pagination.pages || 1}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === pagination.pages || pagination.pages === 0;
        } catch (e) {
            console.error(e);
            // Fallback mock
            document.getElementById('ledger-tbody').innerHTML = `
                <tr>
                    <td class="py-3 px-4">12 Jun 2026</td>
                    <td class="py-3 px-4 font-mono font-semibold text-xs text-forest/70">TXN-0412</td>
                    <td class="py-3 px-4"><span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-forest/10 text-forest">SALE</span></td>
                    <td class="py-3 px-4 font-mono text-sm text-forest font-bold">₹1,400.00</td>
                    <td class="py-3 px-4 font-mono text-sm text-forest/80">₹112.00</td>
                    <td class="py-3 px-4 font-mono text-sm text-forest/80">₹14.00</td>
                    <td class="py-3 px-4 font-mono text-sm font-bold text-forest">₹1,274.00</td>
                </tr>
            `;
            document.getElementById('prev-btn').disabled = true;
            document.getElementById('next-btn').disabled = true;
        }
    }

    function changePage(dir) {
        currentPage += dir;
        loadLedger();
    }

    function clearFilters() {
        document.getElementById('start-date').value = '';
        document.getElementById('end-date').value = '';
        document.getElementById('type-select').value = '';
        currentPage = 1;
        loadLedger();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadLedger();
    });
</script>

<!-- Mobile Nav Injection -->
<script type="module">
  import { initMobileSellerNav } from '/components/MobileSellerNav.js';
  initMobileSellerNav('all-trans');
</script>

</body>
</html>
