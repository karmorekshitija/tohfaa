<script>

    function getTohfaToken() {
        try {
            const user = JSON.parse(sessionStorage.getItem('tohfa_user') || '{}');
            return user.token || user.accessToken || user.access_token || sessionStorage.getItem('tohfa_access_token');
        } catch(e) {
            return null;
        }
    }

    (async function verifySellerRole() {
        const token = getTohfaToken();
        if (!token) {
            window.location.href = '/auth/login.html';
            return;
        }
        try {
            const res = await fetch(`${window.location.origin}/api/profile/me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error('Unverified');
            const profile = await res.json();
            const user = profile.data || profile;
            if (user.role !== 'seller') {
                window.location.href = '/mobile-buyer/profile.html';
            }
        } catch (e) {
            window.location.href = '/auth/login.html';
        }
    })();

        // Confetti Logic
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = canvas.width / 2 + (Math.random() - 0.5) * 50;
                this.y = canvas.height * 0.4;
                this.size = Math.random() * 5 + 2;
                this.speedX = (Math.random() - 0.5) * 10;
                this.speedY = (Math.random() - 0.8) * 15;
                this.color = ['#3D6B4F', '#bceecb', '#C8973A', '#7B5EA7', '#f9faf5'][Math.floor(Math.random() * 5)];
                this.gravity = 0.25;
                this.alpha = 1;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 10;
            }

            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.008;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                
                // Draw small rectangular confetti or circles
                if (Math.random() > 0.5) {
                    ctx.fillRect(-this.size, -this.size, this.size * 2, this.size);
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function spawnConfetti() {
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }

        // Trigger animation
        setTimeout(() => {
            spawnConfetti();
            animate();
        }, 500);

        // Re-trigger on heading click for mobile fun
        document.querySelector('h2').addEventListener('click', () => {
            spawnConfetti();
        });
    </script>
</seller-layout>
</body></html>
