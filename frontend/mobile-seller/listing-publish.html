<!DOCTYPE html>

<html lang="en"><head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script src="/src/components/DeviceRedirect.js"></script>

<meta charset="utf-8"/>
<title>Tohfa Seller Studio - Listing Live!</title>
<!-- Google Fonts -->
  <!-- Tailwind CSS v3 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
  <script src="/components/seller-components.js"></script>
</head>
<body class="font-sans text-gray-800">
<seller-layout active-tab="catalog">
<main class="pt-20 md:pt-24 pb-12 min-h-screen">
<!-- BEGIN: Progress Stepper -->
<section class="max-w-4xl mx-auto px-4 mb-12">
<div class="flex items-center justify-between overflow-x-auto no-scrollbar py-4 gap-4 md:gap-0">
<!-- Step 1: Details -->
<div class="flex flex-col items-center flex-shrink-0 min-w-[70px]">
<a href="/mobile-seller/listing-details.html" class="flex flex-col items-center gap-1 cursor-pointer hover:opacity-80 transition-opacity">
<div class="w-8 h-8 rounded-full border-2 border-forest flex items-center justify-center mb-2">
<svg class="w-4 h-4 text-forest" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<span class="text-[9px] font-mono tracking-widest text-gray-400 uppercase">Details</span>
</a>
</div>
<div class="hidden md:block h-[1px] bg-gray-200 flex-grow mx-4"></div>
<!-- Step 2: Pricing -->
<div class="flex flex-col items-center flex-shrink-0 min-w-[70px]">
<a href="/mobile-seller/listing-pricing-a.html" class="flex flex-col items-center gap-1 cursor-pointer hover:opacity-80 transition-opacity">
<div class="w-8 h-8 rounded-full border-2 border-forest flex items-center justify-center mb-2">
<svg class="w-4 h-4 text-forest" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<span class="text-[9px] font-mono tracking-widest text-gray-400 uppercase">Pricing</span>
</a>
</div>
<div class="hidden md:block h-[1px] bg-gray-200 flex-grow mx-4"></div>
<!-- Step 3: Photos -->
<div class="flex flex-col items-center flex-shrink-0 min-w-[70px]">
<a href="/mobile-seller/listing-photos.html" class="flex flex-col items-center gap-1 cursor-pointer hover:opacity-80 transition-opacity">
<div class="w-8 h-8 rounded-full border-2 border-forest flex items-center justify-center mb-2">
<svg class="w-4 h-4 text-forest" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<span class="text-[9px] font-mono tracking-widest text-gray-400 uppercase">Photos</span>
</a>
</div>
<div class="hidden md:block h-[1px] bg-gray-200 flex-grow mx-4"></div>
<!-- Step 4: Shipping -->
<div class="flex flex-col items-center flex-shrink-0 min-w-[70px]">
<a href="/mobile-seller/listing-shipping.html" class="flex flex-col items-center gap-1 cursor-pointer hover:opacity-80 transition-opacity">
<div class="w-8 h-8 rounded-full border-2 border-forest flex items-center justify-center mb-2">
<svg class="w-4 h-4 text-forest" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<span class="text-[9px] font-mono tracking-widest text-gray-400 uppercase">Shipping</span>
</a>
</div>
<div class="hidden md:block h-[1px] bg-gray-200 flex-grow mx-4"></div>
<!-- Step 5: Preview -->
<div class="flex flex-col items-center flex-shrink-0 min-w-[70px]">
<a href="/mobile-seller/listing-preview.html" class="flex flex-col items-center gap-1 cursor-pointer hover:opacity-80 transition-opacity">
<div class="w-8 h-8 rounded-full border-2 border-forest flex items-center justify-center mb-2">
<svg class="w-4 h-4 text-forest" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<span class="text-[9px] font-mono tracking-widest text-gray-400 uppercase">Preview</span>
</a>
</div>
<div class="hidden md:block h-[1px] bg-gray-200 flex-grow mx-4"></div>
<!-- Step 6: Publish -->
<div class="flex flex-col items-center flex-shrink-0 min-w-[70px]">
<div class="w-8 h-8 rounded-full bg-forest flex items-center justify-center mb-2 shadow-lg shadow-forest/20">
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<span class="text-[9px] font-mono tracking-widest text-forest font-bold uppercase border-b-2 border-forest pb-1">Publish</span>
</div>
</div>
</section>
<!-- END: Progress Stepper -->
<!-- BEGIN: Listing Live Success Card -->
<div class="max-w-2xl mx-auto px-4">
<div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 md:p-12 text-center min-h-[350px] flex flex-col justify-center" data-purpose="success-card">
  <!-- Loading View -->
  <div id="publish-loading" class="flex flex-col items-center justify-center py-12">
    <div class="w-16 h-16 border-4 border-forest border-t-transparent rounded-full animate-spin mb-6"></div>
    <h2 class="font-serif text-2xl text-forest font-bold mb-2">Publishing listing...</h2>
    <p class="text-gray-500 text-sm">Please wait while we publish your listing to the catalog.</p>
  </div>

  <!-- Success View (Hidden initially) -->
  <div id="publish-success" class="hidden flex flex-col items-center">
    <div class="mb-6 inline-flex items-center justify-center w-20 h-20 rounded-full border-[1.5px] border-forest relative">
      <div class="w-full h-full rounded-full border-forest animate-ping absolute opacity-20"></div>
      <svg class="w-10 h-10 text-forest" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24">
        <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>
    <h1 class="font-serif text-3xl md:text-4xl text-forest font-bold mb-4 flex items-center justify-center gap-2">
      Your listing is live! <span class="text-gold">✦</span>
    </h1>
    <p id="success-title-text" class="text-gray-600 text-lg md:text-xl mb-12 max-w-md mx-auto leading-relaxed">
      Midnight Jasmine Resin Study is now visible to buyers.
    </p>
    <!-- Action Buttons Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
      <!-- Share Post -->
      <button class="flex flex-col items-center justify-center gap-2 bg-violet text-white p-5 rounded-2xl hover:brightness-110 active:scale-95 transition-all min-h-[110px]" data-purpose="share-btn">
        <div class="bg-white/20 p-2 rounded-lg">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </div>
        <span class="text-[10px] font-mono tracking-widest uppercase font-bold">Share Post</span>
      </button>
      
      <!-- View Catalog -->
      <button id="btn-view-catalog" class="flex flex-col items-center justify-center gap-2 bg-parchment text-forest p-5 rounded-2xl hover:bg-[#efeadf] active:scale-95 transition-all border border-forest/10 min-h-[110px]" data-purpose="catalog-btn">
        <div class="bg-forest/10 p-2 rounded-lg">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </div>
        <span class="text-[10px] font-mono tracking-widest uppercase font-bold">View Catalog</span>
      </button>
    </div>
  </div>

  <!-- Error View -->
  <div id="publish-error" class="hidden flex flex-col items-center py-6">
    <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center text-red-600 mb-6 animate-pulse">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
    </div>
    <h2 class="font-serif text-2xl text-red-600 font-bold mb-2">Publishing Failed</h2>
    <p id="error-message" class="text-gray-500 text-sm mb-8 max-w-sm">An error occurred while publishing your listing.</p>
    <button id="btn-retry" class="px-8 py-3 bg-forest text-white font-bold rounded-full hover:bg-forest/90 active:scale-95 transition-all">Retry Publishing</button>
  </div>
</div>
</div>
<!-- END: Listing Live Success Card -->
<!-- Mobile Indicator -->
<div class="md:hidden mt-12 flex justify-center">
<div class="w-16 h-1.5 bg-gray-300 rounded-full"></div>
</div>
</main>
</seller-layout>

<script>
(function() {
  const DRAFT_ID = sessionStorage.getItem('draft_id');
  if (!DRAFT_ID) {
    window.location.href = '/mobile-seller/catalog.html';
    return;
  }

  const API_BASE = window.location.origin;

  function getToken() {
    try {
      const user = JSON.parse(sessionStorage.getItem('tohfa_user') || '{}');
      return user.token || user.accessToken || user.access_token || sessionStorage.getItem('tohfa_access_token');
    } catch { return null; }
  }

  function showView(viewId) {
    document.getElementById('publish-loading').classList.add('hidden');
    document.getElementById('publish-success').classList.add('hidden');
    document.getElementById('publish-error').classList.add('hidden');
    
    if (viewId === 'loading') {
      document.getElementById('publish-loading').classList.remove('hidden');
    } else if (viewId === 'success') {
      document.getElementById('publish-success').classList.remove('hidden');
    } else if (viewId === 'error') {
      document.getElementById('publish-error').classList.remove('hidden');
    }
  }

  async function publishListing() {
    showView('loading');
    const token = getToken();

    try {
      const res = await fetch(`${API_BASE}/api/seller/listings/${DRAFT_ID}`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ status: 'active' })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(errText || 'Failed to update status to active');
      }

      let title = 'Your listing';
      try {
        const draftData = JSON.parse(sessionStorage.getItem('draft_data') || '{}');
        title = draftData.title || title;
      } catch {}

      document.getElementById('success-title-text').textContent = `${title} is now visible to buyers.`;
      
      sessionStorage.removeItem('draft_id');
      sessionStorage.removeItem('draft_data');

      showView('success');
    } catch (err) {
      document.getElementById('error-message').textContent = err.message || 'An error occurred while publishing your listing.';
      showView('error');
    }
  }

  document.getElementById('btn-retry').addEventListener('click', publishListing);
  document.getElementById('btn-view-catalog').addEventListener('click', () => {
    window.location.href = '/mobile-seller/catalog.html';
  });

  publishListing();
})();
</script>
</body></html>
