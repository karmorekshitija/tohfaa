<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <script src="/src/components/DeviceRedirect.js"></script>

  <script src="/src/components/ReportWidget.js" defer></script>
  <script src="/src/components/ProtectedRoute.js"></script>
  <meta charset="utf-8">
  <title>Store Configuration | TOFA Seller Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/tailwind.css">
  <script src="/components/seller-components.js"></script>
</head>
<body class="bg-white text-[#1A1A1A] font-body p-4 min-h-screen">
<seller-layout active-tab="profile">
  <div class="mb-6">
    <h1 class="text-2xl font-heading font-bold text-primary">Store Settings</h1>
    <p class="text-xs text-[#717972]">Configure delivery rules, vacation controls, and policies.</p>
  </div>

  <!-- Content Sections -->
  <div class="space-y-6">
    <!-- Delivery Settings -->
    <div class="bg-[#F7F3EC]/30 border border-[#8FAF82]/20 rounded-xl p-5 shadow-sm space-y-4">
      <h2 class="text-lg font-heading font-bold text-primary flex items-center gap-2">
        <span class="material-symbols-outlined text-xl">local_shipping</span> Delivery Options
      </h2>
      <div class="flex items-center justify-between p-3 bg-white rounded-lg border border-[#8FAF82]/10">
        <div>
          <span class="font-bold text-sm block">Accept Orders</span>
          <span class="text-xs text-[#717972]">Enable or disable new order intakes</span>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input id="accept-orders-toggle" checked class="sr-only peer" type="checkbox">
          <div class="w-11 h-6 bg-[#8FAF82]/30 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-[#8FAF82]/40 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
        </label>
      </div>
      <div>
        <label class="block text-xs font-bold text-[#414942] mb-1">Flat Shipping Fee (₹)</label>
        <input id="flat-shipping-fee" class="w-full px-3 py-2 border border-[#8FAF82]/20 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary font-mono text-sm" type="number" value="150">
      </div>
      <button id="save-delivery-btn" class="w-full bg-primary text-white py-2.5 rounded-lg text-sm font-bold shadow-md shadow-primary/10">Save Delivery Options</button>
    </div>

    <!-- Store Policies -->
    <div class="bg-[#F7F3EC]/30 border border-[#8FAF82]/20 rounded-xl p-5 shadow-sm space-y-4">
      <h2 class="text-lg font-heading font-bold text-primary flex items-center gap-2">
        <span class="material-symbols-outlined text-xl">description</span> Return Policy
      </h2>
      <textarea id="policies-returns" class="w-full h-32 p-3 bg-white border border-[#8FAF82]/20 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary text-sm leading-relaxed" placeholder="Specify your store's return and refund terms here..."></textarea>
      <button id="save-policies-btn" class="w-full bg-primary text-white py-2.5 rounded-lg text-sm font-bold shadow-md shadow-primary/10">Save Policies</button>
    </div>
  </div>

  <!-- Toast Toast -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] items-center gap-3 px-5 py-3 rounded-full text-white text-sm font-bold shadow-lg transition-all duration-300"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = sessionStorage.getItem('tohfa_access_token') || sessionStorage.getItem('access_token');
      if (!token) {
        window.location.href = '/auth/login.html?next=/mobile-seller/store-config.html';
        return;
      }

      function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.style.backgroundColor = type === 'success' ? '#3D6B4F' : '#BA1A1A';
        toast.innerHTML = `<span>${message}</span>`;
        toast.classList.remove('hidden');
        toast.classList.add('flex');
        setTimeout(() => {
          toast.classList.add('hidden');
          toast.classList.remove('flex');
        }, 3000);
      }

      // Load config
      fetch('/api/seller/store-config', {
        headers: { 'Authorization': `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(resp => {
        const config = resp.data || resp;
        if (config.store_identity) {
          document.getElementById('accept-orders-toggle').checked = !!config.store_identity.is_accepting_orders;
        }
        if (config.shipping_defaults) {
          document.getElementById('flat-shipping-fee').value = config.shipping_defaults.default_dispatch_sla_days * 75 || 150;
        }
        if (config.vacation_note) {
          document.getElementById('policies-returns').value = config.vacation_note;
        }
      })
      .catch(err => console.error("Error loading config:", err));

      // Save delivery
      document.getElementById('save-delivery-btn').addEventListener('click', () => {
        const isAccepting = document.getElementById('accept-orders-toggle').checked;
        fetch('/api/seller/store-config', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            is_accepting_orders: isAccepting,
            accept_orders: isAccepting ? 1 : 0
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            showToast("Delivery settings updated!", "success");
          } else {
            showToast(data.message || "Failed to update", "error");
          }
        })
        .catch(() => showToast("Network error", "error"));
      });

      // Save policies
      document.getElementById('save-policies-btn').addEventListener('click', () => {
        const policyVal = document.getElementById('policies-returns').value.trim();
        fetch('/api/seller/store-config', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            vacation_note: policyVal
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            showToast("Policies updated!", "success");
          } else {
            showToast(data.message || "Failed to update", "error");
          }
        })
        .catch(() => showToast("Network error", "error"));
      });
    });
  </script>
</seller-layout>
</body>
</html>
