<style>

<script>
    const API_BASE = window.location.origin;

    function showToast(msg, type='success') {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            document.body.appendChild(toast);
        }
        toast.className = `fixed bottom-6 right-6 z-[300] flex items-center gap-3 px-5 py-3 rounded-xl shadow-lg text-sm font-medium transition-all transform duration-300 ${
            type === 'success' ? 'bg-[#3D6B4F] text-white' : 'bg-[#BA1A1A] text-white'
        }`;
        toast.innerHTML = `<span class="material-symbols-outlined">${type === 'success' ? 'check_circle' : 'error'}</span><span>${msg}</span>`;
        toast.style.display = 'flex';
        setTimeout(() => toast.style.display = 'none', 3500);
    }

    const dispatchSlaSelect = document.getElementById('dispatch-sla');
    const estDispatchP = document.getElementById('est-dispatch-p');
    const summaryPickupAddress = document.getElementById('summary-pickup-address');

    // Update Shipping Summary Card
    function updateShippingSummary() {
        if (dispatchSlaSelect) {
            estDispatchP.textContent = dispatchSlaSelect.options[dispatchSlaSelect.selectedIndex].text;
        }
        const selectedRadio = document.querySelector('input[name="pickup-address"]:checked');
        if (selectedRadio) {
            const labelEl = selectedRadio.closest('label');
            if (labelEl) {
                const nameEl = labelEl.querySelector('p');
                if (nameEl) {
                    summaryPickupAddress.textContent = nameEl.textContent.trim();
                }
            }
        }
    }

    if (dispatchSlaSelect) dispatchSlaSelect.addEventListener('change', updateShippingSummary);

    // Fetch and render addresses dynamically
    async function loadAddresses(selectedAddressId = null) {
        const token = sessionStorage.getItem('access_token') || sessionStorage.getItem('tohfa_access_token');
        const container = document.getElementById('address-cards-container');
        container.innerHTML = '';
        
        let addresses = [];
        try {
            const res = await fetch(`${API_BASE}/api/addresses`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const resp = await res.json();
                addresses = resp.data || resp || [];
            }
        } catch (err) {
            console.error('Failed to fetch addresses', err);
        }

        if (addresses.length === 0) {
            // No saved addresses — show empty state. Seller must add their own address.
            container.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center py-10 px-6 border-2 border-dashed border-secondary/30 rounded-2xl bg-white/50 text-center">
                    <svg class="w-10 h-10 mb-3 text-secondary/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <p class="font-semibold text-on-surface mb-1">No pickup address saved yet</p>
                    <p class="text-sm text-on-surface-variant mb-4">Add your studio or home address so buyers know where their order ships from.</p>
                    <button id="empty-state-add-btn" type="button" class="px-5 py-2 rounded-xl bg-primary text-white text-sm font-semibold hover:bg-primary/90 transition-all">+ Add Pickup Address</button>
                </div>
            `;
            const emptyBtn = document.getElementById('empty-state-add-btn');
            if (emptyBtn) emptyBtn.addEventListener('click', openAddressModal);
            return;
        }

        addresses.forEach((addr, i) => {
            const isChecked = selectedAddressId ? (String(addr.id) === String(selectedAddressId)) : (i === 0);
            const card = document.createElement('label');
            card.className = `bg-white border-2 p-6 rounded-2xl cursor-pointer shadow-sm relative flex items-start gap-4 hover:shadow-md transition-all ${
                isChecked ? 'border-primary' : 'border-secondary/20 bg-white/60'
            }`;
            card.innerHTML = `
                <input type="radio" name="pickup-address" value="${addr.id}" ${isChecked ? 'checked' : ''} class="mt-1.5 w-5 h-5 text-primary focus:ring-primary border-secondary/30"/>
                <div>
                    <p class="font-ui-serif font-semibold text-lg text-primary">${addr.full_name}</p>
                    <p class="text-on-surface-variant text-sm mt-1 leading-relaxed">${addr.line1}, ${addr.city}, ${addr.state} ${addr.pincode}</p>
                </div>
            `;
            container.appendChild(card);

            // Re-bind radio listener
            card.querySelector('input').addEventListener('change', (e) => {
                document.querySelectorAll('input[name="pickup-address"]').forEach(r => {
                    const l = r.closest('label');
                    if (l) l.className = r.checked ? 'bg-white border-2 border-primary p-6 rounded-2xl cursor-pointer shadow-sm relative flex items-start gap-4 hover:shadow-md transition-all' : 'bg-white/60 border border-secondary/20 p-6 rounded-2xl cursor-pointer hover:bg-white/80 transition-all opacity-85 hover:opacity-100 flex items-start gap-4';
                });
                updateShippingSummary();
            });
        });
        updateShippingSummary();
    }

    // Load Shipping Draft
    async function loadShippingDraft() {
        const draftId = sessionStorage.getItem('draft_id');
        if (!draftId) {
            showToast('Please complete the Details step first.', 'error');
            setTimeout(() => {
                window.location.href = 'listing-details.html';
            }, 1500);
            return;
        }

        const token = sessionStorage.getItem('access_token') || sessionStorage.getItem('tohfa_access_token');
        try {
            const res = await fetch(`${API_BASE}/api/seller/listings/${draftId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const resp = await res.json();
                const listing = resp.data || resp;

                if (!listing.title || !listing.category) {
                    showToast('Please complete the Details step first.', 'error');
                    setTimeout(() => {
                        window.location.href = 'listing-details.html';
                    }, 1500);
                    return;
                }
                if (!listing.price_paise || listing.price_paise <= 0) {
                    showToast('Please complete the Pricing step first.', 'error');
                    setTimeout(() => {
                        window.location.href = 'listing-pricing-b.html';
                    }, 1500);
                    return;
                }
                if (!listing.photos || listing.photos.length === 0) {
                    showToast('Please upload at least one product photo first.', 'error');
                    setTimeout(() => {
                        window.location.href = 'listing-photos.html';
                    }, 1500);
                    return;
                }
                
                // Pre-fill fields
                if (listing.dispatch_sla_days) {
                    dispatchSlaSelect.value = listing.dispatch_sla_days;
                }
                await loadAddresses(listing.pickup_address_type);
                updateShippingSummary();
            } else {
                showToast('Failed to load draft details.', 'error');
                setTimeout(() => {
                    window.location.href = 'listing-details.html';
                }, 1500);
            }
        } catch (err) {
            console.error('Error loading shipping draft:', err);
            await loadAddresses();
        }
    }

    // Save Shipping Draft
    async function saveShipping(shouldRedirect) {
        const dispatch_sla_days = parseInt(dispatchSlaSelect.value) || 5;
        const selectedRadio = document.querySelector('input[name="pickup-address"]:checked');
        if (!selectedRadio) {
            showToast('Please add and select a pickup address before continuing.', 'error');
            return;
        }
        const pickup_address_type = selectedRadio.value;

        const token = sessionStorage.getItem('access_token') || sessionStorage.getItem('tohfa_access_token');
        const draftId = sessionStorage.getItem('draft_id');

        if (!draftId) {
            showToast('No listing draft ID found. (Redirecting to preview...)', 'error');
            if (shouldRedirect) {
                setTimeout(() => {
                    window.location.href = 'listing-preview.html';
                }, 1000);
            }
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/api/seller/listings/${draftId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    shipping_method: 'courier',
                    ships_in_days: dispatch_sla_days,
                    dispatch_sla_days,
                    pickup_address_type,
                    status: 'draft'
                })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Failed to save listing shipping details');

            showToast('Shipping details saved successfully!', 'success');
            if (shouldRedirect) {
                window.location.href = 'listing-preview.html';
            }
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    // Header Save Draft
    const headerSaveBtn = document.getElementById('header-save-draft-btn');
    if (headerSaveBtn) {
        headerSaveBtn.addEventListener('click', () => {
            const token = sessionStorage.getItem('access_token') || sessionStorage.getItem('tohfa_access_token');
            if (!token) {
                showToast('Draft shipping saved successfully (offline mode)!', 'success');
                return;
            }
            saveShipping(false);
        });
    }

    // Header Next Step
    const headerNextBtn = document.getElementById('header-next-step-btn');
    if (headerNextBtn) {
        headerNextBtn.addEventListener('click', () => {
            const token = sessionStorage.getItem('access_token') || sessionStorage.getItem('tohfa_access_token');
            if (!token) {
                window.location.href = 'listing-preview.html';
                return;
            }
            saveShipping(true);
        });
    }

    // Header Back Step
    const headerBackBtn = document.getElementById('header-back-btn');
    if (headerBackBtn) {
        headerBackBtn.addEventListener('click', () => {
            window.location.href = 'listing-pricing-b.html';
        });
    }

    // Address Modal Controls
    const addressModal = document.getElementById('address-modal');
    const btnAddAddress = document.getElementById('btn-add-address');
    const btnCloseAddressModal = document.getElementById('close-address-modal');
    const btnCancelAddress = document.getElementById('cancel-address-btn');
    const addressForm = document.getElementById('address-form');

    function openAddressModal() {
        addressForm.reset();
        addressModal.classList.remove('hidden');
    }

    function closeAddressModal() {
        addressModal.classList.add('hidden');
    }

    if (btnAddAddress) btnAddAddress.addEventListener('click', openAddressModal);
    if (btnCloseAddressModal) btnCloseAddressModal.addEventListener('click', closeAddressModal);
    if (btnCancelAddress) btnCancelAddress.addEventListener('click', closeAddressModal);

    if (addressForm) {
        addressForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = sessionStorage.getItem('access_token') || sessionStorage.getItem('tohfa_access_token');
            const payload = {
                full_name: document.getElementById('addr-label').value,
                phone: document.getElementById('addr-phone').value || null,
                line1: document.getElementById('addr-line').value,
                line2: document.getElementById('addr-line2').value || null,
                city: document.getElementById('addr-city').value,
                state: document.getElementById('addr-state').value,
                pincode: document.getElementById('addr-pincode').value,
                is_default: document.getElementById('addr-default').checked
            };

            try {
                const res = await fetch(`${API_BASE}/api/addresses`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Failed to create address');
                
                showToast('Address added successfully!', 'success');
                closeAddressModal();
                await loadAddresses(data.data?.id || data.id);
            } catch (err) {
                showToast(err.message, 'error');
            }
        });
    }



    window.addEventListener('DOMContentLoaded', () => {
        loadShippingDraft();

        const sidebar = document.querySelector('seller-sidebar');
        if (sidebar) {
          sidebar.addEventListener('click', async (e) => {
            const link = e.target.closest('a');
            if (!link) return;
            const href = link.getAttribute('href');
            if (!href) return;
            if (hasUnsavedWork()) {
              e.preventDefault();
              await autoSaveDraft();
              showToast('Progress auto-saved as draft ✦', 'success');
              setTimeout(() => { window.location.href = href; }, 700);
            }
          });
        }
    });

    function hasUnsavedWork() {
      return !!sessionStorage.getItem('draft_id');
    }
    async function autoSaveDraft() {
      try { await saveShipping(false); } catch(e) { console.warn('Auto-save failed:', e); }
    }
</script>

<!-- Injected Standard Seller Studio Script (Tasks 38, 39) -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const token = sessionStorage.getItem('tohfa_access_token') || sessionStorage.getItem('access_token');
  
  // 1. Auth check: if no token is found, redirect to login
  if (!token && (window.location.protocol.startsWith('http'))) {
    window.location.href = '/auth/login.html?next=' + encodeURIComponent(window.location.pathname);
    return;
  }
  
  // 2. Handle ZAI Mode State & UI Sync
  let zaiEnabled = localStorage.getItem('zai_mode') === 'true';
  updateZaiUI(zaiEnabled);
  
  if (token) {
    fetch('/api/seller/dashboard', {
      headers: { 'Authorization': `Bearer ${token}` }
    })
    .then(res => res.json())
    .then(data => {
      if (data && data.success && data.data && data.data.seller) {
        const dbEnabled = !!data.data.seller.zai_mode_enabled;
        localStorage.setItem('zai_mode', dbEnabled ? 'true' : 'false');
        updateZaiUI(dbEnabled);
      }
    })
    .catch(err => console.error("Error syncing ZAI Mode:", err));
  }
  
  // 3. Set up click listener on toggle button
  const toggleBtn = document.getElementById('zai-toggle-btn');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      const isEnabled = toggleBtn.classList.contains('bg-tertiary');
      const nextEnabled = !isEnabled;
      
      updateZaiUI(nextEnabled);
      localStorage.setItem('zai_mode', nextEnabled ? 'true' : 'false');
      
      if (token) {
        fetch('/api/seller/zai-mode', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ enabled: nextEnabled })
        })
        .then(res => res.json())
        .then(data => {
          if (!data || !data.success) {
            console.error("Failed to update ZAI Mode in DB");
          }
        })
        .catch(err => console.error("Error updating ZAI Mode:", err));
      }
    });
  }
  
  function updateZaiUI(enabled) {
    const btn = document.getElementById('zai-toggle-btn');
    if (btn) {
      if (enabled) {
        btn.classList.add('bg-tertiary', 'text-white');
        btn.classList.remove('text-tertiary');
        const icon = btn.querySelector('.material-symbols-outlined');
        if (icon) icon.style.fontVariationSettings = "'FILL' 1";
      } else {
        btn.classList.remove('bg-tertiary', 'text-white');
        btn.classList.add('text-tertiary');
        const icon = btn.querySelector('.material-symbols-outlined');
        if (icon) icon.style.fontVariationSettings = "'FILL' 0";
      }
    }
    
    // Find all zai tips / cards on the page and show/hide them
    const selectors = [
      '.zai-tip-card',
      '[class*="zai-tip"]',
      '[id*="zai-tip"]',
      'aside .bg-tertiary-container\/10',
      'section .bg-tertiary-fixed-dim\/40',
      'div .bg-on-tertiary-fixed\/10'
    ];
    selectors.forEach(sel => {
      try {
        const els = document.querySelectorAll(sel);
        els.forEach(el => {
          if (el.id === 'zai-toggle-btn' || el.closest('#zai-toggle-btn')) return;
          el.style.display = enabled ? '' : 'none';
        });
      } catch (e) {}
    });
  }
  
  // 4. Handle View Store button relative link click or navigation
  const viewStoreBtn = document.querySelector('aside button:last-of-type, aside button.bg-forest');
  if (viewStoreBtn) {
    viewStoreBtn.addEventListener('click', () => {
      if (token) {
        fetch('/api/seller/profile', {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => {
          const profileData = data.data || data;
          if (profileData && (profileData.user_id || profileData.seller_id || profileData.id)) {
            window.location.href = `/buyer/seller-profile.html?id=${profileData.user_id || profileData.seller_id || profileData.id}`;
          } else {
            window.location.href = '/';
          }
        })
        .catch(err => {
          console.error(err);
          window.location.href = '/';
        });
      } else {
        window.location.href = '/';
      }
    });
  }

  // Handle Logout button click
  const logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', () => {
      const refresh = sessionStorage.getItem('tohfa_refresh_token') || sessionStorage.getItem('refresh_token');
      const accessToken = sessionStorage.getItem('tohfa_access_token') || sessionStorage.getItem('access_token');
      if (accessToken && refresh) {
        fetch('/api/auth/logout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
          body: JSON.stringify({ refresh_token: refresh })
        }).catch(() => {});
      }
      sessionStorage.clear();
      window.location.href = '/auth/login.html';
    });
  }
});
</script>
