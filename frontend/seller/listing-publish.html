        .material-symbols-outlined {

        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }
        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #3D6B4F; /* Forest */
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

</div>

<!-- (5) Footer -->

    </div>
  </div>
</div>

</div>
</seller-layout>

<script>
    const API_BASE_URL = window.location.origin;

    document.getElementById('share-instagram-btn').addEventListener('click', () => {
        console.log('Instagram share action triggered');
    });

    document.addEventListener('DOMContentLoaded', async () => {
        const token = sessionStorage.getItem('access_token') || sessionStorage.getItem('tohfa_access_token');
        if (!token) { window.location.href = '/auth/login.html'; return; }

        // Role verification
        try {
            const pr = await fetch(`${API_BASE_URL}/api/profile/me`, { headers: { 'Authorization': `Bearer ${token}` } });
            if (!pr.ok) throw new Error();
            const pd = await pr.json();
            const u = pd.data || pd;
            if (u.role !== 'seller') { window.location.href = '/buyer/profile.html'; return; }
        } catch {
            sessionStorage.clear();
            window.location.href = '/auth/login.html';
            return;
        }

        // View Store Footer Link
        const viewStoreBtn = document.getElementById('view-store-btn-footer');
        if (viewStoreBtn) {
            viewStoreBtn.addEventListener('click', () => {
                fetch(`${API_BASE_URL}/api/seller/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(res => res.json())
                .then(data => {
                    const profileData = data.data || data;
                    if (profileData && (profileData.user_id || profileData.seller_id || profileData.id)) {
                        window.location.href = `/buyer/seller-profile.html?id=${profileData.user_id || profileData.seller_id || profileData.id}`;
                    } else {
                        window.location.href = '/';
                    }
                })
                .catch(err => {
                    console.error('Error fetching seller profile:', err);
                    window.location.href = '/';
                });
            });
        }

        // Populate title and clear session storage draft
        const pubTitle = sessionStorage.getItem('published_title');
        if (pubTitle) {
            document.getElementById('published-subline').textContent = `${pubTitle} is now visible to buyers.`;
            sessionStorage.removeItem('draft_id');
            sessionStorage.removeItem('published_title');
        }
    });
</script>
</body>
</html>
