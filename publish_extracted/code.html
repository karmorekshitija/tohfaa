<script data-purpose="mobile-menu-handlers">
    const menuToggle = document.getElementById('menu-toggle');
    const menuClose = document.getElementById('menu-close');
    const mobileMenu = document.getElementById('mobile-menu');

    function toggleMenu() {
      if (mobileMenu.classList.contains('menu-closed')) {
        mobileMenu.classList.remove('menu-closed');
        mobileMenu.classList.add('menu-open');
        document.body.style.overflow = 'hidden'; // Prevent scrolling when menu open
      } else {
        mobileMenu.classList.remove('menu-open');
        mobileMenu.classList.add('menu-closed');
        document.body.style.overflow = '';
      }
    }

    menuToggle.addEventListener('click', toggleMenu);
    menuClose.addEventListener('click', toggleMenu);

    // Close menu on resize to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768 && mobileMenu.classList.contains('menu-open')) {
        toggleMenu();
      }
    });
  </script>
<!-- END: Interactive Logic -->
